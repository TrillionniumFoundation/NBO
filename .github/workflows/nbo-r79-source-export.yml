name: NBO R79 pinned source export
on:
  push:
    branches: [revision/econometrica-nbo-r79-referee-revision-2026-10-12]
    paths: [.github/workflows/nbo-r79-source-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /revisions/2026-10-10-r62/
            /revisions/2026-10-10-r63/
            /revisions/2026-10-10-r64/
            /revisions/2026-10-10-r65/
            /revisions/2026-10-10-r66/
            /revisions/2026-10-10-r67/
            /revisions/2026-10-11-r69/
            /revisions/2026-10-11-r70/
            /revisions/2026-10-11-r72/
            /revisions/2026-10-11-r73/
            /revisions/2026-10-11-r77/
            /revisions/2026-10-11-r78/
            /reviews/2026-10-11-econometrica-numerical-methods-r67/
      - name: Export pinned ordinary sources and evidence without font files
        run: |
          python3 - <<'PY'
          import pathlib,zipfile,json,subprocess,hashlib
          root=pathlib.Path('.')
          banned={'.ttf','.otf','.woff','.woff2','.pfb','.pfa','.afm','.tfm'}
          records={}
          with zipfile.ZipFile('NBO_R79_BASELINE.zip','w',zipfile.ZIP_DEFLATED,compresslevel=1) as out:
            for folder in ('revisions','reviews'):
              for p in sorted((root/folder).rglob('*')):
                if p.is_file() and '__pycache__' not in p.parts and p.suffix.lower() not in banned:
                  out.write(p,str(p));records[str(p)]=hashlib.sha256(p.read_bytes()).hexdigest()
            out.writestr('EXPORT_IDENTITY.json',json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'baseline':'6b88c6b3a61193c98c822bd62af1203df09c992d','sha256':records},indent=2))
          print(len(records),pathlib.Path('NBO_R79_BASELINE.zip').stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r79-pinned-baseline
          path: NBO_R79_BASELINE.zip
          retention-days: 7
          compression-level: 0
