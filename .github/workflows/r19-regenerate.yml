name: R19 scientific regeneration
on:
  push:
    branches: [revision/econometrica-r19-development-2026-09-20]
    paths:
      - replication/r19/generate.py
      - .github/workflows/r19-regenerate.yml
permissions:
  contents: write
concurrency:
  group: r19-scientific-regeneration
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      R19_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed scientific dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Regenerate scientific witnesses
        run: python -u replication/r19/generate.py
      - name: Deposit generated data on the author branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'revision/econometrica-r19-development-2026-09-20'
          git config user.name 'NBO Replication'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add replication/r19/output
          if ! git diff --cached --quiet; then
            git commit -m 'data(r19): deposit regenerated witnesses for independent checking'
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r19-generated-evidence
          retention-days: 30
          if-no-files-found: warn
          path: replication/r19/output
