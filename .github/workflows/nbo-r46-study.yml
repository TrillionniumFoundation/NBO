name: NBO R46 witness study
on:
  push:
    branches: [revision/econometrica-nbo-r46-witness-source-2026-10-07]
    paths: ['.github/workflows/nbo-r46-study.yml']
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            revisions/2026-10-07-r45
            revisions/2026-10-07-r46
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.1.3
      - name: Exact regressions
        run: python revisions/2026-10-07-r46/code/tests.py
      - name: Full predeclared matched catalogue
        run: python revisions/2026-10-07-r46/code/execute.py
      - name: Commit immutable evidence
        run: |
          git config user.name 'NBO revision automation'
          git config user.email 'nbo-revision@users.noreply.github.com'
          target=revision/econometrica-nbo-r46-witness-evidence-2026-10-07
          if git ls-remote --exit-code --heads origin "$target"; then exit 1; fi
          git switch -c "$target"
          git add -f revisions/2026-10-07-r46/results revisions/2026-10-07-r46/audit
          git commit -m 'R46: complete frozen witness-policy catalogue, 36 services and 216 rungs'
          git push origin "HEAD:refs/heads/$target"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r46-study
          path: revisions/2026-10-07-r46
          retention-days: 30
