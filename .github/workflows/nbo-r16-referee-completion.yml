name: NBO R16 completed referee revision
on:
  push:
    branches: [revision/econometrica-nbo-r16-referee-completion-source-2026-10-04]
    paths:
      - .github/workflows/nbo-r16-referee-completion.yml
      - revisions/2026-10-04-r16/publication/completion/**
permissions:
  contents: read
concurrency:
  group: nbo-r16-referee-completion
  cancel-in-progress: false
jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      NBO_R16_PUBLICATION_SOURCE: ${{ github.sha }}
      P: revisions/2026-10-04-r16/publication
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Assemble immutable history and all registered evidence trees
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for b in revision/econometrica-nbo-r16-referee-ready-2026-10-04 revision/econometrica-nbo-r16-referee-evidence-2026-10-04; do
            test -z "$(git ls-remote --heads origin "refs/heads/$b")" || { echo "Refusing existing branch $b"; exit 1; }
          done
          git config user.name 'NBO Revision Builder'
          git config user.email 'nbo-revision-builder@users.noreply.github.com'
          printf '/*\n!*.npz\n!*.npy\n!*.pt\n' | git sparse-checkout set --no-cone --stdin
          for s in 503a724817899105a78f8c2fd516f417efb6b483 2f17d8163a1d1d6b72a32b6ea6d6b683dc62031e 103b6717dac939cb9cd18876f56d889c9e2a751d 0b0b113b8c249d916daf0da22808180ce15caa2f cb4595bbcc7147e47e44ba40cb2f5034510ae19f; do
            git fetch --filter=blob:none --no-tags origin "$s"
            git merge --no-ff --no-edit "$s"
          done
          python "$P/complete_source/install.py"
          python "$P/completion/complete.py" restore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned mathematical and publication dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5 scipy==1.17.0 numba==0.65.1 mpmath==1.3.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-science texlive-fonts-recommended cm-super latexmk poppler-utils
      - name: Run every inherited mathematical test and the new active-face checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$P/checks/remote"
          for suite in signed_tests.py menu_tests.py menu_verification_tests.py menu_pipeline_tests.py menu_transport_tests.py robustness_tests.py; do
            python -m unittest discover -s revisions/2026-10-04-r16/code -p "$suite" -v > "$P/checks/remote/$suite.stdout" 2>&1 || { cat "$P/checks/remote/$suite.stdout"; exit 1; }
            cat "$P/checks/remote/$suite.stdout"
          done
          python -m unittest discover -s "$P/code" -p test_decision_value.py -v > "$P/checks/remote/test_decision_value.py.stdout" 2>&1 || { cat "$P/checks/remote/test_decision_value.py.stdout"; exit 1; }
          python -m unittest discover -s "$P/completion" -p test_active_face_value.py -v > "$P/checks/remote/test_active_face_value.py.stdout" 2>&1 || { cat "$P/checks/remote/test_active_face_value.py.stdout"; exit 1; }
          python revisions/2026-10-04-r16/code/strong_hjb_tests.py --out "$P/checks/remote/STRONG_HJB.json" > "$P/checks/remote/strong_hjb.stdout" 2>&1 || { cat "$P/checks/remote/strong_hjb.stdout"; exit 1; }
      - name: Recompute interval arithmetic, integrate manuscript, compile and audit
        shell: bash
        run: |
          set -euo pipefail
          python "$P/code/completed_evidence_audit.py"
          python "$P/completion/complete.py" assemble
          python "$P/code/build.py"
          git add -- ECTA.tex supp.tex README.md
          git add -f -- "$P"
          python "$P/code/publication_audit.py"
          python "$P/completion/complete.py" audit
          git add -f -- "$P"
      - name: Publish only new revision branches after all integrity gates pass
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote --heads origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git commit -m 'revision(r16): complete NBO referee revision with active-face theorem, full evidence, article, supplement and response'
          leases=(); destinations=()
          for b in revision/econometrica-nbo-r16-referee-ready-2026-10-04 revision/econometrica-nbo-r16-referee-evidence-2026-10-04; do
            test -z "$(git ls-remote --heads origin "refs/heads/$b")"
            leases+=("--force-with-lease=refs/heads/$b:")
            destinations+=("HEAD:refs/heads/$b")
          done
          git push --atomic "${leases[@]}" origin "${destinations[@]}"
          printf '{"publication_commit":"%s","source_commit":"%s"}\n' "$(git rev-parse HEAD)" "$GITHUB_SHA" > PUBLICATION_COMMIT.json
          cat PUBLICATION_COMMIT.json >> "$GITHUB_STEP_SUMMARY"
      - name: Package editable reading sources, full PDFs and receipts
        if: always()
        shell: bash
        run: python "$P/completion/complete.py" package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r16-completed-referee-${{ github.run_id }}
          path: |
            nbo-r16-referee-completed.tar.gz
            PUBLICATION_COMMIT.json
            revisions/2026-10-04-r16/publication/build/*.pdf
            revisions/2026-10-04-r16/publication/completion/FINAL_COMPLETION_AUDIT.json
          if-no-files-found: error
          retention-days: 90
