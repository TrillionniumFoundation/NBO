name: NBO R28 scientific source
on:
  push:
    branches: ['revision/econometrica-nbo-r28-2026-10-06']
    paths: ['.github/workflows/nbo-r28-source-api.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Retrieve immutable scientific sources
        run: |
          python - <<'PY'
          import os,json,base64,pathlib,urllib.request,urllib.parse,zipfile,concurrent.futures,time,re,hashlib
          root='https://api.github.com/repos/TrillionniumFoundation/NBO/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          ref=os.environ['GITHUB_SHA']; files={}; identities={}
          def request(path):
              for i in range(4):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(root+path,headers=headers),timeout=90) as r: return json.load(r)
                  except Exception:
                      if i==3: raise
                      time.sleep(2**i)
          def content(path): return request('contents/'+urllib.parse.quote(path,safe='/')+'?ref='+ref)
          def keep(path,raw,sha):
              actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              if actual!=sha: raise RuntimeError('Blob mismatch '+path)
              files[path]=raw;identities[path]=sha
          pending=['ECTA.tex','supp.tex','revisions/2026-10-05-r21/applications.tex','econsocart.cls','econsocart.cfg','ecta-fullname.bst']
          while pending:
              path=pending.pop()
              if path in files: continue
              b=content(path); raw=base64.b64decode(b['content']);keep(path,raw,b['sha'])
              if path.endswith('.tex'):
                  text=raw.decode()
                  for p in re.findall(r'\\(?:input|include)\{([^}]+)\}',text):
                      if '\\' not in p: pending.append(p if pathlib.Path(p).suffix else p+'.tex')
                  for group in re.findall(r'\\bibliography\{([^}]+)\}',text):
                      pending.extend(p.strip()+'.bib' for p in group.split(',') if '\\' not in p)
          allowed={'.tex','.bib','.cls','.cfg','.sty','.bst','.py','.md','.json','.csv','.txt','.sh','.toml','.yml','.yaml','.b64'}
          rows=[]
          def collect(sha,prefix):
              t=request('git/trees/'+sha+'?recursive=1')
              if t.get('truncated'):
                  for r in request('git/trees/'+sha)['tree']:
                      p=prefix+r['path']
                      if r['type']=='tree' and r['path'] not in {'primary','records','candidates','raw','streams'}: collect(r['sha'],p+'/')
                      elif r['type']=='blob': rows.append(dict(r,path=p))
              else:
                  rows.extend(dict(r,path=prefix+r['path']) for r in t['tree'] if r['type']=='blob')
          for entry in content('revisions'):
              if re.search(r'-r(?:22|23|24|25|26|27)$',entry['name']):
                  collect(entry['sha'],entry['path']+'/')
          rows=[r for r in rows if r['path'] not in files and pathlib.Path(r['path']).suffix in allowed and r.get('size',0)<1000000 and not r['path'].endswith('.jsonl')]
          bysha={r['sha']:r for r in rows}
          def load(sha):
              b=request('git/blobs/'+sha)
              return sha,base64.b64decode(b['content'])
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool: data=dict(pool.map(load,bysha))
          for r in rows: keep(r['path'],data[r['sha']],r['sha'])
          with zipfile.ZipFile('/tmp/NBO_R28_source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p,b in files.items(): z.writestr(p,b)
              z.writestr('SOURCE_COMMIT.txt',ref)
              z.writestr('SOURCE_IDENTITIES.json',json.dumps(identities,indent=2))
          print('Preserved',len(files),'scientific source files at',ref)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r28-source
          path: /tmp/NBO_R28_source.zip
          if-no-files-found: error
