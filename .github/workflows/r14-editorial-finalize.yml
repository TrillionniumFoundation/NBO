name: R14 final typesetting and sealed referee package
on:
  push:
    branches: [revision/econometrica-r14-development-2026-09-19]
    paths: [.github/workflows/r14-editorial-finalize.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: r14-referee-deposit
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      REL: revisions/2026-09-19-r14-referee-response
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revision/econometrica-r14-development-2026-09-19
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 PyMuPDF==1.26.7
      - name: Require completed independent scientific deposit
        run: |
          test "$GITHUB_REF_NAME" = revision/econometrica-r14-development-2026-09-19
          test -f "$REL/release_manifest.json"
          python replication/r14/review.py --integrity-only --receipt /tmp/r14-pre-editorial-review.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('revisions/2026-09-19-r14-referee-response/logs/independent-validation.json')
          d=json.loads(p.read_text())
          if d.get('all_passed') is not True or d.get('checked_dynamic_problems')!=583: raise ValueError('completed scientific validation required')
          if len(d.get('negative_tests',{}))!=8 or not all(d['negative_tests'].values()): raise ValueError('all negative fixtures required')
          PY
      - name: Correct participation-subscript typography without changing the theorem
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('revisions/2026-09-19-r14-referee-response/paper/main.tex')
          s=p.read_text();old='\\sup_{j,p,q\\ {'+'\n'+'m participating}}';new='\\sup_{j,p,q\\;\\mathrm{participating}}'
          if s.count(old)!=1: raise ValueError('unexpected source for typography correction')
          p.write_text(s.replace(old,new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REL/paper/main.tex"
          git commit -m 'revision(r14): correct participation subscript in continuum theorem [skip ci]'
          git fetch origin revision/econometrica-r14-development-2026-09-19
          git rebase origin/revision/econometrica-r14-development-2026-09-19
          git push origin HEAD:refs/heads/revision/econometrica-r14-development-2026-09-19
          git rev-parse HEAD > /tmp/r14-editorial-source-sha.txt
      - name: Install manuscript compilation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-extra texlive-fonts-recommended
      - name: Recompile, reseal and independently rebuild final manuscripts
        run: |
          set -euo pipefail
          cp "$REL/logs/independent-validation.json" /tmp/r14-preserved-independent-validation.json
          python -u replication/r14/publish.py --receipt /tmp/r14-preserved-independent-validation.json --source-commit "$(cat /tmp/r14-editorial-source-sha.txt)" 2>&1 | tee /tmp/r14-final-publication.log
          python -u replication/r14/review.py --compile-only --receipt /tmp/r14-final-review.json 2>&1 | tee /tmp/r14-final-review.log
          git add "$REL/paper" "$REL/release_manifest.json"
          git add -f "$REL/ECTA_R14.pdf" "$REL/SUPP_R14.pdf" "$REL/RESPONSE_R14.pdf" "$REL/COMPENDIUM_R14.pdf" "$REL/logs/manuscripts.json"
          git commit -m 'revision(r14): deposit final typeset and independently rebuilt referee manuscripts [skip ci]'
          git fetch origin revision/econometrica-r14-development-2026-09-19
          git rebase origin/revision/econometrica-r14-development-2026-09-19
          git push origin HEAD:refs/heads/revision/econometrica-r14-development-2026-09-19
          git rev-parse HEAD > /tmp/r14-final-deposit-sha.txt
          python replication/r14/review.py --integrity-only --receipt /tmp/r14-final-post-commit-review.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r14-final-referee-package
          retention-days: 30
          path: |
            revisions/2026-09-19-r14-referee-response/README.md
            revisions/2026-09-19-r14-referee-response/release_manifest.json
            revisions/2026-09-19-r14-referee-response/paper
            revisions/2026-09-19-r14-referee-response/historical
            revisions/2026-09-19-r14-referee-response/logs
            revisions/2026-09-19-r14-referee-response/ECTA_R14.pdf
            revisions/2026-09-19-r14-referee-response/SUPP_R14.pdf
            revisions/2026-09-19-r14-referee-response/RESPONSE_R14.pdf
            revisions/2026-09-19-r14-referee-response/COMPENDIUM_R14.pdf
            /tmp/r14-editorial-source-sha.txt
            /tmp/r14-final-deposit-sha.txt
            /tmp/r14-final-review.json
            /tmp/r14-final-review.log
            /tmp/r14-final-publication.log
            /tmp/r14-final-post-commit-review.json
