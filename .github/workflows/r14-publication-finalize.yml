name: R14 publication metadata finalization

on:
  push:
    branches:
      - revision/econometrica-r14-independent-state-audit-2026-09-22

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[r14-status-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update publication provenance and revalidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          def replace_line(path, prefix, new):
              p=Path(path)
              lines=p.read_text().splitlines()
              hits=[i for i,s in enumerate(lines) if s.startswith(prefix)]
              if len(hits)!=1:
                  raise SystemExit(f'{path}: prefix {prefix!r}, found {len(hits)}')
              lines[hits[0]]=new
              p.write_text('\n'.join(lines)+'\n')

          replace_line(
            'REVISION_INDEX.md',
            'The current local scientific manuscript is',
            'The current scientific manuscript is **R14**. Start at R14_REVIEW.md.'
          )
          replace_line(
            'REVISION_INDEX.md',
            'The R14 branches exist **locally**.',
            'R14 is published on GitHub on revision/econometrica-r14-independent-state-audit-2026-09-22 and mirrored on revision/econometrica-r14-referee-copy-2026-09-22. Both descend from the latest R13 review input at 857bfeab28ca1b7a7f732edf180126f3ded6b451; main, the review branches, and earlier revision branches were not overwritten. The scientific tree was materialized on the remote review ancestry and revalidated on GitHub Actions before publication.'
          )
          replace_line(
            'R14_REVIEW.md',
            '**Current local manuscript:**',
            '**Current manuscript:** ECTA_R14.pdf / ECTA_R14.tex.'
          )
          replace_line(
            'R14_REVIEW.md',
            '**Remote status: not published by this session.**',
            '**Remote status: published.** The review target is on revision/econometrica-r14-independent-state-audit-2026-09-22 and is mirrored on revision/econometrica-r14-referee-copy-2026-09-22. Both descend from the exact R13 review base 857bfeab28ca1b7a7f732edf180126f3ded6b451; no prior branch was overwritten. Reconstructed local commit IDs remain provenance-only.'
          )
          replace_line(
            'revisions/2026-09-22-r14/response_to_referee.md',
            'All paths below are relative to',
            'All paths below are relative to revisions/2026-09-22-r14/ unless stated otherwise. The canonical evidence entry point is root R14_REVIEW.md. R14 is published on revision/econometrica-r14-independent-state-audit-2026-09-22 and mirrored on revision/econometrica-r14-referee-copy-2026-09-22. Both remote branches descend from the exact latest review commit 857bfeab28ca1b7a7f732edf180126f3ded6b451; no existing review, revision, or main branch was force-updated.'
          )
          replace_line(
            'revisions/2026-09-22-r14/response_to_referee.md',
            '**Status.** An actual local scientific revision now exists.',
            '**Status.** Resolved procedurally: an actual scientific revision exists and has been published on two new remote revision branches. Neither the prior review branches nor main were overwritten.'
          )
          replace_line(
            'revisions/2026-09-22-r14/response_to_referee.md',
            'It does **not** establish useful-accuracy whole-domain neural control,',
            'It does **not** establish useful-accuracy whole-domain neural control, the requested finer flagship tolerance sequence, two matched-accuracy classical state-space baselines, or the identical-pipeline exact-reference suite. These conditions remain visible to the next referee. A successful build or a valid but large neural bound is not represented as their closure. Remote publication is complete; it does not alter those substantive unresolved conditions.'
          )
          replace_line(
            'revisions/2026-09-22-r14/README.md',
            'Remote writes were unavailable in this session',
            'The delivered R14 tree has now been published on two new GitHub revision branches: revision/econometrica-r14-independent-state-audit-2026-09-22 and revision/econometrica-r14-referee-copy-2026-09-22. Both descend from the exact latest remote review commit 857bfeab28ca1b7a7f732edf180126f3ded6b451. The earlier publishing helper and local reconstructed commits remain provenance records; no synthetic reconstructed history was force-pushed over existing branches.'
          )

          manifest=Path('revisions/2026-09-22-r14/canonical_manifest.json')
          data=json.loads(manifest.read_text())
          for rel in [
              'REVISION_INDEX.md',
              'R14_REVIEW.md',
              'revisions/2026-09-22-r14/response_to_referee.md',
              'revisions/2026-09-22-r14/README.md',
          ]:
              data['source_files_sha256'][rel]=hashlib.sha256(Path(rel).read_bytes()).hexdigest()
          data['remote_publication']={
              'state':'published_pending_metadata_pin',
              'branches':[
                  'revision/econometrica-r14-independent-state-audit-2026-09-22',
                  'revision/econometrica-r14-referee-copy-2026-09-22'
              ],
              'review_base':'857bfeab28ca1b7a7f732edf180126f3ded6b451',
              'materialization_commit':'b30733758355b27174e01956e804422897a96f1e',
              'note':'The immediate follow-up metadata-only receipt commit pins the validated status-update commit.'
          }
          manifest.write_text(json.dumps(data,indent=2)+'\n')
          PY

          python -m pip install --quiet numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
          python revisions/2026-09-22-r14/replication/validate_revision.py

          rm -f .github/workflows/r14-publication-finalize.yml
          git add -A
          git status --short

      - name: Commit publication status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "publication(r14): record remote revision status and revalidate [r14-status-finalized]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
