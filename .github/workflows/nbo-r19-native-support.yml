name: NBO R19 native support
on:
  push:
    branches: [revision/econometrica-nbo-r19-response-2026-10-05]
    paths: [.github/workflows/nbo-r19-native-support.yml]
permissions:
  contents: read
jobs:
  support:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            econsocart.cfg
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r19-native-support
          path: econsocart.cfg
          if-no-files-found: error
          retention-days: 30
