name: NBO R13 fixed-work independent extension
on:
  push:
    branches: [revision/econometrica-nbo-r13-2026-10-04]
    paths: [.github/workflows/nbo-r13-extension.yml]
permissions:
  contents: read
env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
  NBO_R12_SOURCE_COMMIT: ${{ github.sha }}
jobs:
  fixed-work:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - {os: ubuntu-24.04, environment: ubuntu24, d: 10, seed: 7919}
          - {os: ubuntu-24.04, environment: ubuntu24, d: 20, seed: 7919}
          - {os: ubuntu-24.04, environment: ubuntu24, d: 50, seed: 7919}
          - {os: ubuntu-24.04, environment: ubuntu24, d: 10, seed: 15401}
          - {os: ubuntu-24.04, environment: ubuntu24, d: 20, seed: 15401}
          - {os: ubuntu-24.04, environment: ubuntu24, d: 50, seed: 15401}
          - {os: ubuntu-22.04, environment: ubuntu22, d: 10, seed: 7919}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 numba==0.65.1
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Execute fixed iterations and fresh final bank
        run: |
          set -euo pipefail
          python revisions/2026-10-04-r13/code/extension.py --dimension '${{ matrix.d }}' --seed '${{ matrix.seed }}' --environment '${{ matrix.environment }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r13-extension-${{ matrix.environment }}-${{ matrix.d }}-${{ matrix.seed }}-${{ github.run_id }}
          path: revisions/2026-10-04-r13/results/
          if-no-files-found: error
          retention-days: 90
