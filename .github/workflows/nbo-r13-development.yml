name: NBO R13 development verification
on:
  push:
    branches: [revision/econometrica-nbo-r13-development-2026-10-04]
permissions:
  contents: read
env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
jobs:
  materialize:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: source
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 65110ed2991f4b955d2df37b2ab8635b12df5d1c
          python revisions/2026-10-04-r13/prepare.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add revisions/2026-10-04-r13
          if ! git diff --cached --quiet; then
            git commit -m 'revision(r13): materialize inherited source and fixed-work additions [skip ci]'
            git push origin HEAD:refs/heads/revision/econometrica-nbo-r13-development-2026-10-04
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  smoke:
    needs: materialize
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NBO_R13_SOURCE_COMMIT: ${{ needs.materialize.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.materialize.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install numerical and journal dependencies
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 numba==0.65.1
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          sudo apt-get update -qq
          sudo apt-get install -y texlive-latex-extra texlive-science texlive-fonts-recommended poppler-utils
          git fetch --no-tags --depth=1 origin 840565f451be6103aeb325a8fc548a57507a8fb2
      - name: Execute tests and explicitly nonfinal development computations
        run: |
          set -euo pipefail
          mkdir -p revisions/2026-10-04-r13/logs
          python revisions/2026-10-04-r13/code/test_runner.py --inherited 2>&1 | tee revisions/2026-10-04-r13/logs/tests-development.log
          python revisions/2026-10-04-r13/code/run.py --shard 7919 --smoke 2>&1 | tee revisions/2026-10-04-r13/logs/primary-development.log
          python revisions/2026-10-04-r13/code/run.py --shard reference --smoke 2>&1 | tee revisions/2026-10-04-r13/logs/reference-development.log
          python revisions/2026-10-04-r13/code/extra_worker.py --seed 7919 --smoke 2>&1 | tee revisions/2026-10-04-r13/logs/extra-development.log
          python revisions/2026-10-04-r13/code/report.py --development > revisions/2026-10-04-r13/logs/report-development.log
          python revisions/2026-10-04-r13/code/extra_report.py --development > revisions/2026-10-04-r13/logs/extra-report-development.log
          python revisions/2026-10-04-r13/code/integrate.py
          python revisions/2026-10-04-r13/code/build.py 2>&1 | tee revisions/2026-10-04-r13/logs/build-development.log
      - name: Print precise failure diagnostics
        if: failure()
        run: |
          for f in revisions/2026-10-04-r13/logs/*.log; do echo "===== $f"; tail -60 "$f"; done
          for f in revisions/2026-10-04-r13/build/{ECTA,supp,response}.log; do echo "===== $f"; test ! -f "$f" || grep -B3 -A7 -E 'Overfull|undefined|^!' "$f" || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r13-development-${{ github.run_id }}
          path: |
            revisions/2026-10-04-r13/
            ECTA.tex
            supp.tex
          retention-days: 90
          if-no-files-found: error
