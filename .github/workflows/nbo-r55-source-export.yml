name: NBO R55 pinned source export
on:
  push:
    branches: [revision/econometrica-nbo-r55-referee-revision-2026-10-09]
    paths: [.github/workflows/nbo-r55-source-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /revisions/2026-10-08-r54/
            /reviews/2026-10-09-econometrica-numerical-methods-r54/
          sparse-checkout-cone-mode: false
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r55-pinned-r54-inputs
          path: |
            revisions/2026-10-08-r54/
            reviews/2026-10-09-econometrica-numerical-methods-r54/
          compression-level: 1
          retention-days: 30
