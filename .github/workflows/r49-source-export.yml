name: R49 pinned source export
on:
  push:
    branches: [revision/econometrica-r49-structural-diffuse-2026-09-26]
    paths: [.github/workflows/r49-source-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive sources and current evidence
        run: |
          git rev-parse HEAD > /tmp/SOURCE_COMMIT.txt
          python - <<'PY'
          import pathlib, subprocess, tarfile
          paths = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with tarfile.open('/tmp/NBO-r49-source.tar.gz','w:gz') as out:
              for name in paths:
                  p=pathlib.Path(name)
                  if p.is_file() and (p.suffix in {'.tex','.cls','.cfg','.bst','.sty','.py','.sh','.bib','.md','.yml'} or name.startswith('revisions/2026-09-26-r48/')):
                      out.add(name,arcname=name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: NBO-r49-compact-source
          path: |
            /tmp/NBO-r49-source.tar.gz
            /tmp/SOURCE_COMMIT.txt
          retention-days: 14
