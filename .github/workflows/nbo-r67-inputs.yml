name: NBO R67 pinned revision inputs
on:
  push:
    branches: [revision/econometrica-nbo-r67-referee-revision-2026-10-10]
    paths: [.github/workflows/nbo-r67-inputs.yml]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            revisions/2026-10-10-r62
            revisions/2026-10-10-r63
            revisions/2026-10-10-r64
            revisions/2026-10-10-r65
            revisions/2026-10-10-r66
      - name: Export unchanged sources and dependencies without scientific reruns
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,zipfile
          roots=[pathlib.Path('revisions')/('2026-10-10-r'+str(k)) for k in range(62,67)]
          prohibited={'.ttf','.otf','.woff','.woff2','.pfb','.pfa','.afm','.tfm'}
          hashes={}
          with zipfile.ZipFile('r67-inputs.zip','w',zipfile.ZIP_DEFLATED,compresslevel=1) as z:
              for root in roots:
                  for p in root.rglob('*'):
                      if not p.is_file() or '__pycache__' in p.parts or p.suffix.lower() in prohibited:
                          continue
                      z.write(p,str(p));hashes[str(p)]=hashlib.sha256(p.read_bytes()).hexdigest()
              z.writestr('INPUTS67.json',json.dumps({'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'sha256':hashes,'new_scientific_observations':0},indent=2))
          print('Exported',len(hashes),'files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r67-immutable-inputs
          path: r67-inputs.zip
          retention-days: 30
          compression-level: 0
