name: NBO R95 integrated manuscript delivery
on:
  push:
    branches: [revision/econometrica-nbo-r95-integrated-2026-10-13]
    paths: [.github/workflows/nbo-r95-delivery.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nbo-r95-integrated-delivery
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      R: revisions/2026-10-13-r95
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /revisions/2026-10-13-r94/
            /revisions/2026-10-13-r95/
            /revisions/*/code/
            /revisions/2026-10-10-r62/inputs/
            /revisions/2026-10-11-r73/results73/
            /revisions/2026-10-11-r77/results77/summary.json
            /econsocart.cls
            /econsocart.cfg
            /ecta-fullname.bst
            /.github/workflows/nbo-r95-delivery.yml
      - name: Materialize checksum-verified manuscript and preserved history
        id: materialize
        run: python "$R/bootstrap/publish95.py" materialize
      - name: Commit source and frozen actors before remote replay
        run: |
          git config user.name 'NBO revision verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --force --sparse -- "$R" ":(exclude)$R/**/__pycache__/**" ":(exclude)$R/**/*.pyc"
          git commit -m 'R95: integrate original-topic Econometrica revision, proofs, response, and frozen evidence'
          git push origin HEAD:"$GITHUB_REF_NAME"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install pinned numerical and publisher build dependencies
        run: |
          python -m pip install -r "$R/requirements95.txt"
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended pandoc poppler-utils
      - name: Replay frozen actors and admit only byte-identical original records
        id: replay
        run: python "$R/bootstrap/publish95.py" replay --tag cloud95
      - name: Run all inherited and current tests without skips
        id: tests
        if: always() && steps.materialize.outcome == 'success'
        run: python "$R/code/run_tests95.py" --output-dir audit/remote95/tests
      - name: Independently check continuous policy bounds and paired inference
        id: independent
        if: always() && steps.replay.outcome == 'success'
        run: python "$R/code/audit94.py" --tag cloud95
      - name: Build four current documents from their actual TeX sources
        id: build
        if: always() && steps.materialize.outcome == 'success'
        run: python "$R/code/build95.py" --audit-dir audit/remote95/build
      - name: Write actual release gates and source-bound receipts
        id: release
        if: always() && steps.materialize.outcome == 'success'
        run: python "$R/bootstrap/publish95.py" release --tag cloud95
      - name: Retain manuscript PDFs, raw records, and all actual validation outcomes
        if: always() && steps.materialize.outcome == 'success'
        run: |
          git add --force --sparse -- "$R" ":(exclude)$R/**/__pycache__/**" ":(exclude)$R/**/*.pyc"
          if ! git diff --cached --quiet; then
            git commit -m 'R95: retain rebuilt manuscripts and source-bound remote validation evidence'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r95-integrated-${{ github.run_id }}
          path: revisions/2026-10-13-r95
          retention-days: 30
          if-no-files-found: error
