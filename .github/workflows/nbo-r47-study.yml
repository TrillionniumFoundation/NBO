name: NBO R47 executed comparisons
on:
  push:
    branches: [revision/econometrica-nbo-r47-executed-comparisons-2026-10-08]
    paths: ['.github/workflows/nbo-r47-study.yml']
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            revisions/2026-10-07-r45
            revisions/2026-10-07-r46
            revisions/2026-10-08-r47
            reviews/2026-10-08-econometrica-numerical-methods-r46
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact tested scientific sources
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('revisions/2026-10-08-r47/code')
          expected={'common.py':'6f2acece8a7fdb6a1b713684220165fb21b134cdc6e27cdff7f21b36e217f7ca','constrained.py':'4d3801c0c898a4778cd5068a3f9812ef1af0762b46d243d4d5def047d07bd3ff','execute.py':'ebfc5c19890dad8467268f5a078decb20984671a20c5ece25e7684bd15197e61','scalar.py':'7428b53e2d433a37af7072e1e2a709fd9787e80b3bafa31c299b4c061c9efa2b','tests.py':'3d2c52842c7ab595f1cef8a7fd49dd4581b144ece26af590fe6bc0dea317902c'}
          for n,h in expected.items():
              actual=hashlib.sha256((root/n).read_bytes()).hexdigest()
              assert actual==h,(n,actual,h)
          PY
      - name: Install numerical dependency
        run: python -m pip install numpy==2.1.3
      - name: Exact arithmetic and adversarial tests
        run: |
          mkdir -p revisions/2026-10-08-r47/audit
          set -o pipefail
          python revisions/2026-10-08-r47/code/tests.py 2>&1 | tee revisions/2026-10-08-r47/audit/TESTS_EXECUTION.log
      - name: Execute all declared services and direct comparisons
        run: |
          set -o pipefail
          python revisions/2026-10-08-r47/code/execute.py 2>&1 | tee revisions/2026-10-08-r47/audit/EXECUTION.log
      - name: Push new evidence branch
        run: |
          target=revision/econometrica-nbo-r47-evidence-2026-10-08
          if git ls-remote --exit-code --heads origin "$target"; then exit 1; fi
          git switch -c "$target"
          git config user.name 'NBO revision automation'
          git config user.email 'nbo-revision@users.noreply.github.com'
          git add -f revisions/2026-10-08-r47/results revisions/2026-10-08-r47/audit
          git commit -m 'R47: full 48-service constrained catalogue and 38 direct cost comparisons'
          git push origin "HEAD:refs/heads/$target"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r47-study
          path: revisions/2026-10-08-r47
          retention-days: 30
