name: NBO R47 value and deployment study
on:
  push:
    branches: [revision/econometrica-nbo-r47-source-2026-10-08]
    paths:
      - 'revisions/2026-10-08-r47/SOURCE_SHA256.json'
      - '.github/workflows/nbo-r47-study.yml'
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            revisions/2026-10-07-r45
            revisions/2026-10-07-r46
            revisions/2026-10-08-r47
            reviews/2026-10-08-econometrica-numerical-methods-r46
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependency
        run: python -m pip install numpy==2.1.3
      - name: Check frozen scientific source and execute complete design
        run: |
          test -f revisions/2026-10-08-r47/SOURCE_SHA256.json
          python revisions/2026-10-08-r47/code/execute.py
      - name: Publish evidence on a new branch
        run: |
          git config user.name 'NBO revision automation'
          git config user.email 'nbo-revision@users.noreply.github.com'
          target=revision/econometrica-nbo-r47-evidence-2026-10-08
          if git ls-remote --exit-code --heads origin "$target"; then
            echo 'Refusing to overwrite an existing evidence branch'; exit 1
          fi
          git switch -c "$target"
          git add -f revisions/2026-10-08-r47/results revisions/2026-10-08-r47/audit
          git commit -m 'R47: frozen direct-cost, two-state and acquired-deployment evidence'
          git push origin "HEAD:refs/heads/$target"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r47-study
          path: revisions/2026-10-08-r47
          retention-days: 30
