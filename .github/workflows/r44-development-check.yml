name: R44 pre-evaluation adapter check
on:
  push:
    branches: [revision/econometrica-r44-global-bellman-envelopes-2026-09-25]
    paths: ['.github/workflows/r44-development-check.yml']
permissions:
  contents: write
jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONINTMAXSTRDIGITS: '0'
    steps:
      - uses: actions/checkout@v4
      - run: python3 revisions/2026-09-25-r44/replication/bootstrap.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 pyscipopt==6.2.1
      - name: Check only the development seed and fixed algebraic properties
        run: |
          mkdir -p revisions/2026-09-25-r44/history
          python revisions/2026-09-25-r44/replication/smoke.py
          PYTHONPATH=revisions/2026-09-25-r44/replication python -c 'from adversarial import properties; print(properties())'
      - name: Materialize exact sources and primitive registration before evaluation
        run: |
          find revisions/2026-09-25-r44 -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add revisions/2026-09-25-r44
          if ! git diff --cached --quiet; then
            git commit -m 'revision(r44): freeze complete solver, independent reader and untouched multi-family cases [skip ci]'
            git push origin HEAD:revision/econometrica-r44-global-bellman-envelopes-2026-09-25
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r44-development-adapter
          path: |
            revisions/2026-09-25-r44/history
            revisions/2026-09-25-r44/SOURCE_TRANSPORT_VERIFICATION.json
          retention-days: 30
