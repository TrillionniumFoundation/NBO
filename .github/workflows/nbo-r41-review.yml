name: NBO R41 complete review publication
on:
  push:
    branches:
      - revision/econometrica-nbo-r41-source-2026-10-07
    paths:
      - .github/workflows/nbo-r41-review.yml
      - revisions/2026-10-07-r41/publication/payload-*.b64
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scientific and publication dependencies
        run: |
          python -m pip install numpy==2.3.5 mpmath==1.3.0 requests==2.34.2
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-science pandoc
      - name: Restore and verify immutable revision sources
        run: |
          python - <<'PY'
          import os,base64,hashlib,urllib.request,json,tarfile,io,pathlib
          root=pathlib.Path('work')
          dest=root/'revisions/2026-10-07-r41/publication'
          dest.mkdir(parents=True,exist_ok=True)
          parts=[]
          for i in range(4):
              path=f'revisions/2026-10-07-r41/publication/payload-{i}.b64'
              url='https://api.github.com/repos/TrillionniumFoundation/NBO/contents/'+path+'?ref='+os.environ['GITHUB_SHA']
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req) as response: obj=json.load(response)
              raw=base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==obj['sha']
              parts.append(raw)
              (dest/f'payload-{i}.b64').write_bytes(raw)
          data=base64.b64decode(b''.join(parts))
          assert hashlib.sha256(data).hexdigest()=='533805c271aee2e399d824312ab45650a3cfb39f136784c5464914fcb5f2534c'
          (dest/'source_bundle.tar.gz').write_bytes(data)
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as archive:
              for info in archive.getmembers():
                  path=pathlib.PurePosixPath(info.name)
                  assert info.isfile() and not path.is_absolute() and '..' not in path.parts
                  assert str(path).startswith('revisions/2026-10-07-r41/')
              archive.extractall(root,filter='data')
          print('Verified R41 source bundle and six readable source modules')
          PY
      - name: Execute, audit, compile, and publish
        run: python work/revisions/2026-10-07-r41/publication/remote.py
      - name: Retain the complete publication or failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nbo-r41-complete-review-publication
          path: |
            work/revisions/2026-10-07-r41/
            work/R41_FINAL_COMMIT.txt
          if-no-files-found: warn
          retention-days: 90
