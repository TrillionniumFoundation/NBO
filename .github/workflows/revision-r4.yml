name: Econometrica R4 source, replication, and manuscripts
on:
  push:
    branches: ['revision/econometrica-r4-2026-09-16']
    paths:
      - '.github/workflows/revision-r4.yml'
      - 'ECTA_R4.tex'
      - 'SUPP_R4.tex'
      - 'revisions/2026-09-16-r4/**'
      - 'replication/r4/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: econometrica-r4-${{ github.ref }}
  cancel-in-progress: false
jobs:
  revision:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BRANCH: revision/econometrica-r4-2026-09-16
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize reviewable source files on the isolated revision branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! test -f replication/r4/validate.py; then
            python3 - <<'PY'
          import hashlib, io, tarfile
          from pathlib import Path, PurePosixPath
          root = Path('.')
          parts = sorted(root.glob('revisions/2026-09-16-r4/_source_transport/*.part'))
          assert [p.name for p in parts] == [f'{i:02d}.part' for i in range(11)]
          data = b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest() == '4820ada07b32a4c23fefc7b3641cd8c2d1cc8fa754473586a66061ba2271e4aa'
          allowed_root = {'ECTA_R4.tex', 'SUPP_R4.tex', 'REVISION_INDEX.md'}
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:xz') as archive:
              members = archive.getmembers()
              assert len(members) == 45
              assert len({m.name for m in members}) == len(members)
              for member in members:
                  path = PurePosixPath(member.name)
                  assert member.isfile() and not path.is_absolute() and '..' not in path.parts
                  assert member.size <= 250000
                  assert member.name in allowed_root or member.name.startswith('replication/r4/') or member.name.startswith('revisions/2026-09-16-r4/')
                  target = root / member.name
                  assert not target.exists() or member.name == 'REVISION_INDEX.md'
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.extractfile(member).read())
          PY
            git add ECTA_R4.tex SUPP_R4.tex REVISION_INDEX.md replication/r4 revisions/2026-09-16-r4
            git commit -m 'paper(r4): substantive revision, complete proofs, referee response, and executable neural solvers'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          mkdir -p build-r4
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          printf '%s\n' "$SOURCE_SHA" > build-r4/source_commit.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned scientific dependencies
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install manuscript toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended texlive-science latexmk poppler-utils
      - name: Execute all solvers, independent references, and weight replays
        run: bash replication/r4/run_all.sh "$SOURCE_SHA"
      - name: Compile and verify manuscripts
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=build-r4 ECTA_R4.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=build-r4 SUPP_R4.tex
          python replication/r4/build_report.py --source-commit "$SOURCE_SHA"
      - name: Commit executed evidence and reviewable PDFs
        run: |
          git add replication/r4/output revisions/2026-09-16-r4/paper
          git add revisions/2026-09-16-r4/ECTA_R4.pdf revisions/2026-09-16-r4/SUPP_R4.pdf
          git add revisions/2026-09-16-r4/ECTA_R4_build.log revisions/2026-09-16-r4/SUPP_R4_build.log revisions/2026-09-16-r4/build_report.json
          if ! git diff --cached --quiet; then
            git commit -m "replication(r4): executed results and compiled manuscripts from $SOURCE_SHA"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          git rev-parse HEAD > build-r4/final_commit.txt
          git archive HEAD | gzip -n > build-r4/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: econometrica-r4-${{ github.run_id }}
          path: |
            build-r4/
            replication/r4/output/logs/
          retention-days: 30
          if-no-files-found: error
