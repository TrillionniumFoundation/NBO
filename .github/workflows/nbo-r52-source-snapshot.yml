name: NBO R52 source snapshot
on:
  push:
    branches: [revision/econometrica-nbo-r52-source-2026-10-08]
    paths: [.github/workflows/nbo-r52-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 62ffa8d0753c82a1363831f49a297c815d89204f
          fetch-depth: 1
          persist-credentials: false
      - name: Export immutable complete source tree
        run: |
          mkdir -p /tmp/nbo-r52-inputs
          git rev-parse HEAD > /tmp/nbo-r52-inputs/BASE_COMMIT.txt
          git ls-tree -r HEAD > /tmp/nbo-r52-inputs/BASE_TREE.txt
          git archive --format=tar HEAD | gzip -1 > /tmp/nbo-r52-inputs/base.tar.gz
          sha256sum /tmp/nbo-r52-inputs/base.tar.gz > /tmp/nbo-r52-inputs/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r52-pinned-complete-inputs
          path: /tmp/nbo-r52-inputs/
          retention-days: 7
          compression-level: 0
