name: NBO R54 complete referee revision
on:
  push:
    branches: [revision/econometrica-nbo-r54-referee-revision-2026-10-08]
    paths: [.github/workflows/nbo-r54-publication.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nbo-r54-complete-publication
  cancel-in-progress: false
jobs:
  complete-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_DATE_EPOCH: '1791450000'
      FORCE_SOURCE_DATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          filter: blob:none
          sparse-checkout: |
            /revisions/2026-10-08-r53/
            /revisions/2026-10-08-r54/
            /README.md
            /ECTA.tex
          sparse-checkout-cone-mode: false
      - name: Install publication and verification dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-numpy python3-scipy pandoc poppler-utils texlive-latex-extra texlive-fonts-recommended texlive-science
      - name: Commit ordinary manuscript sources before audit and compilation
        run: |
          git config user.name 'NBO revision verification'
          git config user.email 'nbo-revision@users.noreply.github.com'
          /usr/bin/python3 revisions/2026-10-08-r54/code/assemble54.py
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('revisions/2026-10-08-r54')
          path = root / 'publication/bibliography-entries.json'
          entries = json.loads(path.read_text())
          keys = ('munos2003','kakade2002','ferns2004','ng1999','grimm2020','pirottasafe2013')
          for key in keys:
              value = entries[key]
              if '``' in value:
                  if value.count('``') != 1 or value.count(', in ') != 1:
                      raise AssertionError('Unexpected new bibliography entry: ' + key)
                  value = value.replace('``', chr(92) + 'enquote{').replace(', in ', ',} in ')
              entries[key] = value
          path.write_text(json.dumps(entries, indent=2, sort_keys=True) + '\n')
          for name in ('ECTA.tex','code/assemble54.py'):
              path = root / name
              text = path.read_text()
              text = text.replace(chr(92) + 'citep{pirottasafe2013}', chr(92) + 'citep{pirotta2013}')
              path.write_text(text)
          PY
          git add -f revisions/2026-10-08-r54
          if ! git diff --cached --quiet; then
            git commit -m 'R54: retain ordinary manuscript sources with corrected bibliography typography'
          fi
          git push --atomic origin HEAD:refs/heads/revision/econometrica-nbo-r54-referee-revision-2026-10-08 HEAD:refs/heads/revision/econometrica-nbo-r54-source-2026-10-08
      - name: Diagnose exact committed Python sources before execution
        run: |
          /usr/bin/python3 - <<'PY'
          import ast, hashlib, json, pathlib, subprocess
          root = pathlib.Path('revisions/2026-10-08-r54')
          records = []
          for path in sorted((root / 'code').glob('*.py')):
              raw = path.read_bytes()
              committed = subprocess.check_output(['git', 'show', 'HEAD:' + str(path)])
              if raw != committed:
                  raise AssertionError('Runtime differs from committed source: ' + str(path))
              ast.parse(raw, filename=str(path))
              records.append({'path': str(path), 'sha256': hashlib.sha256(raw).hexdigest()})
          log = root / 'audit' / 'RUNTIME_SYNTAX54.json'
          log.write_text(json.dumps({'head': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(), 'files': records, 'status': 'passed'}, indent=2) + '\n')
          print(log.read_text(), flush=True)
          PY
      - name: Run all inherited and new tests, replay every record, compile five documents
        run: /usr/bin/python3 revisions/2026-10-08-r54/code/build54.py
      - name: Clean archive rebuild and verified atomic remote publication
        run: /usr/bin/python3 revisions/2026-10-08-r54/code/publish54.py
      - name: Retain complete publication and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nbo-r54-paper-audits-and-logs
          path: |
            revisions/2026-10-08-r54/build/*.pdf
            revisions/2026-10-08-r54/build/*.txt
            revisions/2026-10-08-r54/audit/*54*
            revisions/2026-10-08-r54/audit/build-logs/
          retention-days: 30
          compression-level: 1
