name: R19 final publication and evidence binding
on:
  push:
    branches: [revision/econometrica-r19-development-2026-09-20]
    paths:
      - .github/workflows/r19-finalize.yml
      - replication/r19/polish.py
      - replication/r19/release_fixes.py
      - replication/r19/reuse_continuum.py
permissions:
  contents: write
  actions: read
concurrency:
  group: r19-complete-publication
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revision/econometrica-r19-development-2026-09-20
          fetch-depth: 0
      - name: Pin the actual author source selected after preceding publication
        run: echo "R19_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve the freshly completed independent continuum receipt
        uses: actions/download-artifact@v4
        with:
          name: nbo-r19-current-publication
          run-id: 35464366825
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/r19-fresh-continuum
      - name: Install fixed calculation and publication dependencies
        run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5 scipy==1.17.0 sympy==1.14.0 pymupdf==1.26.6
          sudo apt-get update -qq > /tmp/r19-final-apt.log 2>&1
          sudo apt-get install -y -qq --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended texlive-science >> /tmp/r19-final-apt.log 2>&1 || { tail -100 /tmp/r19-final-apt.log; exit 1; }
          echo "TEXINPUTS=$PWD//:" >> "$GITHUB_ENV"
      - name: Apply transparent checker and receipt corrections
        run: |
          python replication/r19/prepare_release.py
          python replication/r19/release_fixes.py
      - name: Regenerate current scientific witnesses and all exact-policy controls
        run: python -u replication/r19/replicate.py
      - name: Independently check all current scientific outputs
        run: |
          python -O -u replication/r19/verify.py
          python -O -u replication/r19/final_checks.py
      - name: Rehash every input of the fresh full continuum verification
        run: python -u replication/r19/reuse_continuum.py --artifact-root /tmp/r19-fresh-continuum
      - name: Assemble, reconcile notation, and compile the complete current paper
        run: |
          python -u replication/r19/assemble.py
          python -u replication/r19/polish.py
          python -u replication/r19/publish.py
      - name: Deposit the actual checked publication without modifying other branches
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'revision/econometrica-r19-development-2026-09-20'
          git config user.name 'NBO Scientific Publication'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import subprocess
          selected=[]
          for base in ('replication/r19','revisions/2026-09-20-r19'):
              selected += [str(p) for p in Path(base).rglob('*') if p.is_file() and p.suffix in ('.py','.tex','.pdf','.json','.md','.png','.txt','.npz') and '__pycache__' not in str(p)]
          selected += ['README.md','REVISION_INDEX.md','ECTA_R19.tex','SUPP_R19.tex','RESPONSE_R19.tex','COMPENDIUM_R19.tex']
          subprocess.run(['git','add','-f','--',*selected],check=True)
          PY
          if ! git diff --cached --quiet; then
            git commit -m 'publication(r19): freeze complete current text, independent receipts, generated tables, and PDFs'
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          git log -1 --format='%H %s'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r19-final-publication
          if-no-files-found: warn
          retention-days: 30
          path: |
            revisions/2026-09-20-r19/ECTA_R19.pdf
            revisions/2026-09-20-r19/SUPP_R19.pdf
            revisions/2026-09-20-r19/RESPONSE_R19.pdf
            revisions/2026-09-20-r19/COMPENDIUM_R19.pdf
            revisions/2026-09-20-r19/build_report.json
            revisions/2026-09-20-r19/release_manifest.json
            revisions/2026-09-20-r19/build_logs
            revisions/2026-09-20-r19/preview
            replication/r19/output/validation.json
            replication/r19/output/final_checks.json
            replication/r19/output/inherited_validation.json
            replication/r19/output/continuum_receipt_binding.json
            replication/r19/output/auxiliary_validation.json
