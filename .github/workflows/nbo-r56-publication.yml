# Exact source-byte preflight retained for the final publication.
name: NBO R56 complete referee revision
on:
  push:
    branches: [revision/econometrica-nbo-r56-referee-revision-2026-10-09]
    paths: [.github/workflows/nbo-r56-publication.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nbo-r56-complete-publication
  cancel-in-progress: false
jobs:
  complete-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_DATE_EPOCH: '1791507600'
      FORCE_SOURCE_DATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          filter: blob:none
          sparse-checkout: |
            /revisions/2026-10-09-r55/
            /revisions/2026-10-09-r56/
            /README.md
            /ECTA.tex
          sparse-checkout-cone-mode: false
      - name: Assemble the ordinary manuscript from the exact pinned evidence tree
        run: |
          python3 revisions/2026-10-09-r56/code/assemble56.py
          python3 - <<'PY'
          import ast,hashlib,json
          from pathlib import Path
          root=Path('revisions/2026-10-09-r56')
          expected={
            'code/algebraic56.py':'a738a8b505b1de189bdac74a80af28d87e129dda50e0bfb06ca90b6a38ff7e84',
            'code/tests56.py':'5dfabc952b182534a6ba550eb0ef7ac6169fb68fa24a98accdd04685ffc1f33c',
            'code/tests56_extra.py':'d7b54b8dac951e943e92266eefcecab8208bf3b408c2e98e798ae6536242eb57',
            'code/audit56.py':'a795badc55fd074492866c9f5fdbfe8115b9ac7ede8c4095a6359892976eb1ec',
            'code/tables56.py':'ae565edd3ca694767c900108292f304ef19ef71b8a11040bc43782f9a0ec8b45',
            'code/assemble56.py':'8911162b5858a9abd9d2ef7e5ea35825193ba264350179771b2f7b904c812ee7',
            'code/build56.py':'b99d4ac897905e78123c5ae3d6388a314619cabbc44e51c2297c0468cc49e3d8',
            'code/publish56.py':'f3fa528fa3dd90dca0f5188224aee3765c550e937932d7fb4c3c7e78ba16f614',
            'sections/intro56.tex':'fa8912e9b1398111daea9d81d1450124c78ec861e8162dcbab63836ca8542e43',
            'sections/primitives56.tex':'4f32e6af8a75ec58a18394f2b490cd1a83f014d677b4e232b567ead2c0f5244e',
            'sections/learned56.tex':'2c0e919ca5f9d4c3cbb10e1a30456b5bcbba59105c048e53d984e1bb417d3462',
            'sections/certificates56.tex':'13b7df261252a38361aca446c963b9220925ed42cf479125e18a7a4ce38bae19',
            'sections/prospective56.tex':'11b477d149e855f9c802d5f776248f81386c308d2cd8a0ba026c2fcdde1a4268',
            'sections/study56.tex':'a954a193b7d6e43b9ce79bd12339d8c92fa86170ce04a54ab6f9f42c78bf7a4a',
            'sections/supp56.tex':'6270b414a2c8577fe18913d26f7efae050d7ed0be01b5645cba3f437a3693e39',
            'sections/resources56.tex':'eca80f19e4106b410aef712d89a8a142b305cff88ff19c242bfc64654accc391',
            'response56.md':'25c4aceb5a3430b4d2f69aab751b0a7859f47e3f0c88e813acac2b8688379b79'}
          for name,h in expected.items():
              raw=(root/name).read_bytes()
              if hashlib.sha256(raw).hexdigest()!=h:raise AssertionError('Authored source differs: '+name)
              if name.endswith('.py'):ast.parse(raw,filename=name)
          (root/'audit/AUTHORED_SOURCE56.json').write_text(json.dumps({'status':'passed','files_sha256':expected},indent=2)+'\n')
          PY
          git config user.name 'NBO revision verification'
          git config user.email 'nbo-revision@users.noreply.github.com'
          git add -f revisions/2026-10-09-r56
          if ! git diff --cached --quiet; then
            git commit -m 'R56: retain ordinary original-paper manuscript and complete pinned evidence before verification'
          fi
          git push --atomic origin HEAD:refs/heads/revision/econometrica-nbo-r56-referee-revision-2026-10-09 HEAD:refs/heads/revision/econometrica-nbo-r56-source-2026-10-09
      - name: Install verification and publication dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-numpy python3-scipy python3-sklearn python3-sympy pandoc poppler-utils texlive-latex-extra texlive-fonts-recommended texlive-science
      - name: Reintegrate all unique certificates, replay all services, test and compile seven documents
        run: /usr/bin/python3 revisions/2026-10-09-r56/code/build56.py
      - name: Clean source-bound publication rebuild and verified atomic remote delivery
        run: /usr/bin/python3 revisions/2026-10-09-r56/code/publish56.py
      - name: Retain all final documents and publication diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nbo-r56-paper-audits-and-logs
          path: |
            revisions/2026-10-09-r56/build/*.pdf
            revisions/2026-10-09-r56/build/*.txt
            revisions/2026-10-09-r56/audit/*56*
            revisions/2026-10-09-r56/audit/build-logs/
          retention-days: 30
          compression-level: 1
