# Initial source/artifact recovery remains pinned at d33d3906d4b25ebebde252e12b5222581f576e5d.
# Sources, proof outputs and frozen R22 results are now committed; rebuilding does not retrain.
name: R23 verified Econometrica referee publication
on:
  push:
    branches: [revision/econometrica-r23-referee-resolution-2026-09-23]
    paths:
      - .github/workflows/r23-publication.yml
      - revisions/2026-09-23-r23/paper/**
      - revisions/2026-09-23-r23/replication/build_publication.py
permissions:
  contents: write
concurrency:
  group: nbo-r23-referee-publication
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install publication dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-science texlive-publishers poppler-utils
      - name: Rebuild from committed frozen scientific evidence
        shell: bash
        run: |
          python revisions/2026-09-23-r23/replication/build_publication.py --compile > /tmp/r23-publication-build.log
          cat /tmp/r23-publication-build.log
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          m=json.loads(Path('revisions/2026-09-23-r23/PUBLICATION_MANIFEST.json').read_text())
          for name,wanted in m['sha256'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==wanted,name
          with zipfile.ZipFile('NBO_R23_review_package.zip','a',zipfile.ZIP_DEFLATED) as z:
              present=set(z.namelist())
              for name in m['sha256']:
                  if name not in present:
                      assert Path(name).suffix.lower() not in {'.ttf','.otf','.woff','.woff2','.pfb','.ttc','.afm'}
                      z.write(name,name)
          with zipfile.ZipFile('NBO_R23_review_package.zip') as z:
              for name,wanted in m['sha256'].items():
                  assert hashlib.sha256(z.read(name)).hexdigest()==wanted,name
          print('All closed source/result/PDF and package hashes verified.')
          PY
      - name: Commit the regenerated referee object only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add revisions/2026-09-23-r22 revisions/2026-09-23-r23 ECTA_R22.tex SUPP_R22.tex RESPONSE_R22.tex R22_REVIEW.md ECTA_R23.tex SUPP_R23.tex RESPONSE_R23.tex R23_REVIEW.md REVISION_INDEX.md
          git add -f ECTA_R23.pdf SUPP_R23.pdf RESPONSE_R23.pdf
          git diff --cached --quiet || git commit -m 'publication(r23): verified frozen-evidence referee rebuild'
          git push origin HEAD:revision/econometrica-r23-referee-resolution-2026-09-23
          mkdir -p /tmp/nbo-r23-publication
          git rev-parse HEAD > /tmp/nbo-r23-publication/PUBLICATION_COMMIT.txt
          cp ECTA_R23.pdf SUPP_R23.pdf RESPONSE_R23.pdf R23_REVIEW.md NBO_R23_review_package.zip revisions/2026-09-23-r23/PUBLICATION_MANIFEST.json /tmp/nbo-r23-publication/
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r23-referee-publication
          path: /tmp/nbo-r23-publication
          retention-days: 30
