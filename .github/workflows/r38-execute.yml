name: R38 exact scientific reproduction
on:
  push:
    branches: [revision/econometrica-r38-verified-global-bounds-2026-09-24]
    paths: [.github/workflows/r38-execute.yml, '.r38-transfer/core-*.b64']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: r38-scientific-reproduction
  cancel-in-progress: false
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install explicit numerical dependencies
        run: python -m pip install numpy==2.3.5 sympy==1.14.0
      - name: Materialize hash-checked authored sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,json,hashlib
          encoded=''.join(Path(f'.r38-transfer/core-{i}.b64').read_text().strip() for i in range(4))
          data=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(data).hexdigest()=='3c8981f7a5ec1290b387e92bf0ba587674b02ea94d0c5d9c113ce3926ced50e8'
          root=Path('revisions/2026-09-24-r38')
          for name,content in json.loads(data).items():
              rel=Path(name)
              assert not rel.is_absolute() and '..' not in rel.parts
              path=root/rel;path.parent.mkdir(parents=True,exist_ok=True);path.write_text(content)
          PY
      - name: Execute all experiments and verification
        run: python revisions/2026-09-24-r38/replication/run_core.py
      - name: Record exact scientific provenance
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          r=Path('revisions/2026-09-24-r38')
          files={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(r.rglob('*')) if p.is_file() and '__pycache__' not in p.parts}
          d={'stage':'scientific objects; manuscript publication is a separate completed-build stage','source_commit':os.environ['GITHUB_SHA'],'base_review_commit':'c81410887bca5c16975beabb2ca8d6be7f235a19','branch':os.environ['GITHUB_REF_NAME'],'run_id':os.environ['GITHUB_RUN_ID'],'files':files}
          (r/'SCIENTIFIC_MANIFEST.json').write_text(json.dumps(d,sort_keys=True,indent=2)+'\n')
          PY
      - name: Commit completed results without modifying another branch
        env:
          BRANCH: revision/econometrica-r38-verified-global-bounds-2026-09-24
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          find revisions/2026-09-24-r38 -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'NBO scientific publication'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f revisions/2026-09-24-r38
          git commit -m 'research(r38): materialize executed exact bounds, frontier references, sensitivities and nonlinear certificates'
          git push origin HEAD:"$BRANCH"
      - name: Preserve complete scientific outputs and execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nbo-r38-science-${{ github.run_id }}
          path: revisions/2026-09-24-r38/
          retention-days: 30
          if-no-files-found: error
