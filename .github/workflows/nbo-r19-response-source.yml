name: NBO R19 response source snapshot
on:
  push:
    branches: [revision/econometrica-nbo-r19-response-2026-10-05]
    paths: [.github/workflows/nbo-r19-response-source.yml]
permissions:
  contents: read
concurrency:
  group: nbo-r19-response-source
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            *.tex
            *.bib
            *.cls
            *.bst
            *.sty
            *.py
            *.md
            *.txt
            *.yml
            *.aux
            *.bbl
            **/protocols/*.json
      - name: Export immutable manuscript and derivation sources
        shell: python
        run: |
          import subprocess, pathlib, tarfile, hashlib, json
          out=pathlib.Path('/tmp/nbo-r19-source'); out.mkdir()
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          selected=[]; omitted=[]
          with tarfile.open(out/'source.tar.gz','w:gz') as archive:
              for name in paths:
                  if not name: continue
                  p=pathlib.Path(name)
                  if p.is_file() and p.stat().st_size < 4000000:
                      archive.add(p,arcname=name); selected.append(name)
                  else: omitted.append(name)
          (out/'INVENTORY.json').write_text(json.dumps({'selected':selected,'omitted':omitted},indent=2))
          (out/'COMMIT.txt').write_bytes(subprocess.check_output(['git','rev-parse','HEAD']))
          (out/'SHA256SUMS').write_text(hashlib.sha256((out/'source.tar.gz').read_bytes()).hexdigest()+'  source.tar.gz\n')
          print('Selected',len(selected),'omitted',len(omitted),'archive bytes',(out/'source.tar.gz').stat().st_size)
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r19-response-pinned-source
          path: /tmp/nbo-r19-source/
          if-no-files-found: error
          retention-days: 30
