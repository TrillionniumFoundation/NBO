name: NBO R49 separated resource study
on:
  push:
    branches: [revision/econometrica-nbo-r49-source-2026-10-08]
    paths: ['.github/workflows/nbo-r49-study.yml']
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            revisions/2026-10-07-r44
            revisions/2026-10-07-r45
            revisions/2026-10-07-r46
            revisions/2026-10-08-r47
            revisions/2026-10-08-r48
            revisions/2026-10-08-r49
            reviews/2026-10-08-econometrica-numerical-methods-r48
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed numerical inputs
        run: python -m pip install numpy==2.1.3 scipy==1.14.1
      - name: Verify and freeze ordinary science sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('revisions/2026-10-08-r49');p.joinpath('audit').mkdir(exist_ok=True)
          expected={'code/direct49.py':'4702f3fc15b4cf225752f2f0ef3e55326fac137467755abc6d0a41363a0ec3f9','code/execute49.py':'e97704b5a45303d4130ced048796194694188403c7832eab34eb80e9fe477e40','code/service49.py':'1f2e618d7cef86782a83d7bc695f9fafcd64752021f6081dad4f18dcbf9a85d4','code/tests49.py':'10116c72ee5af4a43e65771976760e29f04136440aba55db0b625ad8cb9c4337'}
          for n,h in expected.items():assert hashlib.sha256((p/n).read_bytes()).hexdigest()==h,n
          expected['STUDY_PROTOCOL.md']=hashlib.sha256((p/'STUDY_PROTOCOL.md').read_bytes()).hexdigest()
          for n in ['common.py','tensor.py','service.py','direct48.py']:
              q=p.parent/'2026-10-08-r48/code'/n
              expected['../2026-10-08-r48/code/'+n]=hashlib.sha256(q.read_bytes()).hexdigest()
          for n in ['constructive.py','interval.py']:
              q=p.parent/'2026-10-07-r45/code'/n
              expected['../2026-10-07-r45/code/'+n]=hashlib.sha256(q.read_bytes()).hexdigest()
          (p/'SOURCE_SHA256.json').write_text(json.dumps(expected,indent=2)+'\n')
          (p/'audit/REVIEWED_R48_REPORT.md').write_bytes(Path('reviews/2026-10-08-econometrica-numerical-methods-r48/referee_report.md').read_bytes())
          PY
      - name: Exact and small regression checks
        run: python -m unittest discover -s revisions/2026-10-08-r49/code -p tests49.py -v > revisions/2026-10-08-r49/audit/pre-execution-tests.log 2>&1
      - name: Complete isolated catalogue
        run: python revisions/2026-10-08-r49/code/execute49.py
      - name: Publish immutable evidence branch
        run: |
          target=revision/econometrica-nbo-r49-evidence-2026-10-08
          if git ls-remote --exit-code --heads origin "$target"; then echo 'Existing evidence branch; refusing replacement'; exit 1; fi
          git switch -c "$target"
          git config user.name 'NBO revision automation'
          git config user.email 'nbo-revision@users.noreply.github.com'
          git add -f revisions/2026-10-08-r49
          if test -n "$(git diff --cached --name-only --diff-filter=D)"; then echo 'Unexpected deletion'; exit 1; fi
          git commit -m 'R49: frozen complete separated-resource and actual-policy-cost evidence'
          git push origin "HEAD:refs/heads/$target"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r49-study
          path: revisions/2026-10-08-r49
          retention-days: 30
