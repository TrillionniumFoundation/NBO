name: R5 canonical review build
on:
  push:
    branches: [revision/econometrica-r5-certified-control-2026-09-21]
    paths:
      - 'ECTA_R5.tex'
      - 'SUPP_R5.tex'
      - 'revisions/2026-09-21-r5/paper/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install canonical LaTeX dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-science
      - name: Build both canonical documents with cross references
        run: |
          test -f ECTA_R5.tex && test -f SUPP_R5.tex
          python revisions/2026-09-21-r5/paper/refresh_tables.py
          for ENTRY in ECTA_R5 SUPP_R5 ECTA_R5 SUPP_R5 ECTA_R5; do
            pdflatex -interaction=nonstopmode -halt-on-error "$ENTRY.tex"
          done
          mkdir -p /tmp/nbo-build
          cp ECTA_R5.pdf SUPP_R5.pdf ECTA_R5.log SUPP_R5.log /tmp/nbo-build/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r5-canonical-build-${{ github.sha }}
          path: |
            /tmp/nbo-build/
            ECTA_R5.log
            SUPP_R5.log
          if-no-files-found: ignore
          retention-days: 90
