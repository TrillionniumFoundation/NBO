name: NBO R80 pinned authoring inputs
on:
  push:
    branches: [revision/econometrica-nbo-r80-referee-revision-2026-10-12]
    paths: [.github/workflows/nbo-r80-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /revisions/2026-10-12-r79/
      - name: Export pinned textual authoring and numerical qualification inputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil
          root=Path('revisions/2026-10-12-r79');out=Path('/tmp/nbo-r80-authoring');out.mkdir()
          files=[]
          for p in root.rglob('*'):
              if not p.is_file():continue
              rel=p.relative_to(root)
              if any(x in rel.parts for x in ('preserved','__pycache__','build')):continue
              if p.suffix not in ('.py','.json','.tex','.bib','.cls','.cfg','.bst','.md','.log'):continue
              q=out/rel;q.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,q)
              files.append({'path':str(rel),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          (out/'EXPORTED_SOURCE.json').write_text(json.dumps({'baseline_commit':'57559fdda589915e6a246ad1c5da75f682424a22','files':files},indent=2)+'\n')
          print('Exported',len(files),'textual files; no new scientific observations')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r80-authoring-inputs
          path: /tmp/nbo-r80-authoring/
          compression-level: 1
          retention-days: 30
