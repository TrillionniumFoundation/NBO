name: NBO R48 manuscript publication
on:
  push:
    branches: [revision/econometrica-nbo-r48-manuscript-source-2026-10-08]
    paths: ['.github/workflows/nbo-r48-publication.yml','revisions/2026-10-08-r48/transport/paper-repair.json']
permissions:
  contents: write
  actions: read
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            revisions/2026-10-07-r44
            revisions/2026-10-07-r45
            revisions/2026-10-07-r46
            revisions/2026-10-08-r47
            revisions/2026-10-08-r48
            reviews/2026-10-08-econometrica-numerical-methods-r47
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and materialize complete ordinary manuscript sources
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma
          from pathlib import Path
          p=Path('revisions/2026-10-08-r48')
          parts=sorted((p/'transport').glob('paper.[0-9][0-9].b64'))
          assert len(parts)==8
          s=''.join(f.read_text().strip() for f in parts)
          repair=p/'transport/paper-repair.json'
          if repair.exists():
              for c in sorted(json.loads(repair.read_text()),key=lambda c:c['start'],reverse=True):
                  assert s[c['start']:c['end']]==c['old']
                  s=s[:c['start']]+c['new']+s[c['end']:]
          raw=base64.b64decode(s,validate=True)
          assert hashlib.sha256(raw).hexdigest()=='a759637dc0f6daba636263e3ec26438cc9b52c332c79ae5ec4373edae9a959b9','Publication transport integrity failed; no source or result changes allowed'
          files=json.loads(lzma.decompress(raw));assert len(files)==19
          for n,text in files.items():
              q=Path(n);assert not q.is_absolute() and '..' not in q.parts
              target=p/q;target.parent.mkdir(parents=True,exist_ok=True);target.write_text(text)
          m=json.loads((p/'publication/PAPER_SOURCE_SHA256.json').read_text())
          for n,h in m['inputs'].items():assert hashlib.sha256((p/n).read_bytes()).hexdigest()==h,n
          for n,h in json.loads((p/'SOURCE_SHA256.json').read_text()).items():assert hashlib.sha256((p/n).read_bytes()).hexdigest()==h,n
          PY
          echo "PUBLICATION_INPUT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Restore exact historical publication inputs once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/TrillionniumFoundation/NBO/actions/artifacts/11503019522/zip > "$RUNNER_TEMP/r47-reviewed.zip"
          python - <<'PY'
          import hashlib,json,os,shutil,zipfile
          from pathlib import Path
          p=Path('revisions/2026-10-08-r48');archive=Path(os.environ['RUNNER_TEMP'])/'r47-reviewed.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='65a3c49014b58f1708802496106175631b0bb0cba9b1bfc6f00128e6afbc1bbf'
          target=p/'preserved/R47';target.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                  q=Path(entry.filename);assert not q.is_absolute() and '..' not in q.parts
                  assert q.suffix.lower() not in {'.ttf','.otf','.woff','.woff2','.pfb','.pfa','.afm','.tfm'}
                  assert (entry.external_attr >> 16) & 0o170000 != 0o120000
              z.extractall(target)
          assert hashlib.sha256((target/'ECTA.tex').read_bytes()).hexdigest()=='61ec5d91e5132a6dd48eb06f0ced26f02f811036c2efb144a613ce99c5319d71'
          assert hashlib.sha256((target/'supp.tex').read_bytes()).hexdigest()=='4cfd01093fbab9cb1051403974b2fb89b446e8959ced2415e116a05a7b5ad8c1'
          shutil.copy2('reviews/2026-10-08-econometrica-numerical-methods-r47/referee_report.md',p/'audit/REVIEWED_R47_REPORT.md')
          shutil.copy2('README.md',p/'audit/ROOT_README_BEFORE_R48.md')
          (p/'audit/HISTORICAL_INPUT_MATERIALIZATION.json').write_text(json.dumps({'artifact_id':11503019522,'sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),'member_count':len(z.infolist()),'destination':'preserved/R47','source_run_was_failed':True,'prior_run_not_relabelled':True,'ordinary_files_required_for_subsequent_offline_rebuild':True},indent=2)+'\n')
          PY
      - name: Install publication and numerical dependencies
        run: |
          python -m pip install numpy==2.1.3 scipy==1.14.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended texlive-science pandoc poppler-utils
      - name: Reconstruct evidence, run all 96 tests and compile complete documents
        run: python revisions/2026-10-08-r48/code/build48.py
      - name: Commit ordinary candidate, verify offline clean rebuild, and push new review-ready branch
        run: |
          git config user.name 'NBO revision automation'
          git config user.email 'nbo-revision@users.noreply.github.com'
          python revisions/2026-10-08-r48/code/release48.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r48-publication
          path: revisions/2026-10-08-r48
          retention-days: 30
