name: NBO R16 referee reading edition
on:
  push:
    branches: [revision/econometrica-nbo-r16-integration-2026-10-04]
    paths: [.github/workflows/nbo-r16-publication.yml]
permissions:
  contents: read
concurrency:
  group: nbo-r16-paper-publication
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      NBO_R16_PUBLICATION_SOURCE: ${{ github.sha }}
      P: revisions/2026-10-04-r16/publication
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Install exact proof-reviewed completed reading sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python "$P/complete_source/install.py"
      - name: Preserve all four immutable evidence families and the referee parent
        shell: bash
        run: |
          set -euo pipefail
          for b in revision/econometrica-nbo-r16-paper-2026-10-04 revision/econometrica-nbo-r16-paper-evidence-2026-10-04 revision/econometrica-nbo-r16-paper-referee-2026-10-04; do
            test -z "$(git ls-remote --heads origin "refs/heads/$b")" || { echo "Refusing existing branch $b"; exit 1; }
          done
          git config user.name 'NBO Revision Builder'
          git config user.email 'nbo-revision-builder@users.noreply.github.com'
          printf '/*\n!*.npz\n!*.npy\n!*.pt\n' | git sparse-checkout set --no-cone --stdin
          for s in 503a724817899105a78f8c2fd516f417efb6b483 2f17d8163a1d1d6b72a32b6ea6d6b683dc62031e 103b6717dac939cb9cd18876f56d889c9e2a751d 0b0b113b8c249d916daf0da22808180ce15caa2f cb4595bbcc7147e47e44ba40cb2f5034510ae19f; do
            git fetch --filter=blob:none --no-tags origin "$s"
            git merge --no-ff --no-edit "$s"
          done
          echo 'Binary trial objects remain in the full Git tree; only unnecessary working-directory materialization is omitted.'
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          p=pathlib.Path('revisions/2026-10-04-r16/publication')
          inventory=json.loads(pathlib.Path('revisions/2026-10-04-r16/protocols/signed_candidates.json').read_text())
          rows=inventory['files'];assert len(rows)==32
          paths=[r['path'] for r in rows]
          assert len(set(paths))==32
          for name in paths:
              rel=pathlib.PurePosixPath(name)
              assert not rel.is_absolute() and '..' not in rel.parts and name.endswith('/nbo/selected.pt')
          subprocess.run(['git','restore','--worktree','--ignore-skip-worktree-bits','--',*paths],check=True)
          for row in rows:
              data=pathlib.Path(row['path']).read_bytes()
              assert len(data)==row['bytes'] and hashlib.sha256(data).hexdigest()==row['sha256'],row['path']
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==row['git_blob'],row['path']
          dest=p/'checks/remote';dest.mkdir(parents=True,exist_ok=True)
          (dest/'POLICY_DEPENDENCIES.json').write_text(json.dumps({'policies':len(rows),'bytes':sum(r['bytes'] for r in rows),'source':'Immutable original signed_candidates.json; working-tree restoration only','sha256_and_git_blob_verified':True,'scientific_sources_changed':False},indent=2)+'\n')
          print('Restored and verified all 32 immutable original policy dependencies.')
          PY
          git ls-tree HEAD revisions/2026-10-04-r16/results/continuation_menu revisions/2026-10-04-r16/results/robustness
          df -h .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical and publication dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5 scipy==1.17.0 numba==0.65.1 mpmath==1.3.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-science texlive-fonts-recommended cm-super latexmk poppler-utils
      - name: Run mathematical and infrastructure checks without registered bank draws
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$P/checks/remote"
          for suite in signed_tests.py menu_tests.py menu_verification_tests.py menu_pipeline_tests.py menu_transport_tests.py robustness_tests.py; do
            python -m unittest discover -s revisions/2026-10-04-r16/code -p "$suite" -v > "$P/checks/remote/$suite.stdout" 2>&1 || { cat "$P/checks/remote/$suite.stdout"; exit 1; }
            cat "$P/checks/remote/$suite.stdout"
          done
          python -m unittest discover -s "$P/code" -p test_decision_value.py -v > "$P/checks/remote/test_decision_value.py.stdout" 2>&1 || { cat "$P/checks/remote/test_decision_value.py.stdout"; exit 1; }
          cat "$P/checks/remote/test_decision_value.py.stdout"
          python revisions/2026-10-04-r16/code/strong_hjb_tests.py --out "$P/checks/remote/STRONG_HJB.json" > "$P/checks/remote/strong_hjb.stdout" 2>&1 || { cat "$P/checks/remote/strong_hjb.stdout"; exit 1; }
          cat "$P/checks/remote/strong_hjb.stdout"
      - name: Independently check complete comparison arithmetic and assemble all three documents
        shell: bash
        run: |
          set -euo pipefail
          python "$P/code/completed_evidence_audit.py"
          python "$P/code/assemble_publication.py"
          cp "$P/ROOT_README.md" README.md
          python "$P/code/build.py"
          git add -- ECTA.tex supp.tex README.md
          git add -f -- "$P"
          python "$P/code/publication_audit.py"
          git add -f -- "$P"
      - name: Publish only new revision branches after all gates pass
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote --heads origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          git commit -m 'revision(r16): publish complete NBO article, four evidence families, full supplement and referee response'
          leases=(); destinations=()
          for b in revision/econometrica-nbo-r16-paper-2026-10-04 revision/econometrica-nbo-r16-paper-evidence-2026-10-04 revision/econometrica-nbo-r16-paper-referee-2026-10-04; do
            test -z "$(git ls-remote --heads origin "refs/heads/$b")"
            leases+=("--force-with-lease=refs/heads/$b:")
            destinations+=("HEAD:refs/heads/$b")
          done
          git push --atomic "${leases[@]}" origin "${destinations[@]}"
          printf '{"publication_commit":"%s","source_commit":"%s","all_four_registered_evidence_families_complete":true,"all_empirical_referee_concerns_closed":false}\n' "$(git rev-parse HEAD)" "$GITHUB_SHA" > PUBLICATION_COMMIT.json
          cat PUBLICATION_COMMIT.json >> "$GITHUB_STEP_SUMMARY"
      - name: Package the exact reading edition and validation receipts
        if: always()
        shell: bash
        run: |
          tar -czf nbo-r16-reading-edition.tar.gz ECTA.tex supp.tex README.md "$P"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r16-reading-edition-${{ github.run_id }}
          path: |
            nbo-r16-reading-edition.tar.gz
            PUBLICATION_COMMIT.json
            revisions/2026-10-04-r16/publication/build/*.pdf
            revisions/2026-10-04-r16/publication/FINAL_AUDIT.json
            revisions/2026-10-04-r16/publication/results/COMPILATION.json
            revisions/2026-10-04-r16/publication/results/COMPLETED_EVIDENCE_READING_AUDIT.json
          if-no-files-found: error
          retention-days: 90
