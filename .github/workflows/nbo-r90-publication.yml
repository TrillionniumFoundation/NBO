name: NBO R90 original-paper revision and verification
on:
  push:
    branches: [revision/econometrica-nbo-r90-referee-revision-2026-10-13]
    paths: [.github/workflows/nbo-r90-publication.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nbo-r90-original-paper-publication
  cancel-in-progress: false
jobs:
  reproduce:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_DATE_EPOCH: '1791849600'
      FORCE_SOURCE_DATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /revisions/2026-10-13-r90/
            /revisions/2026-10-10-r62/code/
            /revisions/2026-10-10-r63/code/
            /revisions/2026-10-10-r64/code/
            /revisions/2026-10-10-r65/code/
            /revisions/2026-10-10-r66/code/
            /revisions/2026-10-10-r67/code/
            /revisions/2026-10-11-r69/code/
            /revisions/2026-10-11-r70/code/
            /revisions/2026-10-11-r72/code/
            /revisions/2026-10-11-r73/code/
            /revisions/2026-10-11-r77/code/
            /revisions/2026-10-11-r78/code/
            /revisions/2026-10-12-r80/code/
            /revisions/2026-10-12-r81/code/
            /revisions/2026-10-12-r86/code/
            /README.md
      - name: Syntax and exact new fixtures
        run: |
          python3 -m py_compile revisions/2026-10-13-r90/code/transport90.py revisions/2026-10-13-r90/code/tests90.py revisions/2026-10-13-r90/code/integrate90.py revisions/2026-10-13-r90/code/reproduce90.py
          python3 revisions/2026-10-13-r90/code/tests90.py
      - name: Recover pinned scientific records and commit ordinary manuscript
        run: |
          git config user.name 'NBO revision verification'
          git config user.email 'nbo-revision@users.noreply.github.com'
          python3 revisions/2026-10-13-r90/code/reproduce90.py --prepare
          git add --sparse -A -f revisions/2026-10-13-r90
          if ! git diff --cached --quiet; then
            git commit -m 'R90: materialize complete active article, full proofs, response and frozen scientific inputs'
            git push origin HEAD:refs/heads/revision/econometrica-nbo-r90-referee-revision-2026-10-13
          fi
      - name: Install numerical and Econometrica typesetting dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-numpy python3-scipy python3-sklearn pandoc poppler-utils texlive-latex-extra texlive-fonts-recommended texlive-science
      - name: Run all named scientific and four-document checks
        run: /usr/bin/python3 revisions/2026-10-13-r90/code/reproduce90.py
      - name: Retain actual current outputs and failure records without altering older revisions
        if: always()
        run: |
          git config user.name 'NBO revision verification'
          git config user.email 'nbo-revision@users.noreply.github.com'
          git add --sparse -A -f revisions/2026-10-13-r90
          if ! git diff --cached --quiet; then
            git commit -m 'R90: retain actual scientific checks, compiled outputs and explicit publication status'
            git push origin HEAD:refs/heads/revision/econometrica-nbo-r90-referee-revision-2026-10-13
          fi
      - name: Preserve manuscripts and diagnostics as a separate run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nbo-r90-manuscript-and-verification
          path: |
            revisions/2026-10-13-r90/build/*.pdf
            revisions/2026-10-13-r90/build/*.txt
            revisions/2026-10-13-r90/build/*.log
            revisions/2026-10-13-r90/audit/*90.json
            revisions/2026-10-13-r90/audit/r90-logs/
            revisions/2026-10-13-r90/ECTA.tex
            revisions/2026-10-13-r90/supp.tex
            revisions/2026-10-13-r90/appendix.tex
            revisions/2026-10-13-r90/response.md
          if-no-files-found: warn
          compression-level: 1
          retention-days: 30
