name: NBO R89 resume frozen first fit and cross-machine evaluation
on:
  push:
    branches: [revision/econometrica-nbo-r89-referee-revision-2026-10-13]
    paths: [.github/workflows/nbo-r89-resume.yml]
permissions:
  contents: write
  actions: read
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /revisions/2026-10-07-r45/code/
            /revisions/2026-10-08-r48/code/
            /revisions/2026-10-10-r62/code/
            /revisions/2026-10-10-r62/inputs/revisions/2026-10-08-r49/code/
            /revisions/2026-10-10-r63/code/
            /revisions/2026-10-10-r64/code/
            /revisions/2026-10-10-r67/code/
            /revisions/2026-10-13-r89/code/
            /revisions/2026-10-13-r89/PROTOCOL89.md
            /revisions/2026-10-13-r89/results89/
      - uses: actions/download-artifact@v4
        with:
          name: nbo-r89-shared-arm
          run-id: 38299428139
          github-token: ${{ github.token }}
          path: revisions/2026-10-13-r89/results89
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-numpy python3-scipy
      - name: Preserve the first fit before generating any calibration states
        run: |
          git config user.name 'NBO revision verification'
          git config user.email 'nbo-revision@users.noreply.github.com'
          python3 - <<'PY'
          import pathlib,json,hashlib
          r=pathlib.Path('revisions/2026-10-13-r89');f=json.loads((r/'results89/FIT89.json').read_text())
          assert hashlib.sha256((r/'code/shared89.py').read_bytes()).hexdigest()==f['metadata']['source_sha256']
          assert hashlib.sha256((r/'PROTOCOL89.md').read_bytes()).hexdigest()==f['metadata']['protocol_sha256']
          assert hashlib.sha256((r/'results89/MODELS89.json').read_bytes()).hexdigest()==f['models_sha256']
          assert not (r/'results89/SELECTOR89.json').exists()
          (r/'results89/RECOVERY89.json').write_text(json.dumps({'first_fit_run':38299428139,'artifact_id':11769317747,'failure':'git add rejected output paths outside sparse checkout; fitting completed and four output files were archived','refit_attempts':0,'calibration_previously_generated':False,'evaluation_previously_generated':False},indent=2)+'\n')
          PY
          git add --sparse -f revisions/2026-10-13-r89/results89
          git commit -m 'R89: commit saved first-fit coefficients before calibration; no repeated fitting'
          git push origin HEAD:refs/heads/revision/econometrica-nbo-r89-experiment-2026-10-13
      - name: Freeze calibration selector
        run: |
          /usr/bin/python3 revisions/2026-10-13-r89/code/shared89.py calibrate
          git add --sparse -f revisions/2026-10-13-r89/results89
          git commit -m 'R89: freeze calibration-selected service before independent evaluation generation'
          git push origin HEAD:refs/heads/revision/econometrica-nbo-r89-experiment-2026-10-13
      - name: Evaluate complete held-out catalogue
        run: |
          /usr/bin/python3 revisions/2026-10-13-r89/code/shared89.py evaluate --machine arm64
          git add --sparse -f revisions/2026-10-13-r89/results89
          git commit -m 'R89: preserve every ARM holdout workload, warning, fallback and complete-process timing'
          git push origin HEAD:refs/heads/revision/econometrica-nbo-r89-experiment-2026-10-13
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r89-complete-arm
          path: revisions/2026-10-13-r89/results89/
          retention-days: 30
  x86:
    needs: arm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /revisions/2026-10-07-r45/code/
            /revisions/2026-10-08-r48/code/
            /revisions/2026-10-10-r62/code/
            /revisions/2026-10-10-r62/inputs/revisions/2026-10-08-r49/code/
            /revisions/2026-10-10-r63/code/
            /revisions/2026-10-10-r64/code/
            /revisions/2026-10-10-r67/code/
            /revisions/2026-10-13-r89/code/
            /revisions/2026-10-13-r89/PROTOCOL89.md
            /revisions/2026-10-13-r89/results89/
      - uses: actions/download-artifact@v4
        with:
          name: nbo-r89-complete-arm
          path: revisions/2026-10-13-r89/results89
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-numpy python3-scipy
      - name: Replay the identical frozen coefficients and evaluation states
        run: |
          /usr/bin/python3 revisions/2026-10-13-r89/code/shared89.py replay --machine x86_64
          git config user.name 'NBO revision verification'
          git config user.email 'nbo-revision@users.noreply.github.com'
          git add --sparse -f revisions/2026-10-13-r89/results89
          git commit -m 'R89: retain x86 identical-model replay; machine replication adds no independent rows'
          git push origin HEAD:refs/heads/revision/econometrica-nbo-r89-crossmachine-2026-10-13
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r89-complete-crossmachine
          path: revisions/2026-10-13-r89/results89/
          retention-days: 30
