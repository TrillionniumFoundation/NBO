name: R30 arithmetic environment
on:
  push:
    branches: [revision/econometrica-r30-adaptive-certification-2026-09-24]
    paths: [.github/workflows/r30-environment.yml]
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip download --only-binary=:all: python-flint==0.8.0 gmpy2==2.2.1 -d /tmp/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r30-arithmetic-wheels
          path: /tmp/wheels/
          retention-days: 7
