name: R23 immutable source snapshot
on:
  push:
    branches: [revision/econometrica-r23-referee-resolution-2026-09-23]
    paths: [.github/workflows/r23-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Archive source and provenance without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nbo-r23-source
          git archive --format=tar.gz --output=/tmp/nbo-r23-source/source.tar.gz HEAD
          git rev-parse HEAD > /tmp/nbo-r23-source/COMMIT.txt
          git ls-tree -r HEAD > /tmp/nbo-r23-source/TRACKED_BLOBS.txt
          git log -60 --format='%H %cI %s' > /tmp/nbo-r23-source/HISTORY.txt
          sha256sum /tmp/nbo-r23-source/source.tar.gz > /tmp/nbo-r23-source/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r23-source-snapshot
          path: /tmp/nbo-r23-source
          retention-days: 30
