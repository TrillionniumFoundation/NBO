name: NBO R99 source closure
on:
  push:
    branches: ['revision/econometrica-nbo-r99-action-aligned-2026-10-14']
    paths: ['.github/workflows/nbo-r99-source.yml', 'revisions/2026-10-14-r99/PROTOCOL99.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /revisions/2026-10-14-r97/*.tex
            /revisions/2026-10-14-r97/*.bib
            /revisions/2026-10-14-r97/*.cls
            /revisions/2026-10-14-r97/*.cfg
            /revisions/2026-10-14-r97/*.bst
            /revisions/2026-10-14-r97/*.md
            /revisions/2026-10-14-r97/sections/
            /revisions/2026-10-14-r97/code/
            /revisions/2026-10-14-r97/new/
            /revisions/2026-10-14-r97/tables/
            /revisions/2026-10-14-r99/PROTOCOL99.md
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r99-inherited-source-closure
          path: revisions/2026-10-14-r97/
          retention-days: 30
