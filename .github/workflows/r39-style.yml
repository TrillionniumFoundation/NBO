name: R39 journal style capsule
on:
  push:
    branches: ['revision/econometrica-r39-common-continuation-2026-09-25']
    paths: ['.github/workflows/r39-style.yml']
permissions:
  contents: read
jobs:
  style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r39-style
          path: |
            econsocart.*
            *.sty
            *.bst
            revisions/2026-09-24-r34/results/certificates/H8_neural31002_epsilon1_20_primal_dual.json.gz
            revisions/2026-09-24-r34/replication/
          retention-days: 30
          if-no-files-found: error
