name: NBO R59 pinned source inspection
on:
  push:
    branches: [revision/econometrica-nbo-r59-referee-revision-2026-10-09]
    paths: [.github/workflows/nbo-r59-source-inspection.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4b5f1cc3241fe8df103844f225913d91c387795b
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            revisions/2026-10-09-r58
            reviews/2026-10-09-econometrica-numerical-methods-r54
      - name: Export ordinary sources and new evidence without duplicating old binary records
        run: |
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          root=Path('revisions/2026-10-09-r58')
          omit={'results','results52','results53','results53-extension','results55','results55-tube','attempts','evidence','inputs','build'}
          fonts={'.ttf','.otf','.woff','.woff2','.pfb','.pfa','.afm','.tfm'}
          files={}
          with zipfile.ZipFile('nbo-r59-pinned-sources.zip','w',zipfile.ZIP_DEFLATED,compresslevel=1) as z:
              for p in sorted(root.rglob('*')):
                  if not p.is_file() or '__pycache__' in p.parts or p.suffix.lower() in fonts:continue
                  rel=p.relative_to(root)
                  h=hashlib.file_digest(p.open('rb'),'sha256').hexdigest(); files[str(rel)]=h
                  if rel.parts[0] not in omit:z.write(p,'base/'+str(rel))
              for p in Path('reviews/2026-10-09-econometrica-numerical-methods-r54').rglob('*'):
                  if p.is_file() and p.suffix.lower() not in fonts:z.write(p,str(p))
              z.writestr('PINNED_FILES.json',json.dumps({'commit':'4b5f1cc3241fe8df103844f225913d91c387795b','files':files},indent=2))
          print(json.dumps({'pinned_files':len(files),'zip_bytes':Path('nbo-r59-pinned-sources.zip').stat().st_size}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r59-pinned-sources
          path: nbo-r59-pinned-sources.zip
          compression-level: 0
          retention-days: 30
