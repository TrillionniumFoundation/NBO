name: NBO R31 recent source
on:
  push:
    branches: [revision/econometrica-nbo-r31-integrated-2026-10-06]
    paths: [.github/workflows/nbo-r31-light-source.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download pinned recent derivations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,pathlib,urllib.request,concurrent.futures,hashlib,zipfile,time
          sha='01d627862b2c6fbc00c49c0c61968fc8a76e3363';repo='TrillionniumFoundation/NBO'
          def api(url):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              return json.load(urllib.request.urlopen(req,timeout=90))
          root=api(f'https://api.github.com/repos/{repo}/git/trees/e90e13ab711c31400d5131742b47c13a2d3497f7')
          names=['2026-10-05-r23','2026-10-05-r24','2026-10-05-r25','2026-10-06-r26','2026-10-06-r27','2026-10-06-r28','2026-10-06-r29','2026-10-06-r30']
          entries=[]
          for parent in root['tree']:
              if parent['path'] not in names:continue
              tree=api(parent['url']+'?recursive=1');assert not tree['truncated'],parent['path']
              for e in tree['tree']:
                  if e['type']=='blob' and e['path'].endswith(('.py','.tex','.json','.jsonl','.md','.b64','.bib','.yml','.log','.npz')):
                      e['path']='revisions/'+parent['path']+'/'+e['path'];entries.append(e)
          out=pathlib.Path('source');out.mkdir()
          def get(e):
              p=out/e['path'];p.parent.mkdir(parents=True,exist_ok=True)
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(f'https://raw.githubusercontent.com/{repo}/{sha}/'+e['path'])
                      data=urllib.request.urlopen(req,timeout=90).read();break
                  except Exception:
                      if attempt==3:raise
                      time.sleep(2**attempt)
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==e['sha'],e['path']
              p.write_bytes(data)
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:list(pool.map(get,entries))
          (out/'SOURCE_MANIFEST.json').write_text(json.dumps({'commit':sha,'entries':entries},indent=2))
          with zipfile.ZipFile('nbo-r31-recent-source.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              for p in out.rglob('*'):
                  if p.is_file():z.write(p,p.relative_to(out))
          print('Verified files:',len(entries))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r31-recent-source
          path: nbo-r31-recent-source.zip
          retention-days: 7
          if-no-files-found: error
