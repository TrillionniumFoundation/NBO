name: R119 author package validation

on:
  push:
    branches:
      - revision/econometrica-nbo-r119-active-tail-author-revision-2026-10-18
    paths:
      - .github/workflows/nbo-r119-author-package.yml
      - revisions/2026-10-18-r119/**/*.tex
      - revisions/2026-10-18-r119/code119/*.py
      - revisions/2026-10-18-r119/build119.py
      - revisions/2026-10-18-r119/archive119.py
      - revisions/2026-10-18-r119/package119.py
      - revisions/2026-10-18-r119/verify_package119.py
      - revisions/2026-10-18-r119/requirements119.txt
      - revisions/2026-10-18-r119/SOURCE_FREEZE119*.json
      - revisions/2026-10-18-r119/evidence119/*.part*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLCONFIGDIR: /tmp/nbo-matplotlib119
    steps:
      - name: Check out the isolated native revision and immutable history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: revisions/2026-10-18-r119
          persist-credentials: false
      - name: Set up the declared Python version
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.14"
      - name: Install pinned numerical dependencies and TeX
        working-directory: revisions/2026-10-18-r119
        run: |
          python -m pip install --disable-pip-version-check -r requirements119.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-science poppler-utils
      - name: Validate frozen sources, full evidence and exact decision records
        working-directory: revisions/2026-10-18-r119
        run: python verify_package119.py --output ci119/verification
      - name: Compile all four native documents
        working-directory: revisions/2026-10-18-r119
        run: python build119.py --receipt-dir ci119/build-receipts
      - name: Preserve actual CI receipts and compiled PDFs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nbo-r119-author-package-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            revisions/2026-10-18-r119/ci119/verification/VALIDATION119.json
            revisions/2026-10-18-r119/ci119/verification/*.log
            revisions/2026-10-18-r119/ci119/verification/declared-fused-fixtures/*.json
            revisions/2026-10-18-r119/ci119/verification/proof-algebra/*
            revisions/2026-10-18-r119/ci119/verification/independent-D-record-replay/**
            revisions/2026-10-18-r119/ci119/build-receipts/**
            revisions/2026-10-18-r119/build/*.pdf
            revisions/2026-10-18-r119/build/*.log
