name: R50 complete referee publication
on:
  push:
    branches: [revision/econometrica-r50-complete-diffuse-2026-09-26]
    paths: [.github/workflows/r50-publication.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: r50-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: NBO-R50-clean-scientific-evidence
          run-id: 36247753990
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/r50-executed
      - name: Materialize complete ordinary sources and retain all executed evidence
        run: |
          python - <<'PY'
          import pathlib,base64,lzma,hashlib,json,shutil
          root=pathlib.Path('revisions/2026-09-26-r50')
          text=''.join((root/'transport'/f'paper.{i}.b64').read_text().strip() for i in range(4))
          assert len(text)==52392, len(text)
          data=base64.b64decode(text,validate=True)
          assert hashlib.sha256(data).hexdigest()=='51449be10f39d58570ae2c33a45ddf255a958d1ecaf25a16c87acec8ee1101ae'
          files=json.loads(lzma.decompress(data));assert len(files)==24
          for name,content in files.items():
              p=pathlib.Path(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert name.startswith(str(root)+'/') or p.name in ['ECTA_R50.tex','SUPP_R50.tex','RESPONSE_R50.tex','R48_RECONSTRUCTED_R50.tex','R50_REVIEW.md','R50_BUILD.sh','R50_REPRODUCE.sh','requirements-r50.txt']
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content)
          for directory in ['models','proofs','results','logs']:
              src=pathlib.Path('/tmp/r50-executed')/directory
              assert src.is_dir(),str(src)
              shutil.copytree(src,root/directory,dirs_exist_ok=True)
          p=root/'replication/tables.py'
          p.write_text(p.read_text().replace('.mkdir(exist_ok=True)','.mkdir(parents=True,exist_ok=True)'))
          for name,digest in json.loads((root/'PROTOCOL.json').read_text())['code_sha256'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          meta={'schema':'nbo-r50-evaluation-complete-v1','freeze_commit':'62585130b01f1b3479b5fc9f8ee0ee927509633a','executed_run':36247753990,'executed_job':108420117149,'artifact_id':10908102464,'original_python':'3.13.15','numpy':'2.3.5','scipy':'1.17.0','original_node':'22.23.2','original_runner':'ubuntu-22.04 / 20260920.303.1','external_preregistration':False,'retains_failures':True,'provenance_note':'All 78 diffuse runs, 48 finite runs, 8 price audits and 13 cross-language checks executed before table generation failed on a missing parent directory. This publication retains those exact evidence files, repairs directory creation, and independently replays every proof. The initial failed workflow log is retained; no experimental row is substituted.'}
          (root/'EVALUATION_COMPLETE.json').write_text(json.dumps(meta,indent=2)+'\n')
          PY
          python revisions/2026-09-26-r50/replication/prepare_publication.py
          python revisions/2026-09-26-r50/replication/write_response.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add revisions/2026-09-26-r50 ECTA_R50.tex SUPP_R50.tex RESPONSE_R50.tex R48_RECONSTRUCTED_R50.tex R50_REVIEW.md RESPONSE_R50.md R50_BUILD.sh R50_REPRODUCE.sh requirements-r50.txt
          git diff --cached --quiet || git commit -m 'paper(r50): full common-policy and diffuse-density revision with 60-point response and retained clean-run evidence'
          git pull --rebase origin revision/econometrica-r50-complete-diffuse-2026-09-26
          git push origin HEAD:revision/econometrica-r50-complete-diffuse-2026-09-26
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements-r50.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-science poppler-utils
      - name: Verify every certificate and compile all four complete PDFs
        run: |
          set -o pipefail
          bash R50_BUILD.sh 2>&1 | tee /tmp/r50-publication-build.log
          cp /tmp/r50-publication-build.log revisions/2026-09-26-r50/logs/clean-publication-build.log
          python revisions/2026-09-26-r50/replication/manifest.py
      - name: Commit complete reviewable manuscript and build manifest
        run: |
          git add revisions/2026-09-26-r50 ECTA_R50.pdf SUPP_R50.pdf RESPONSE_R50.pdf R48_RECONSTRUCTED_R50.pdf RESPONSE_R50.md
          git diff --cached --quiet || git commit -m 'publication(r50): verified Econometrica PDFs, all generated tables, complete supplement and checksums'
          git pull --rebase origin revision/econometrica-r50-complete-diffuse-2026-09-26
          git push origin HEAD:revision/econometrica-r50-complete-diffuse-2026-09-26
          git rev-parse HEAD > /tmp/R50_FINAL_COMMIT.txt
          git archive --format=tar.gz HEAD ECTA_R50.tex ECTA_R50.pdf SUPP_R50.tex SUPP_R50.pdf RESPONSE_R50.tex RESPONSE_R50.pdf R48_RECONSTRUCTED_R50.tex R48_RECONSTRUCTED_R50.pdf R50_REVIEW.md RESPONSE_R50.md R50_BUILD.sh R50_REPRODUCE.sh requirements-r50.txt econsocart.cls ecta.cfg revisions > /tmp/NBO-R50-full-review-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NBO-R50-complete-referee-package
          path: |
            ECTA_R50.pdf
            SUPP_R50.pdf
            RESPONSE_R50.pdf
            R48_RECONSTRUCTED_R50.pdf
            R50_REVIEW.md
            RESPONSE_R50.md
            revisions/2026-09-26-r50/
            /tmp/R50_FINAL_COMMIT.txt
            /tmp/NBO-R50-full-review-source.tar.gz
            /tmp/r50-publication-build.log
          retention-days: 30
