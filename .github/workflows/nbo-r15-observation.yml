name: NBO R15 source-pinned protected-observation certificates

on:
  push:
    branches:
      - revision/econometrica-nbo-r15-observation-source-2026-10-04

permissions:
  contents: read
  actions: read

concurrency:
  group: nbo-r15-observation-${{ github.sha }}
  cancel-in-progress: false

env:
  NBO_R15_NUMERICAL_SOURCE_COMMIT: ${{ github.sha }}
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMBA_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.pack.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the complete committed dependency closure and pack only its bytes
        id: pack
        run: |
          python revisions/2026-10-04-r15/code/pipeline_observation.py pack \
            --repo . --out "$RUNNER_TEMP/nbo-r15-observation-source"
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r15-observation-source-${{ github.run_id }}
          path: ${{ runner.temp }}/nbo-r15-observation-source/
          if-no-files-found: error
          retention-days: 90

  observation:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nbo-r15-observation-source-${{ github.run_id }}
          path: source
      - name: Install the frozen CPU numerical environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5 scipy==1.17.0 numba==0.65.1 mpmath==1.3.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Execute one prespecified cell in a fresh process with inclusive work accounting
        shell: bash
        run: |
          set -euo pipefail
          python source/pipeline_observation.py run \
            --bundle source --workspace "$RUNNER_TEMP/nbo-r15-observation-worker" \
            --out "observation-${{ matrix.cell_id }}" \
            --dimension '${{ matrix.dimension }}' --cells '${{ matrix.cells }}'
      - name: Retain every cell and its failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nbo-r15-observation-cell-${{ matrix.cell_id }}-${{ github.run_id }}
          path: observation-${{ matrix.cell_id }}/
          if-no-files-found: warn
          retention-days: 90

  evidence:
    needs: [source, observation]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nbo-r15-observation-source-${{ github.run_id }}
          path: ${{ runner.temp }}/observation-source
      - uses: actions/download-artifact@v4
        with:
          pattern: nbo-r15-observation-cell-*-${{ github.run_id }}
          path: ${{ runner.temp }}/observation-cells
      - name: Verify all four cells and twelve transfers without outcome selection
        run: |
          python revisions/2026-10-04-r15/code/pipeline_observation.py collect \
            --repo . --bundle "$RUNNER_TEMP/observation-source" \
            --input-dir "$RUNNER_TEMP/observation-cells"
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r15-observation-complete-${{ github.run_id }}
          path: revisions/2026-10-04-r15/results/observation/
          if-no-files-found: error
          retention-days: 90
      - name: Create a new observation evidence branch and retain the immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NBO_R15_NUMERICAL_SOURCE_COMMIT"
          source_branch=revision/econometrica-nbo-r15-observation-source-2026-10-04
          evidence_branch=revision/econometrica-nbo-r15-observation-evidence-2026-10-04
          remote_source=$(git ls-remote --heads origin "refs/heads/$source_branch" | cut -f1)
          test "$remote_source" = "$NBO_R15_NUMERICAL_SOURCE_COMMIT"
          existing=$(git ls-remote --heads origin "refs/heads/$evidence_branch")
          if test -n "$existing"; then
            echo "Observation evidence branch already exists; refusing to alter it."
            exit 1
          fi
          git diff --exit-code "$NBO_R15_NUMERICAL_SOURCE_COMMIT" --
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- revisions/2026-10-04-r15/results/observation
          git commit --quiet -m 'revision(r15): preserve four source-pinned protected-parent certificates and twelve sensor transfers'
          git push --atomic origin "HEAD:refs/heads/$evidence_branch"
          evidence_commit=$(git rev-parse HEAD)
          echo "Observation numerical source: $NBO_R15_NUMERICAL_SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "Complete observation evidence: $evidence_commit" >> "$GITHUB_STEP_SUMMARY"
          echo 'All four fixed cells and twelve sensor transfers are retained. No method training or manuscript publication is performed by this workflow.' >> "$GITHUB_STEP_SUMMARY"
