name: R43 controlled-atomic publication
on:
  push:
    branches:
      - revision/econometrica-r43-regret-scaled-atomic-2026-09-25
    paths:
      - 'revisions/2026-09-25-r43/**'
      - '.github/workflows/r43-publication.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: r43-publication
  cancel-in-progress: false
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONINTMAXSTRDIGITS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact manuscript and source identities
        run: python3 revisions/2026-09-25-r43/replication/bootstrap.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numerical dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 PyMuPDF
      - name: Install Econometrica publication tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-extra texlive-fonts-recommended texlive-science
      - name: Reconstruct byte-identical initial development records
        run: python revisions/2026-09-25-r43/replication/restore_initial.py
      - name: Execute every declared controlled-model case
        run: |
          set -o pipefail
          mkdir -p revisions/2026-09-25-r43/results
          python revisions/2026-09-25-r43/replication/run_suite.py | tee revisions/2026-09-25-r43/results/execution.log
      - name: Independently verify all objects and model contracts
        run: |
          python revisions/2026-09-25-r43/replication/audit.py
          python revisions/2026-09-25-r43/replication/unit_checks.py
          python revisions/2026-09-25-r43/replication/assemble.py
      - name: Compile all four review documents and check preservation
        run: |
          for prefix in ECTA SUPP RESPONSE COMPUTATION; do
            latexmk -pdf -interaction=nonstopmode -halt-on-error "${prefix}_R43.tex"
          done
          python revisions/2026-09-25-r43/replication/publish.py
      - name: Commit verified publication only to the R43 branch
        run: |
          find revisions/2026-09-25-r43 -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add revisions/2026-09-25-r43 REVISION_INDEX.md R43_REVIEW.md
          for prefix in ECTA SUPP RESPONSE COMPUTATION; do
            git add "${prefix}_R43.tex" "${prefix}_R43.pdf"
          done
          if ! git diff --cached --quiet; then
            git commit -m 'revision(r43): publish controlled-atomic theory, exact certificates and complete referee documents [skip ci]'
            git push origin HEAD:revision/econometrica-r43-regret-scaled-atomic-2026-09-25
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r43-review-package
          path: |
            NBO_R43_review_package.zip
            revisions/2026-09-25-r43/PUBLICATION_MANIFEST.json
            revisions/2026-09-25-r43/results/preservation.json
          retention-days: 30
