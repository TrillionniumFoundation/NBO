name: NBO R70 verification and publication
on:
  push:
    branches: [revision/econometrica-nbo-r70-referee-revision-2026-10-11]
    paths: [.github/workflows/nbo-r70-publication.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nbo-r70-publication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          filter: blob:none
          sparse-checkout: |
            revisions/2026-10-10-r62
            revisions/2026-10-10-r63
            revisions/2026-10-10-r64
            revisions/2026-10-10-r65
            revisions/2026-10-10-r66
            revisions/2026-10-10-r67
            revisions/2026-10-11-r69
            revisions/2026-10-11-r70
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-numpy python3-scipy
      - name: Commit amended independent audit before executing it
        run: |
          /usr/bin/python3 revisions/2026-10-11-r70/code/amend70.py
          git config user.name 'NBO revision verification'
          git config user.email 'nbo-revision@users.noreply.github.com'
          git add revisions/2026-10-11-r70/code/audit70.py revisions/2026-10-11-r70/sections/deployment70.tex
          if ! git diff --cached --quiet; then git commit -m 'R70: verify exact saved-action chord and preserve cross-platform rounding diagnostics'; fi
      - name: Independent full-bin, training, validation and centered-inference audit
        run: |
          mkdir -p revisions/2026-10-11-r70/audit/build-logs
          /usr/bin/python3 revisions/2026-10-11-r70/code/audit70.py > revisions/2026-10-11-r70/audit/build-logs/audit70.log 2>&1 || { tail -100 revisions/2026-10-11-r70/audit/build-logs/audit70.log; exit 1; }
          cat revisions/2026-10-11-r70/audit/RESULT_AUDIT70.json
      - name: Preserve attempt diagnostics without changing prior evidence
        if: always()
        run: |
          git config user.name 'NBO revision verification'
          git config user.email 'nbo-revision@users.noreply.github.com'
          git add -f revisions/2026-10-11-r70/audit
          if ! git diff --cached --quiet; then git commit -m 'R70: preserve independent verification attempt and complete diagnostics'; fi
          git push origin HEAD:refs/heads/revision/econometrica-nbo-r70-audit-attempt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
