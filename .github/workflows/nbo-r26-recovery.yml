name: NBO R26 immutable execution recovery
on:
  push:
    branches: ['revision/econometrica-nbo-r26-2026-10-06']
    paths: ['.github/workflows/nbo-r26-recovery.yml']
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            revisions/2026-10-05-r23/code
            revisions/2026-10-05-r23/manuscript
            revisions/2026-10-05-r23/protocols
            revisions/2026-10-05-r24/code
            revisions/2026-10-05-r24/manuscript
            revisions/2026-10-05-r24/protocols
            revisions/2026-10-05-r25
            revisions/2026-10-06-r26
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - name: Recover exact artifact and required original metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags --depth=1 origin e7cfba39ea548b295305ab39040d0ba84d791c74
          python revisions/2026-10-06-r26/code/recover.py
      - name: Independently replay all 24 construction certificates
        run: |
          set -o pipefail
          python revisions/2026-10-05-r25/code/audit.py | tee revisions/2026-10-06-r26/results/RECOVERY_AUDIT.log
      - name: Package source-bound recovery
        if: always()
        run: |
          python - <<'PY'
          import zipfile, hashlib, json
          from pathlib import Path
          files=[p for p in Path('revisions').rglob('*') if p.is_file() and '__pycache__' not in p.parts]
          Path('RECOVERY_SHA256.json').write_text(json.dumps({str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files},indent=2)+'\n')
          with zipfile.ZipFile('r26-recovered-execution.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in files+[Path('RECOVERY_SHA256.json')]:z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r26-recovered-execution
          path: r26-recovered-execution.zip
          retention-days: 90
          if-no-files-found: error
