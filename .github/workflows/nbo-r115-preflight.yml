name: NBO R115 source-bound arithmetic and inherited service tests
on:
  push:
    branches: ['revision/econometrica-nbo-r115-population-gain-author-revision-2026-10-17']
    paths: ['.github/workflows/nbo-r115-preflight.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NBO_PROTOCOL108: 29180a4ce4a6db7298e7458ecdfff3da08abb08f
      NBO_SOURCE110: 5e1eae8a7017dd728b71440de3368062700fd747
      NBO115_SOURCE_COMMIT: ab43bbd84403ec715e29e2bae22fbeb9ded9c0aa
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retrieve exact executable dependency closure only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,pathlib,json,urllib.request,base64,hashlib,time
          root=pathlib.Path('source');root.mkdir()
          prefix='revisions/2026-10-17-r115/'
          def fetch(name):
              url='https://api.github.com/repos/TrillionniumFoundation/NBO/contents/'+prefix+name+'?ref='+os.environ['GITHUB_SHA']
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'NBO-R115-verification'})
                      with urllib.request.urlopen(req,timeout=60) as f:d=json.load(f)
                      b=base64.b64decode(d['content']);p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(b);return b
                  except Exception:
                      if attempt==3:raise
                      time.sleep(2**attempt)
          m=json.loads(fetch('SOURCE_FREEZE115.json'))
          for name,h in m['files'].items():
              b=fetch(name)
              assert hashlib.sha256(b).hexdigest()==h,name
          fetch('code110/test110.py')
          fetch('CUSTODY115.md');fetch('AMENDMENT115-01.md');fetch('PROTOCOL114.md')
          print('SOURCE_BYTES_VERIFIED',len(m['files']))
          PY
      - name: Install declared numerical dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Execute actual preflight tests without acquisition or test-state generation
        run: |
          cd source
          mkdir -p evidence115
          python frozen108/code108/test108.py > evidence115/preflight108.log 2>&1
          python code110/test110.py > evidence115/preflight110.log 2>&1
          python code115/test115.py > evidence115/preflight115.log 2>&1
          python - <<'PY'
          import sys,json,platform,pathlib
          from fractions import Fraction
          sys.path.insert(0,'code115');import statistics115 as s
          for v in [Fraction(1,3),Fraction(1,2**60)+Fraction(1,32),Fraction(0),2**70]:assert s.fr(v)==v
          pathlib.Path('evidence115/CI115.json').write_text(json.dumps({'scope':'46 preflight tests and four exact conversion checks; no primary population experiment','passed':True,'python':sys.version,'platform':platform.platform()},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r115-source-bound-preflight
          path: source/evidence115/
          if-no-files-found: error
          retention-days: 90
