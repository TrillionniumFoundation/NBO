name: NBO R12 development checks
on:
  push:
    branches: [revision/econometrica-nbo-r12-development-2026-10-04]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      NBO_R12_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 numba==0.65.1
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Development tests and end-to-end smoke
        run: |
          set -euo pipefail
          mkdir -p revisions/2026-10-04-r12/development/logs
          python revisions/2026-10-04-r12/code/test_r12.py 2>&1 | tee revisions/2026-10-04-r12/development/logs/tests.log
          python revisions/2026-10-04-r12/code/run.py --shard 7919 --smoke 2>&1 | tee revisions/2026-10-04-r12/development/logs/smoke.log
          python revisions/2026-10-04-r12/code/run.py --shard reference --smoke 2>&1 | tee revisions/2026-10-04-r12/development/logs/reference.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r12-development-${{ github.run_id }}
          path: revisions/2026-10-04-r12/development/
          if-no-files-found: error
          retention-days: 30
