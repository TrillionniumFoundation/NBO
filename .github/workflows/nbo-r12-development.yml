name: NBO R12 development and complete manuscript checks
on:
  push:
    branches: [revision/econometrica-nbo-r12-development-2026-10-04]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      NBO_R12_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          git fetch --no-tags --depth=1 origin 840565f451be6103aeb325a8fc548a57507a8fb2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Pinned numerical and manuscript environment
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 numba==0.65.1
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          sudo apt-get update -qq
          sudo apt-get install -y texlive-latex-extra texlive-science texlive-fonts-recommended poppler-utils
      - name: Development tests, direct differences, reference and editorial build
        run: |
          set -euo pipefail
          mkdir -p revisions/2026-10-04-r12/development/logs
          python revisions/2026-10-04-r12/code/test_runner.py --inherited 2>&1 | tee revisions/2026-10-04-r12/development/logs/tests.log
          python revisions/2026-10-04-r12/code/run.py --shard 7919 --smoke 2>&1 | tee revisions/2026-10-04-r12/development/logs/smoke.log
          python revisions/2026-10-04-r12/code/run.py --shard reference --smoke 2>&1 | tee revisions/2026-10-04-r12/development/logs/reference.log
          python revisions/2026-10-04-r12/code/run.py --shard aux --smoke 2>&1 | tee revisions/2026-10-04-r12/development/logs/aux.log
          python revisions/2026-10-04-r12/code/reference_audit.py --development
          python revisions/2026-10-04-r12/code/report.py --development 2>&1 | tee revisions/2026-10-04-r12/development/logs/report.log
          python revisions/2026-10-04-r12/code/integrate.py
          python revisions/2026-10-04-r12/code/build.py 2>&1 | tee revisions/2026-10-04-r12/development/logs/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r12-development-${{ github.run_id }}
          path: |
            revisions/2026-10-04-r12/development/
            revisions/2026-10-04-r12/build/
            revisions/2026-10-04-r12/results/
            revisions/2026-10-04-r12/logs/
            revisions/2026-10-04-r12/EDITORIAL_MAP.json
          if-no-files-found: error
          retention-days: 30
