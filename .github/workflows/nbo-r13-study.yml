name: NBO R13 complete fixed R12 numerical study
on:
  push:
    branches: [revision/econometrica-nbo-r13-2026-10-04]
    paths: [.github/workflows/nbo-r13-study.yml]
permissions:
  contents: read
env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
  NBO_R12_SOURCE_COMMIT: ${{ github.sha }}
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        shard: ['7919', '15401', '22807', '30223', '37633', '45061', '52453', '59879', '67307', '74719', 'aux', 'reference']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install the pinned numerical environment
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 numba==0.65.1
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Test and execute the unchanged full protocol
        run: |
          set -euo pipefail
          python revisions/2026-10-04-r12/code/test_runner.py
          python revisions/2026-10-04-r12/code/environment.py '${{ matrix.shard }}'
          python revisions/2026-10-04-r12/code/run.py --shard '${{ matrix.shard }}' 2>&1 | tee 'revisions/2026-10-04-r12/results/${{ matrix.shard }}/EXECUTION.stdout'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r13-primary-${{ matrix.shard }}-${{ github.run_id }}
          path: revisions/2026-10-04-r12/results/
          if-no-files-found: error
          retention-days: 90
