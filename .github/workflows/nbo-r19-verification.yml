name: NBO R19 scientific replay and native manuscripts
on:
  push:
    branches: [revision/econometrica-nbo-r19-source-2026-10-05]
    paths: [revisions/2026-10-05-r19/READY.json]
permissions:
  contents: write
concurrency:
  group: nbo-r19-publication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical and typesetting dependencies
        run: |
          python -m pip install numpy==2.3.5 mpmath==1.3.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended texlive-science
      - name: Check frozen implementation and algebra
        run: |
          python revisions/2026-10-05-r19/code/release_audit.py --source-only
          cd revisions/2026-10-05-r19/code
          python -m unittest -v test_revision
      - name: Execute all registered complete procedures
        run: |
          python revisions/2026-10-05-r19/code/study.py --out revisions/2026-10-05-r19/results/ci_registered
          python revisions/2026-10-05-r19/code/report.py --input revisions/2026-10-05-r19/results/ci_registered
      - name: Compile the native article, supplement, applications, and response
        run: |
          python revisions/2026-10-05-r19/code/build.py
          python revisions/2026-10-05-r19/code/release_audit.py
      - name: Publish only the generated scientific records and manuscripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name 'NBO manuscript verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- revisions/2026-10-05-r19/results revisions/2026-10-05-r19/build
          git commit -m 'r19: verified prospective evidence and native manuscript builds'
          for branch in revision/econometrica-nbo-r19-2026-10-05 revision/econometrica-nbo-r19-referee-2026-10-05; do
            test -z "$(git ls-remote --heads origin "refs/heads/$branch")"
          done
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push --atomic origin HEAD:refs/heads/revision/econometrica-nbo-r19-2026-10-05 HEAD:refs/heads/revision/econometrica-nbo-r19-referee-2026-10-05
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r19-native-manuscripts-and-verification
          path: |
            revisions/2026-10-05-r19/build/*.pdf
            revisions/2026-10-05-r19/build/*.log
            revisions/2026-10-05-r19/results/RELEASE_AUDIT.json
            revisions/2026-10-05-r19/results/SUMMARY.json
          if-no-files-found: warn
          retention-days: 90
