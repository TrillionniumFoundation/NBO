name: R44 frozen results and adversarial audit
on:
  push:
    branches: [revision/econometrica-r44-global-bellman-envelopes-2026-09-25]
    paths: ['.github/workflows/r44-collect.yml']
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONINTMAXSTRDIGITS: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the registered evaluation to a terminal state
        run: |
          for i in $(seq 1 180); do
            status=$(gh api repos/TrillionniumFoundation/NBO/actions/runs/36093502294 --jq .status)
            test "$status" = completed && break
            sleep 10
          done
          test "$status" = completed
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 36093502294
          pattern: r44-*
          merge-multiple: true
          path: revisions/2026-09-25-r44
      - name: Record every registered output and preserve the evaluation conclusion
        run: |
          python - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          r=Path('revisions/2026-09-25-r44')
          protocol=json.loads((r/'PROTOCOL.json').read_text())
          completions={p.parent.name:json.loads(p.read_text()) for p in (r/'results').glob('*/COMPLETE.json')}
          errors={str(p):json.loads(p.read_text()) for p in (r/'results').rglob('*error*.json')}
          run=json.loads(subprocess.check_output(['gh','api','repos/TrillionniumFoundation/NBO/actions/runs/36093502294']))
          report={'source_commit':'88314815c10f197e6cac10fc503658dbdbe16bd4','run_id':36093502294,'evaluation_conclusion':run['conclusion'],'complete_cases':sorted(completions),'case_count':len(completions),'errors':errors,'output_hashes':{str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for folder in ['results','proofs'] for p in sorted((r/folder).rglob('*')) if p.is_file()}}
          (r/'results/AGGREGATION.json').write_text(json.dumps(report,indent=2)+'\n')
          print('COMPLETE CASES',len(completions),'ERRORS',len(errors),'CONCLUSION',run['conclusion'])
          assert len(completions)==16 and not errors
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Run frozen algebraic and adversarial checks
        run: python revisions/2026-09-25-r44/replication/adversarial.py
      - name: Commit evidence only to the R44 branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add revisions/2026-09-25-r44/results revisions/2026-09-25-r44/proofs
          git commit -m 'experiment(r44): retain all frozen multi-family global searches, SCIP comparisons and independent audits [skip ci]'
          git push origin HEAD:revision/econometrica-r44-global-bellman-envelopes-2026-09-25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r44-frozen-collected
          path: |
            revisions/2026-09-25-r44/results
            revisions/2026-09-25-r44/proofs
          retention-days: 30
