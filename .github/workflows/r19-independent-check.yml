name: R19 independent scientific check
on:
  push:
    branches: [revision/econometrica-r19-development-2026-09-20]
    paths:
      - replication/r19/verify.py
      - .github/workflows/r19-independent-check.yml
permissions:
  contents: write
concurrency:
  group: r19-independent-check
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 sympy==1.14.0
      - name: Independently check the frozen witnesses
        run: python -O -u replication/r19/verify.py
      - name: Deposit independent report without changing evidence
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'revision/econometrica-r19-development-2026-09-20'
          git config user.name 'NBO Verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add replication/r19/output/validation.json
          if ! git diff --cached --quiet; then
            git commit -m 'verify(r19): independently validate analytic and array certificates'
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r19-independent-validation
          path: replication/r19/output/validation.json
          if-no-files-found: warn
          retention-days: 30
