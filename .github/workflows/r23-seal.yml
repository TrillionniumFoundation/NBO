name: R23 final immutable referee seal
on:
  push:
    branches: [revision/econometrica-r23-referee-resolution-2026-09-23]
    paths: [.github/workflows/r23-seal.yml]
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify the completed publication and seal closed logs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,subprocess,sys,zipfile
          root=Path.cwd();rev=root/'revisions/2026-09-23-r23';manifest=rev/'PUBLICATION_MANIFEST.json'
          old_bytes=manifest.read_bytes();old=json.loads(old_bytes)
          mismatches=[name for name,wanted in old['sha256'].items() if hashlib.sha256((root/name).read_bytes()).hexdigest()!=wanted]
          expected=['revisions/2026-09-23-r23/build_logs/publication.log']
          assert mismatches==expected,('unexpected publication mutation',mismatches)
          compiled_commit='03f066a800a76d2788906560f113c76318076731'
          for stem in ['ECTA_R23','SUPP_R23','RESPONSE_R23']:
              for suffix in ['.pdf','.tex']:
                  assert (root/(stem+suffix)).read_bytes()==subprocess.check_output(['git','show',compiled_commit+':'+stem+suffix])
          workflow=root/'.github/workflows/r23-publication.yml'
          text=workflow.read_text();before='python revisions/2026-09-23-r23/replication/build_publication.py --compile | tee revisions/2026-09-23-r23/build_logs/publication.log'
          after='python revisions/2026-09-23-r23/replication/build_publication.py --compile > /tmp/r23-publication-build.log\n          cat /tmp/r23-publication-build.log'
          assert text.count(before)==1;workflow.write_text(text.replace(before,after))
          note={'compiled_publication_commit':compiled_commit,'compiled_workflow_source_commit':'d33d3906d4b25ebebde252e12b5222581f576e5d','compiled_run_id':35826137923,'primary_scientific_result_commit':'7384d6bc43774ed91738db1c86ec6f21a1e6504e','previous_manifest_sha256':hashlib.sha256(old_bytes).hexdigest(),'only_preseal_mismatch':mismatches,'cause':'The builder printed its final preservation summary after the manifest had hashed the still-open tee log. No source, policy, scientific result, TeX or PDF changed.','remedy':'Hash the completed log in a separate sealing step; future builds redirect the live summary outside the indexed tree.','recompiled':False,'retrained':False,'all_six_referee_tex_pdf_blobs_unchanged':True,'sealing_source_commit':os.environ['GITHUB_SHA'],'sealing_run_id':os.environ['GITHUB_RUN_ID']}
          (rev/'archive/FINAL_SEAL.json').write_text(json.dumps(note,indent=2)+'\n')
          sys.path.insert(0,str(rev/'replication'))
          import build_publication
          final=build_publication.manifest()
          for name,wanted in final['sha256'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==wanted,('unsealed file',name)
          package=root/'NBO_R23_review_package.zip'
          with zipfile.ZipFile(package,'a',zipfile.ZIP_DEFLATED) as z:
              present=set(z.namelist())
              for name in final['sha256']:
                  if name not in present:
                      assert Path(name).suffix not in {'.ttf','.otf','.woff','.woff2','.pfb','.ttc','.afm'}
                      z.write(root/name,name)
          with zipfile.ZipFile(package) as z:
              for name,wanted in final['sha256'].items():
                  assert hashlib.sha256(z.read(name)).hexdigest()==wanted,('package hash mismatch',name)
              assert z.read('revisions/2026-09-23-r23/PUBLICATION_MANIFEST.json')==manifest.read_bytes()
              assert not any(Path(n).suffix.lower() in {'.ttf','.otf','.woff','.woff2','.pfb','.ttc','.afm'} for n in z.namelist())
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(changed)=={'.github/workflows/r23-publication.yml','revisions/2026-09-23-r23/PUBLICATION_MANIFEST.json'},changed
          print(json.dumps({'status':'PASS','verified_manifest_entries':len(final['sha256']),'preservation':final['preservation'],'pdf_build':final['checks']['pdf_build'],'archive_all_manifest_entries_verified':True},indent=2))
          PY
      - name: Publish the final sealed commit on the R23 branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/r23-publication.yml revisions/2026-09-23-r23/PUBLICATION_MANIFEST.json revisions/2026-09-23-r23/archive/FINAL_SEAL.json
          git commit -m 'integrity(r23): final sealed hashes, byte-identical referee PDFs and complete verified package'
          git push origin HEAD:revision/econometrica-r23-referee-resolution-2026-09-23
          mkdir -p /tmp/nbo-r23-final
          git rev-parse HEAD > /tmp/nbo-r23-final/PUBLICATION_COMMIT.txt
          cp ECTA_R23.pdf SUPP_R23.pdf RESPONSE_R23.pdf ECTA_R23.tex SUPP_R23.tex RESPONSE_R23.tex R23_REVIEW.md NBO_R23_review_package.zip /tmp/nbo-r23-final/
          cp revisions/2026-09-23-r23/PUBLICATION_MANIFEST.json revisions/2026-09-23-r23/archive/FINAL_SEAL.json /tmp/nbo-r23-final/
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r23-final-referee-copy
          path: /tmp/nbo-r23-final
          retention-days: 30
