name: NBO R62 prospective original-optimum science
on:
  push:
    branches: [revision/econometrica-nbo-r62-referee-revision-2026-10-10]
    paths: [.github/workflows/nbo-r62-science.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nbo-r62-science
  cancel-in-progress: false
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 80
          filter: blob:none
          sparse-checkout: |
            /revisions/2026-10-09-r61/
            /revisions/2026-10-10-r62/
          sparse-checkout-cone-mode: false
      - name: Install scientific dependencies
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 install -y --no-install-recommends python3-numpy python3-scipy python3-sympy python3-sklearn g++ libboost-dev
      - name: Prepare preserved predecessor and exercise original-primitive correctness fixtures
        run: |
          git config user.name 'NBO revision verification'
          git config user.email 'nbo-revision@users.noreply.github.com'
          git switch -c revision/econometrica-nbo-r62-science-2026-10-10
          /usr/bin/python3 revisions/2026-10-10-r62/code/prepare62.py
          /usr/bin/python3 revisions/2026-10-10-r62/code/correct_primitives62.py
          mkdir -p revisions/2026-10-10-r62/audit/build-logs
          /usr/bin/python3 revisions/2026-10-10-r62/code/tests62.py 2>&1 | tee revisions/2026-10-10-r62/audit/build-logs/preproduction62.log
        shell: bash --noprofile --norc -eo pipefail {0}
      - name: Freeze and push source before the first production result
        run: |
          /usr/bin/python3 revisions/2026-10-10-r62/code/science62.py --freeze
          git add -f revisions/2026-10-10-r62
          git commit -m 'R62: freeze original-discount tested source, theory and prospective full-policy protocol'
          git push --atomic origin HEAD:refs/heads/revision/econometrica-nbo-r62-science-2026-10-10 HEAD:refs/heads/revision/econometrica-nbo-r62-source-2026-10-10
      - name: Execute every declared task, fitting seed, accuracy rung and original-law cost family
        run: /usr/bin/python3 revisions/2026-10-10-r62/code/science62.py
      - name: Retain and push complete scientific results
        run: |
          git add -f revisions/2026-10-10-r62
          git commit -m 'R62: retain complete prospective original-optimum frontiers and two-control economic policies'
          git push origin HEAD:refs/heads/revision/econometrica-nbo-r62-science-2026-10-10
      - name: Preserve unsuccessful execution diagnostics without overwriting another branch
        if: failure()
        run: |
          git config user.name 'NBO revision verification'
          git config user.email 'nbo-revision@users.noreply.github.com'
          git add -f revisions/2026-10-10-r62
          if ! git diff --cached --quiet; then git commit -m 'R62: retain unsuccessful execution and diagnostics'; fi
          git push origin HEAD:refs/heads/revision/econometrica-nbo-r62-science-attempt-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r62-prospective-science
          path: |
            revisions/2026-10-10-r62/audit/*62.json
            revisions/2026-10-10-r62/audit/build-logs/preproduction62.log
            revisions/2026-10-10-r62/results62/**/summary.json
            revisions/2026-10-10-r62/results62/**/costs.json
            revisions/2026-10-10-r62/results62/**/clock.json
          retention-days: 30
          compression-level: 1
