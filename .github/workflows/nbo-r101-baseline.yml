name: NBO R101 immutable baseline inventory
on:
  push:
    branches: ['revision/econometrica-nbo-r101-tail-aware-policy-improvement-2026-10-15']
    paths: ['.github/workflows/nbo-r101-baseline.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Export pinned author package and all discoverable review identities
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p export/audit/blobs
          cat > /tmp/export.py <<'PY'
          import os,json,urllib.request,base64,hashlib,pathlib,concurrent.futures,time
          out=pathlib.Path('export');audit=out/'audit';base='https://api.github.com/repos/TrillionniumFoundation/NBO/'
          def get(path):
              req=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'NBO-R101-immutable-inventory'})
              for attempt in range(5):
                  try:
                      with urllib.request.urlopen(req,timeout=90) as f:return json.load(f)
                  except Exception:
                      if attempt==4:raise
                      time.sleep(2**attempt)
          def save(p,v):
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(json.dumps(v,indent=2,sort_keys=True)+'\n')
          refs=[];page=1
          while True:
              rows=get('branches?per_page=100&page='+str(page));refs+=rows
              if len(rows)<100:break
              page+=1
          save(audit/'branches.json',refs)
          shas=sorted({r['commit']['sha'] for r in refs})
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:roots=dict(zip(shas,pool.map(lambda s:get('git/trees/'+s),shas)))
          save(audit/'branch_roots.json',roots)
          rs=sorted({e['sha'] for t in roots.values() for e in t.get('tree',[]) if e['type']=='tree' and any(w in e['path'].lower() for w in ('review','referee'))})
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:trees=dict(zip(rs,pool.map(lambda s:get('git/trees/'+s+'?recursive=1'),rs)))
          save(audit/'review_trees.json',trees)
          entries={e['sha']:e for t in trees.values() for e in t.get('tree',[]) if e['type']=='blob' and e['path'].endswith(('.md','.tex','.json','.py','.txt'))}
          def blob(item):
              sha,e=item;data=base64.b64decode(get('git/blobs/'+sha)['content']);assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              p=audit/'blobs'/(sha+pathlib.Path(e['path']).suffix);p.write_bytes(data)
              return {'git_blob':sha,'path':e['path'],'local':str(p.relative_to(out)),'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:records=list(pool.map(blob,entries.items()))
          save(audit/'review_blob_index.json',records)
          sha='f39d707c2d831c390090d2263a2e6d2aa0b1df5b';data=base64.b64decode(get('git/blobs/'+sha)['content']);assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          (out/'NBO_R99_referee_package.zip').write_bytes(data)
          save(audit/'source.json',{'author_commit':'f78d7fcec9f657dfec56a0af7899fe967948652d','package_git_blob':sha,'sha256':hashlib.sha256(data).hexdigest(),'workflow_commit':os.environ['GITHUB_SHA'],'protocol_commit':'89e7fedbe05c774ce35a6ddcdaaa139b2b0e437b'})
          save(audit/'status.json',{'branches':len(refs),'review_blobs':len(records),'truncated_review_trees':[s for s,t in trees.items() if t.get('truncated')],'scope':'all branch roots and discoverable review subtrees plus pinned full R99 author package; not a claim of completed scientific review'})
          print(json.dumps({'branches':len(refs),'review_blobs':len(records),'package_bytes':len(data)}))
          PY
          python /tmp/export.py
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r101-immutable-baseline
          path: export/
          if-no-files-found: error
          retention-days: 30
