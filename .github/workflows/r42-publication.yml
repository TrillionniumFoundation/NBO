name: R42 atomic-structure publication
on:
  push:
    branches:
      - revision/econometrica-r42-atomic-structure-2026-09-25
    paths:
      - 'revisions/2026-09-25-r42/**'
      - '.github/workflows/r42-publication.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: r42-publication
  cancel-in-progress: false
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and expand source identity
        run: python3 revisions/2026-09-25-r42/replication/bootstrap.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install reproducible numerical dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 PyMuPDF
      - name: Install publication tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-extra texlive-fonts-recommended texlive-science
      - name: Execute all declared cases and independent checks
        run: |
          python revisions/2026-09-25-r42/replication/run_suite.py
          python revisions/2026-09-25-r42/replication/repair_tests.py
          python revisions/2026-09-25-r42/replication/density_transfer.py
          python revisions/2026-09-25-r42/replication/assemble.py
      - name: Compile the four current review documents
        run: |
          for prefix in ECTA SUPP RESPONSE COMPUTATION; do
            latexmk -pdf -interaction=nonstopmode -halt-on-error "${prefix}_R42.tex"
          done
          python revisions/2026-09-25-r42/replication/publish.py
      - name: Commit additive publication to the R42 branch
        run: |
          find revisions/2026-09-25-r42 -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add revisions/2026-09-25-r42 REVISION_INDEX.md R42_REVIEW.md HISTORY_R42.pdf
          for prefix in ECTA SUPP RESPONSE COMPUTATION; do
            git add "${prefix}_R42.tex" "${prefix}_R42.pdf"
          done
          if ! git diff --cached --quiet; then
            git commit -m 'revision(r42): publish atomic-structure manuscript, exact certificates, response and preservation audit [skip ci]'
            git push origin HEAD:revision/econometrica-r42-atomic-structure-2026-09-25
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r42-review-package
          path: |
            NBO_R42_review_package.zip
            revisions/2026-09-25-r42/PUBLICATION_MANIFEST.json
            revisions/2026-09-25-r42/results/preservation.json
          retention-days: 30
