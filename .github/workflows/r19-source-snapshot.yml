name: R19 immutable review input
on:
  push:
    branches: [revision/econometrica-r19-policy-sensitive-continuation-2026-09-23]
    paths: [.github/workflows/r19-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive immutable source, numerical evidence and referee history
        run: |
          git archive HEAD | gzip -n > nbo-r19-input.tar.gz
          git rev-parse HEAD > SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r19-input
          path: |
            nbo-r19-input.tar.gz
            SOURCE_COMMIT.txt
          retention-days: 14
