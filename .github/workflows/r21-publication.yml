name: R21 verified policy-sensitive referee publication
on:
  push:
    branches: [revision/econometrica-r21-policy-sensitive-2026-09-23]
    paths:
      - .github/workflows/r21-publication.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: nbo-r21-referee-publication
  cancel-in-progress: true
jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      R21_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate the readable source commit and unchanged historical inputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, importlib.util, subprocess
          required=['ECTA_R21.tex','SUPP_R21.tex','R21_REVIEW.md','REVISION_INDEX.md','revisions/2026-09-23-r21/RESPONSE_TO_R21_SNAPSHOT.md','revisions/2026-09-23-r21/replication/representation_audit.py']
          for name in required:assert Path(name).is_file(),name
          p='revisions/2026-09-23-r21/replication/build.py'
          spec=importlib.util.spec_from_file_location('r21build',p);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          print(m.preservation())
          review='reviews/2026-09-23-econometrica-r21/referee_report.md'
          content=Path(review).read_bytes()
          expected=subprocess.check_output(['git','show','bc118f20f6361cdeae668141e45f64c436ee6a2a:'+review])
          assert content==expected
          assert hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()=='d98e887168b892c758718181dadaae560d168ebd'
          print('Both review inputs and the complete readable R21 source are pinned in this commit.')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numerical and Econometrica build dependencies
        run: |
          python -m pip install numpy==2.3.5
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libmpfr-dev gcc texlive-latex-extra texlive-fonts-recommended poppler-utils
      - name: Re-execute all 136 frozen-policy checks including 20 MPFR cases
        run: python revisions/2026-09-23-r21/replication/replay.py --workers 2
      - name: Verify continuum, price, welfare, and representation comparisons
        run: |
          python revisions/2026-09-23-r21/replication/audit.py
          python revisions/2026-09-23-r21/replication/representation_audit.py
      - name: Build all three Econometrica documents in three passes
        run: python revisions/2026-09-23-r21/replication/build.py
      - name: Pin publication hashes and create referee package
        run: python revisions/2026-09-23-r21/replication/manifest.py
      - name: Commit complete referee object to the new revision branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ECTA_R21.tex SUPP_R21.tex RESPONSE_R21.tex R21_REVIEW.md REVISION_INDEX.md
          git add -f ECTA_R21.pdf SUPP_R21.pdf RESPONSE_R21.pdf
          git add revisions/2026-09-23-r21
          python - <<'PY'
          import importlib.util
          p='revisions/2026-09-23-r21/replication/build.py'
          spec=importlib.util.spec_from_file_location('r21build',p);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          print(m.preservation())
          PY
          git diff --cached --quiet || git commit -m 'publication(r21): validated Econometrica PDFs, continuum policy proofs and latest referee response'
          git push origin HEAD:${GITHUB_REF_NAME}
          git rev-parse HEAD > R21_PUBLICATION_COMMIT.txt
      - name: Deliver the exact committed referee files
        uses: actions/upload-artifact@v4
        with:
          name: nbo-r21-referee-publication
          path: |
            NBO_R21_review_package.zip
            R21_PUBLICATION_COMMIT.txt
          retention-days: 30
      - name: Retain diagnostic logs and complete checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nbo-r21-publication-diagnostics
          path: |
            revisions/2026-09-23-r21/build_logs
            revisions/2026-09-23-r21/results
          if-no-files-found: warn
          retention-days: 30
