name: NBO R9 signed cover and integrated revision
on:
  push:
    branches: [revision/econometrica-nbo-r9-source-2026-10-03]
    paths: [revisions/2026-10-03-r9/RUN.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nbo-r9-integrated
  cancel-in-progress: false
jobs:
  reproduce:
    if: github.ref == 'refs/heads/revision/econometrica-nbo-r9-source-2026-10-03'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Pin and hash the complete plain-text R9 source
        shell: bash
        run: |
          set -euo pipefail
          echo "NBO_BOOTSTRAP_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "NBO_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          r=Path('revisions/2026-10-03-r9')
          paths=[p for p in r.rglob('*') if p.is_file()]
          paths.append(Path('.github/workflows/nbo-r9-integrated.yml'))
          manifest={'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                    'files':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}}
          (r/'SOURCE_MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Install recorded numerical and journal dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended texlive-science cm-super
      - name: Execute every declared computation and compile the integrated paper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p revisions/2026-10-03-r9/logs
          python -u revisions/2026-10-03-r9/code/replicate.py | tee revisions/2026-10-03-r9/logs/driver.log
          bash revisions/2026-10-03-r9/code/build_pdf.sh | tee revisions/2026-10-03-r9/logs/compilation.log
      - name: Verify preservation and push the complete evidence branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NBO_SOURCE_COMMIT"
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          r=Path('revisions/2026-10-03-r9')
          assert json.loads((r/'results/EXECUTION_COMPLETE.json').read_text())['complete']
          compilation=json.loads((r/'results/COMPILATION.json').read_text())
          assert all(not v['undefined'] for v in compilation.values())
          assert all(not v['overfull_hbox_pt'] for v in compilation.values())
          previous=json.loads((r/'archive/R8_FILES_SHA256.json').read_text())
          for name,digest in previous.items():
              if name in ['ECTA.tex','supp.tex']:continue
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(changed)<=set(['ECTA.tex','supp.tex']),changed
          for name,digest in json.loads((r/'SOURCE_MANIFEST.json').read_text())['files'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          paths=[Path('ECTA.tex'),Path('supp.tex')]
          paths += [p for p in r.rglob('*') if p.is_file() and '__pycache__' not in p.parts]
          manifest={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
          (r/'EVIDENCE_MANIFEST.json').write_text(json.dumps({'files':manifest},indent=2)+'\n')
          record={'bootstrap_commit':os.environ['NBO_BOOTSTRAP_COMMIT'],'source_commit':os.environ['NBO_SOURCE_COMMIT'],
           'workflow_run_id':os.environ['GITHUB_RUN_ID'],'workflow_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
           'historical_files_preserved':len(previous)-2,'main_and_supplement_integrated':True,
           'compilation':compilation,'execution':json.loads((r/'results/EXECUTION_COMPLETE.json').read_text()),
           'interval_scope':'conditional outward arithmetic; not formal machine verification',
           'scope':'new R9 revision; no change to earlier branches or another paper'}
          (r/'REMOTE_EXECUTION.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          find revisions/2026-10-03-r9 -type d -name __pycache__ -prune -exec rm -rf '{}' +
          git add ECTA.tex supp.tex revisions/2026-10-03-r9
          git commit -m 'revision(r9): signed Bellman certificates, guarded nested training and continuous capital benchmark [skip ci]'
          branch=revision/econometrica-nbo-r9-evidence-2026-10-03
          test -z "$(git ls-remote --heads origin "$branch")"
          git push origin HEAD:"$branch"
          mkdir -p /tmp/nbo-r9-candidate
          git archive --format=tar.gz --output=/tmp/nbo-r9-candidate/source.tar.gz HEAD
          git rev-parse HEAD > /tmp/nbo-r9-candidate/EVIDENCE_COMMIT.txt
          printf '%s\n' "$NBO_SOURCE_COMMIT" > /tmp/nbo-r9-candidate/SOURCE_COMMIT.txt
          cp revisions/2026-10-03-r9/build/{ECTA,supp,response}.pdf /tmp/nbo-r9-candidate/
          cp revisions/2026-10-03-r9/REMOTE_EXECUTION.json /tmp/nbo-r9-candidate/
          (cd /tmp/nbo-r9-candidate && sha256sum source.tar.gz *.pdf > SHA256SUMS)
          echo "Source: $NBO_SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve candidate and complete failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nbo-r9-integrated-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            /tmp/nbo-r9-candidate/
            revisions/2026-10-03-r9/logs/
            revisions/2026-10-03-r9/results/
