name: NBO R66 inherited test fixture
on:
  push:
    branches: [revision/econometrica-nbo-r66-revision-2026-10-10]
    paths: [.github/workflows/nbo-r66-inherited-fixture.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /revisions/2026-10-10-r64/results64/d2-T2-e32-adaptive-s0-r0/
            /revisions/2026-10-10-r65/audit/RESULT_AUDIT65.json
          sparse-checkout-cone-mode: false
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r66-inherited-fixture
          path: revisions/
          compression-level: 1
          retention-days: 14
