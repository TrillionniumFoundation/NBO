name: R27 revision source and validation
on:
  push:
    branches: [revision/econometrica-r27-constrained-bellman-2026-09-23]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture complete pinned source
        run: |
          git rev-parse HEAD > /tmp/SOURCE_COMMIT.txt
          git archive --format=tar.gz --output=/tmp/NBO_R27_source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r27-source-${{ github.run_id }}
          path: |
            /tmp/NBO_R27_source.tar.gz
            /tmp/SOURCE_COMMIT.txt
          retention-days: 14
  validate:
    if: contains(github.event.head_commit.message, '[validate-r27]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical and manuscript dependencies
        run: |
          pip install numpy scipy sympy torch mpmath
          sudo apt-get update -qq
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended
      - name: Execute revision verification and compile
        run: |
          python revisions/2026-09-23-r27/replication/test_revision.py
          for doc in ECTA_R27 SUPP_R27 RESPONSE_R27; do
            latexmk -pdf -interaction=nonstopmode -halt-on-error "$doc.tex"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r27-validated-${{ github.run_id }}
          path: |
            ECTA_R27.pdf
            SUPP_R27.pdf
            RESPONSE_R27.pdf
            revisions/2026-09-23-r27/results/
          retention-days: 30
