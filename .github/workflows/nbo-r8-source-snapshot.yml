name: NBO R8 pinned source snapshot
on:
  push:
    branches:
      - revision/econometrica-nbo-r8-development-2026-10-03
    paths:
      - .github/workflows/nbo-r8-source-snapshot.yml
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source and evidence only
        run: |
          mkdir -p /tmp/nbo-r8-snapshot
          git archive --format=tar.gz --output=/tmp/nbo-r8-snapshot/source.tar.gz HEAD
          git rev-parse HEAD > /tmp/nbo-r8-snapshot/SOURCE_COMMIT.txt
          sha256sum /tmp/nbo-r8-snapshot/source.tar.gz > /tmp/nbo-r8-snapshot/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r8-source-snapshot
          path: /tmp/nbo-r8-snapshot/
          retention-days: 90
          if-no-files-found: error
