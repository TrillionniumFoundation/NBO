name: NBO R21 native referee publication
on:
  push:
    branches: ['revision/econometrica-nbo-r21-2026-10-05']
    paths: ['.github/workflows/nbo-r21-publication.yml']
permissions:
  contents: write
concurrency:
  group: nbo-r21-publication
  cancel-in-progress: false
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      R: revisions/2026-10-05-r21
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            *.tex
            *.bib
            *.cls
            *.cfg
            *.bst
            *.sty
            *.py
            *.md
            /revisions/2026-10-05-r19-integrated/RESPONSE_MAP.json
            /revisions/2026-10-05-r19-integrated/protocols/
            /revisions/2026-10-05-r19-integrated/results/
            /revisions/2026-10-05-r20/results/
            /revisions/2026-10-05-r21/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numerical and native typesetting dependencies
        run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended texlive-science poppler-utils
      - name: Install checked plain sources and archive unchanged originals
        run: python "$R/transport/install.py"
      - name: Recheck frozen records and regenerate complete economic tables
        run: |
          set -euo pipefail
          python "$R/code/report_future.py" 2>&1 | tee "$R/results/TABLE_GENERATION.log"
      - name: Run both test suites without skipped cases
        run: |
          set -euo pipefail
          python -m unittest discover -s "$R/code" -p 'test*.py' -v 2>&1 | tee "$R/results/UNIT_TESTS.log"
          python -m unittest discover -s revisions/2026-10-05-r19-integrated/code -p 'test*.py' -v 2>&1 | tee "$R/results/INHERITED_TESTS.log"
      - name: Verify complete retention of scientific source and labels
        run: |
          set -euo pipefail
          python "$R/code/preservation.py" 2>&1 | tee "$R/results/PRESERVATION.log"
      - name: Compile all four native Econometrica documents
        run: |
          set -euo pipefail
          python "$R/code/build.py" 2>&1 | tee "$R/results/BUILD.log"
      - name: Bind native publication to source, tests and completed arithmetic replay
        run: |
          set -euo pipefail
          python "$R/code/release_audit.py" 2>&1 | tee "$R/results/RELEASE_AUDIT.log"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=Path(os.environ['R'])
          record=dict(repository=os.environ['GITHUB_REPOSITORY'],source_commit=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],
            run_url='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
            checks=['25 source payload files','168 frozen record digests','complete regenerated tables','22 new and 34 inherited tests without skips','129 retained components and 408 original labels','four native econsocart PDFs','completed local full arithmetic replay bound by source hash'],
            full_arithmetic_replay='The saved audit is the completed author-session replay of 984 attempted certificates and 120 additional zero-charge certificates; this publication job does not claim to rerun that full calculation.')
          (r/'results/CI.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - name: Commit publication to new revision branch without overwriting concurrent work
        run: |
          set -euo pipefail
          git config user.name 'NBO Revision Bot'
          git config user.email 'nbo-revision@users.noreply.github.com'
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          r=Path(os.environ['R'])
          paths=['ECTA.tex','supp.tex','README.md']
          allowed={'.tex','.bib','.md','.py','.json','.csv','.log','.pdf','.stdout','.aux','.bbl','.blg','.out','.txt','.b64'}
          for p in r.rglob('*'):
              if p.is_file() and '__pycache__' not in p.parts and p.suffix in allowed: paths.append(str(p))
          subprocess.run(['git','add','--',*paths],check=True)
          staged=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          assert staged and all(p in {'ECTA.tex','supp.tex','README.md'} or p.startswith(str(r)+'/') for p in staged)
          subprocess.run(['git','commit','-m','revision(r21): publish complete Econometrica manuscript, economic certificates and verified referee response'],check=True)
          PY
          target=refs/heads/revision/econometrica-nbo-r21-2026-10-05
          observed=$(git ls-remote origin "$target" | cut -f1)
          test "$observed" = "$GITHUB_SHA"
          git push origin "HEAD:$target"
      - name: Package source-complete review copy without historical data duplication
        run: |
          python - <<'PY'
          import json,os,zipfile,hashlib,subprocess
          from pathlib import Path
          r=Path(os.environ['R']); paths=set(['ECTA.tex','supp.tex','README.md','econsocart.cls','econsocart.cfg','ecta-fullname.bst','reference.bib','revision_reference.bib','appendix_reference.bib'])
          audit=json.loads((r/'results/RELEASE_AUDIT.json').read_text())
          paths.update(audit['source_sha256'])
          for p in r.rglob('*'):
              if p.is_file() and '__pycache__' not in p.parts and 'transport' not in p.parts and p.suffix in {'.tex','.bib','.md','.py','.json','.csv','.log','.pdf'}: paths.add(str(p))
          for old in ['2026-10-05-r19-integrated','2026-10-05-r20']:
              for p in (Path('revisions')/old/'code').glob('*.py'): paths.add(str(p))
          for p in Path('revisions/2026-10-05-r19-integrated/protocols').rglob('*'):
              if p.is_file(): paths.add(str(p))
          manifest={}
          with zipfile.ZipFile('/tmp/NBO_R21_publication.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in sorted(paths):
                  p=Path(name)
                  if p.is_file(): z.write(p,name); manifest[name]=hashlib.sha256(p.read_bytes()).hexdigest()
              z.writestr('PUBLICATION_FILES_SHA256.json',json.dumps(manifest,indent=2)+'\n')
              z.writestr('REMOTE_COMMIT.txt',subprocess.check_output(['git','rev-parse','HEAD']).decode())
              z.writestr('PACKAGE_SCOPE.txt','Source-complete typesetting and review copy. Large original R19/R20 raw experiment records remain in the GitHub repository at the pinned commits; numerical replay uses that checkout. No original evidence has been deleted or replaced.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r21-native-publication
          path: |
            /tmp/NBO_R21_publication.zip
            revisions/2026-10-05-r21/build/ECTA.pdf
            revisions/2026-10-05-r21/build/supp.pdf
            revisions/2026-10-05-r21/build/applications.pdf
            revisions/2026-10-05-r21/build/response.pdf
            revisions/2026-10-05-r21/results/*.json
            revisions/2026-10-05-r21/results/*.log
            revisions/2026-10-05-r21/build/*.stdout
          if-no-files-found: warn
          retention-days: 30
