name: R4 source and validation
on:
  push:
    branches: [revision/econometrica-r4-stochastic-operator-2026-09-21]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Export frozen scientific sources
        run: git archive --format=tar HEAD > nbo-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r4-source
          path: nbo-source.tar
          retention-days: 7
