name: R32 source snapshot
on:
  push:
    branches: [revision/econometrica-r32-constructive-certificates-2026-09-24]
    paths: [.github/workflows/r32-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive journal sources and preserved history
        run: |
          git ls-files -z '*.cls' '*.cfg' '*.bst' '*.sty' 'ECTA_R30.*' 'SUPP_R30.*' 'RESPONSE_R30.*' 'COMPUTATION_R30.*' 'HISTORY_R30.*' 'revisions/2026-09-24-r30/paper/*' 'reviews/2026-09-24-econometrica-r30/*' | tar --null -T - -czf nbo-r32-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: r32-source-${{ github.sha }}
          path: nbo-r32-source.tar.gz
          retention-days: 1
