name: NBO R96 original-law decision precision
on:
  push:
    branches: [revision/econometrica-nbo-r96-decision-precision-2026-10-13]
    paths: [.github/workflows/nbo-r96-study.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nbo-r96-primary-confirmation
  cancel-in-progress: false
jobs:
  confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      R: revisions/2026-10-13-r96
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /revisions/2026-10-13-r96/
            /revisions/*/code/
            /revisions/2026-10-10-r62/inputs/
            /revisions/2026-10-11-r73/results73/
            /revisions/2026-10-11-r77/results77/summary.json
            /econsocart.cls
            /econsocart.cfg
            /ecta-fullname.bst
            /.github/workflows/nbo-r96-study.yml
      - name: Materialize ordinary R96 sources and the amended preservation contract
        id: materialize
        run: python "$R/bootstrap96/materialize96.py"
      - name: Publish the source and protocol before constructing any primary actor
        run: |
          git config user.name 'NBO revision verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --force --sparse -- "$R" ":(exclude)$R/**/__pycache__/**" ":(exclude)$R/**/*.pyc"
          git commit -m 'R96: freeze ordinary manuscript, convex-order proof and prospective confirmation protocol'
          git push origin HEAD:"$GITHUB_REF_NAME"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install numerical and publisher dependencies
        id: dependencies
        run: |
          python -m pip install -r "$R/requirements95.txt"
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended pandoc poppler-utils time
      - name: Verify new precision and source-preservation tests before primary construction
        run: |
          cd "$R"
          /usr/bin/time -v -o audit/reproduction96/NEW_TESTS96.time python -m unittest discover -s code -p 'tests*96.py' -v > audit/reproduction96/NEW_TESTS96.log 2>&1
      - name: Construct rank-matched models and calibrate without opening confirmation
        id: prepare
        run: |
          cd "$R"
          /usr/bin/time -v -o audit/reproduction96/PREPARE96.time python code/experiment96.py prepare > audit/reproduction96/PREPARE96.log 2>&1
      - name: Commit and publish actual models and selector before confirmation
        id: freeze
        run: |
          git add --force --sparse -- "$R/results96" "$R/audit/reproduction96"
          git commit -m 'R96: publish actual rank-six models, calibration selector and source identities before independent confirmation'
          git push origin HEAD:"$GITHUB_REF_NAME"
      - name: Execute the previously unopened independent confirmation stream
        id: evaluate
        run: |
          cd "$R"
          /usr/bin/time -v -o audit/reproduction96/EVALUATE96.time python code/experiment96.py evaluate --tag primary > audit/reproduction96/EVALUATE96.log 2>&1
      - name: Measure forty fresh-process executions with complete process boundaries
        id: timing
        if: success()
        run: |
          cd "$R"
          /usr/bin/time -v -o audit/reproduction96/TIMING96.time python code/experiment96.py timing > audit/reproduction96/TIMING96.log 2>&1
      - name: Independently reconstruct all statistics and sixty-four random policy endpoints
        id: independent
        if: always() && steps.evaluate.outcome == 'success'
        run: |
          cd "$R"
          /usr/bin/time -v -o audit/reproduction96/INDEPENDENT96.time python code/independent96.py --tag primary --fixtures 8 > audit/reproduction96/INDEPENDENT96.log 2>&1
      - name: Replay every inherited and new suite without skips
        id: tests
        if: always() && steps.dependencies.outcome == 'success' && steps.materialize.outcome == 'success'
        run: python "$R/code/run_tests95.py" --output-dir audit/reproduction96/tests
      - name: Generate source-bound tables from the actual frozen observations
        id: tables
        if: always() && steps.evaluate.outcome == 'success' && steps.timing.outcome == 'success'
        run: python "$R/code/report96.py" --tag primary
      - name: Compile the four current manuscripts using the publisher class
        id: build
        if: always() && steps.tables.outcome == 'success'
        run: python "$R/code/build95.py" --audit-dir audit/reproduction96/build
      - name: Reconstruct current PDFs again from clean source
        id: clean
        if: always() && steps.build.outcome == 'success'
        run: python "$R/code/clean96.py"
      - name: Write actual source-bound release gates without relabeling failures
        id: release
        if: always() && steps.materialize.outcome == 'success'
        run: python "$R/code/release96.py" --tag primary
      - name: Retain all outcomes, current sources, raw evidence and generated PDFs
        if: always() && steps.materialize.outcome == 'success'
        run: |
          git add --force --sparse -- "$R" ":(exclude)$R/**/__pycache__/**" ":(exclude)$R/**/*.pyc"
          if ! git diff --cached --quiet; then
            git commit -m 'R96: retain actual confirmation, independent checks, test outcomes and current publication builds'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r96-primary-${{ github.run_id }}
          path: revisions/2026-10-13-r96
          retention-days: 30
          if-no-files-found: error
