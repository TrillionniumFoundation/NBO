name: NBO R69 original-paper referee publication
on:
  push:
    branches: [revision/econometrica-nbo-r69-referee-revision-2026-10-11]
    paths: [.github/workflows/nbo-r69-publication.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nbo-r69-referee-publication
  cancel-in-progress: false
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_DATE_EPOCH: '1791676800'
      FORCE_SOURCE_DATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
          filter: blob:none
          sparse-checkout: |
            /revisions/2026-10-10-r62/
            /revisions/2026-10-10-r63/
            /revisions/2026-10-10-r64/
            /revisions/2026-10-10-r65/
            /revisions/2026-10-10-r66/
            /revisions/2026-10-10-r67/
            /revisions/2026-10-11-r69/
            /README.md
          sparse-checkout-cone-mode: false
      - name: Install verification and publication dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-numpy python3-scipy python3-sklearn pandoc poppler-utils texlive-latex-extra texlive-fonts-recommended texlive-science
      - name: Integrate exact tested science and ordinary original-paper sources
        run: |
          git config user.name 'NBO revision verification'
          git config user.email 'nbo-revision@users.noreply.github.com'
          git fetch --no-tags --filter=blob:none --depth=100 origin c8c420763a36e8da41a34b0187d7160f1c323952
          git merge --no-edit c8c420763a36e8da41a34b0187d7160f1c323952
          /usr/bin/python3 revisions/2026-10-11-r69/code/prepare_paper69.py
          git add -f revisions/2026-10-11-r69
          if ! git diff --cached --quiet; then git commit -m 'R69: integrate ordinary manuscript, complete preserved development and tested scientific sources'; fi
          git push --atomic origin HEAD:refs/heads/revision/econometrica-nbo-r69-referee-revision-2026-10-11 HEAD:refs/heads/revision/econometrica-nbo-r69-source-2026-10-11
      - name: Require and bind the complete executed catalogue and latest referee report
        run: |
          git fetch --no-tags --filter=blob:none --depth=100 origin refs/heads/revision/econometrica-nbo-r69-executed-2026-10-11:refs/remotes/origin/r69-executed
          git merge --no-edit refs/remotes/origin/r69-executed
          git fetch --no-tags --filter=blob:none --depth=1 origin 4b27b56f4514f6c1d77b69fe707f7202f8b06b19
          git fetch --no-tags --filter=blob:none --depth=1 origin eacd3e217ae1e2e9ea6e154b48da7d103159d051
          /usr/bin/python3 revisions/2026-10-11-r69/code/finalize_sources69.py
          /usr/bin/python3 - <<'PY'
          import ast
          from pathlib import Path
          root=Path('revisions/2026-10-11-r69')
          for path in (root/'code').glob('*.py'):
              ast.parse(path.read_bytes(),filename=str(path))
          PY
          git add -f revisions/2026-10-11-r69
          if ! git diff --cached --quiet; then git commit -m 'R69: bind complete executed catalogue, exact scientific blobs and controlling R67 report'; fi
          git push --atomic origin HEAD:refs/heads/revision/econometrica-nbo-r69-referee-revision-2026-10-11 HEAD:refs/heads/revision/econometrica-nbo-r69-source-2026-10-11
      - name: Run inherited and new tests, independent trajectory checks and complete publication build
        run: /usr/bin/python3 revisions/2026-10-11-r69/code/build69.py
      - name: Rebuild the clean offline archive and verify atomic remote publication
        run: /usr/bin/python3 revisions/2026-10-11-r69/code/publish69.py
      - name: Retain complete PDFs, records and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nbo-r69-publication-and-audits
          path: |
            revisions/2026-10-11-r69/build/*.pdf
            revisions/2026-10-11-r69/build/*.txt
            revisions/2026-10-11-r69/build/*.png
            revisions/2026-10-11-r69/audit/
            revisions/2026-10-11-r69/tables/*69.tex
            revisions/2026-10-11-r69/CONTENT_MAP69.md
          compression-level: 1
          retention-days: 30
