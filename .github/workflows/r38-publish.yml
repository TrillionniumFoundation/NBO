name: R38 completed manuscript publication
on:
  push:
    branches: [revision/econometrica-r38-verified-global-bounds-2026-09-24]
    paths: [.github/workflows/r38-publish.yml, '.r38-transfer/paper-*.b64']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: r38-manuscript-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install explicit publication dependencies
        run: |
          python -m pip install numpy==2.3.5 sympy==1.14.0 PyMuPDF==1.26.7
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended latexmk
      - name: Retrieve exact historical preservation baseline
        run: git fetch --depth=1 origin c81410887bca5c16975beabb2ca8d6be7f235a19
      - name: Materialize hash-checked complete manuscript sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,json,hashlib
          encoded=''.join(Path(f'.r38-transfer/paper-{i}.b64').read_text().strip() for i in range(6))
          data=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(data).hexdigest()=='e58d0774a8c5cde5abb6bc73dd686884f9b2c0e1dfda9cd3d35ee79c4f0b186b'
          allowed={f'{name}_R38.tex' for name in ('ECTA','SUPP','RESPONSE','COMPUTATION','HISTORY')}|{'R38_REVIEW.md'}
          files=json.loads(data)
          assert len(files)==20
          for name,content in files.items():
              rel=Path(name)
              assert not rel.is_absolute() and '..' not in rel.parts
              assert name.startswith('revisions/2026-09-24-r38/') or name in allowed
              rel.parent.mkdir(parents=True,exist_ok=True)
              rel.write_text(content,encoding='utf-8')
          PY
      - name: Build all five PDFs and check scientific and historical preservation
        run: python revisions/2026-09-24-r38/build/publish.py
      - name: Commit completed review object on its isolated branch
        env:
          BRANCH: revision/econometrica-r38-verified-global-bounds-2026-09-24
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          find revisions/2026-09-24-r38 -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'NBO scientific publication'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f revisions/2026-09-24-r38 R38_REVIEW.md REVISION_INDEX.md
          for name in ECTA SUPP RESPONSE COMPUTATION HISTORY; do
            git add -f "${name}_R38.tex" "${name}_R38.pdf"
          done
          git commit -m 'paper(r38): publish completed Econometrica revision, full response, proofs and preservation-checked PDFs'
          git push origin HEAD:"$BRANCH"
      - name: Preserve the complete publication package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nbo-r38-publication-${{ github.run_id }}
          path: |
            ECTA_R38.tex
            ECTA_R38.pdf
            SUPP_R38.tex
            SUPP_R38.pdf
            RESPONSE_R38.tex
            RESPONSE_R38.pdf
            COMPUTATION_R38.tex
            COMPUTATION_R38.pdf
            HISTORY_R38.tex
            HISTORY_R38.pdf
            R38_REVIEW.md
            REVISION_INDEX.md
            revisions/2026-09-24-r38/
          retention-days: 30
          if-no-files-found: error
