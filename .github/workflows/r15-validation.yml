name: R15 reproducible revision validation
on:
  push:
    branches:
      - revision/econometrica-r15-boundary-consistent-neural-2026-09-22
    paths:
      - .github/workflows/r15-validation.yml
      - revisions/2026-09-22-r15/**
      - ECTA_R15.tex
      - SUPP_R15.tex
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve MPFR development interface
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libmpfr-dev
          mkdir /tmp/r15-tools
          cp /usr/include/mpfr.h /tmp/r15-tools/
          dpkg-query -W libmpfr-dev libmpfr6 libgmp10 > /tmp/r15-tools/package_versions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r15-mpfr-interface
          path: /tmp/r15-tools/
          retention-days: 7
