name: R39 source capsule
on:
  push:
    branches: ['revision/econometrica-r39-common-continuation-2026-09-25']
    paths: ['.github/workflows/r39-source.yml']
permissions:
  contents: read
jobs:
  capsule:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r39-source-capsule
          path: |
            econsocart.cls
            *.sty
            *.bst
            reviews/2026-09-25-econometrica-r38/
            reviews/2026-09-24-econometrica-r36/
            revisions/2026-09-24-r38/history/references_R34.tex
          retention-days: 30
          if-no-files-found: error
