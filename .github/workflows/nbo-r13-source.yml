name: NBO R13 pinned source snapshot
on:
  push:
    branches: [revision/econometrica-nbo-r13-2026-10-04]
    paths: [.github/workflows/nbo-r13-source.yml]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive complete text source and small reproducibility inputs
        run: |
          mkdir -p /tmp/nbo-r13-snapshot
          python - <<'PY'
          import subprocess,tarfile,pathlib,json,hashlib
          keep={'.tex','.py','.json','.bib','.bst','.cls','.cfg','.md','.yml','.yaml','.csv','.txt','.pt','.bbl','.aux'}
          files=[pathlib.Path(p) for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p]
          included=[p for p in files if p.suffix.lower() in keep and p.stat().st_size<20_000_000]
          root=pathlib.Path('/tmp/nbo-r13-snapshot')
          with tarfile.open(root/'source.tar.gz','w:gz') as tar:
              for p in included: tar.add(p,arcname=str(p))
          (root/'INCLUDED.json').write_text(json.dumps({str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in included},indent=2))
          (root/'EXCLUDED.json').write_text(json.dumps([str(p) for p in files if p not in included],indent=2))
          PY
          git rev-parse HEAD > /tmp/nbo-r13-snapshot/SOURCE_COMMIT.txt
          cd /tmp/nbo-r13-snapshot && sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r13-source-${{ github.run_id }}
          path: /tmp/nbo-r13-snapshot/
          retention-days: 90
          if-no-files-found: error
