name: NBO R24 symmetric refinement analysis
on:
  push:
    branches: ['revision/econometrica-nbo-r24-source-2026-10-05']
    paths: ['.github/workflows/nbo-r24-analysis.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      R: revisions/2026-10-05-r24
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /revisions/2026-10-05-r23/
            /revisions/2026-10-05-r24/
            /.github/workflows/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical test dependencies
        run: python -m pip install numpy==2.3.5 mpmath==1.3.0
      - name: Record source identity and run every new test
        run: |
          mkdir -p "$R/results"
          git rev-parse HEAD > "$R/results/ANALYSIS_SOURCE_COMMIT.txt"
          python - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          r=Path(os.environ['R'])
          files={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted((r/'code').glob('*.py'))}
          (r/'results/ANALYSIS_SOURCE_SHA256.json').write_text(json.dumps(files,indent=2)+'\n')
          sys.path.insert(0,str(r/'code'))
          import unittest
          suite=unittest.defaultTestLoader.discover(str(r/'code'),pattern='test_*.py')
          with (r/'results/TESTS_R24.log').open('w') as log:
              result=unittest.TextTestRunner(stream=log,verbosity=2).run(suite)
          print((r/'results/TESTS_R24.log').read_text())
          record={'tests':result.testsRun,'failures':len(result.failures),'errors':len(result.errors),'skipped':len(result.skipped),'successful':result.wasSuccessful()}
          (r/'results/TESTS_R24.json').write_text(json.dumps(record,indent=2)+'\n')
          assert result.wasSuccessful() and not result.skipped,record
          PY
      - name: Replay every original candidate with the same economic target
        run: python "$R/code/analyze.py" > "$R/results/ANALYSIS.log" 2>&1
      - name: Commit immutable analysis on a new evidence branch
        run: |
          branch=revision/econometrica-nbo-r24-evidence-2026-10-05
          test -z "$(git ls-remote --heads origin "$branch")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$R/results"
          git commit -m 'R24: record all-candidate residual-energy replay and independent tests'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > /tmp/R24_EVIDENCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r24-refinement-analysis
          path: |
            revisions/2026-10-05-r24/results/
            /tmp/R24_EVIDENCE_COMMIT.txt
          retention-days: 90
