name: NBO R16 prospective paired replication

on:
  push:
    branches:
      - revision/econometrica-nbo-r16-replication-source-2026-10-04

permissions:
  contents: read
  actions: read

concurrency:
  group: nbo-r16-replication-${{ github.sha }}
  cancel-in-progress: false

env:
  NBO_R16_REPLICATION_SOURCE_COMMIT: ${{ github.sha }}
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMBA_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.pack.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the fixed numerical environment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          python -m pip install numpy==2.3.5 scipy==1.17.0 numba==0.65.1 mpmath==1.3.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Audit candidate identities, independent bank domains and frozen mathematics
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s revisions/2026-10-04-r16/code -p replication_tests.py -v
          python revisions/2026-10-04-r15/code/paired_transfer_checks.py --out "$RUNNER_TEMP/r16-frozen-paired-checks.json"
          python revisions/2026-10-04-r16/code/independent_paired_audit.py --out "$RUNNER_TEMP/r16-independent-paired-formulas.json"
          python revisions/2026-10-04-r16/code/replication_report.py --repo . --constants-only --out "$RUNNER_TEMP/r16-fixed-constants.json"
      - name: Pack the committed proof, interval code, protocol and all 128 original policies
        id: pack
        run: |
          python revisions/2026-10-04-r16/code/replication_pipeline.py pack --repo . --out "$RUNNER_TEMP/r16-replication-source"
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r16-replication-source-${{ github.run_id }}
          path: ${{ runner.temp }}/r16-replication-source/
          if-no-files-found: error
          retention-days: 90

  trial:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nbo-r16-replication-source-${{ github.run_id }}
          path: source
      - name: Install the exact CPU environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5 scipy==1.17.0 numba==0.65.1 mpmath==1.3.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Execute four frozen policies on the new prespecified bank
        run: |
          python source/replication_pipeline.py run-trial --bundle source \
            --workspace "$RUNNER_TEMP/r16-replication-worker" \
            --out "trial-${{ matrix.trial_id }}" --trial-id '${{ matrix.trial_id }}'
      - name: Retain every raw outcome, identity and complete work record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nbo-r16-replication-trial-${{ matrix.trial_id }}-${{ github.run_id }}
          path: trial-${{ matrix.trial_id }}/
          if-no-files-found: warn
          retention-days: 90

  evidence:
    needs: [source, trial]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the exact independent reporting environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5 scipy==1.17.0 numba==0.65.1 mpmath==1.3.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: nbo-r16-replication-source-${{ github.run_id }}
          path: ${{ runner.temp }}/replication-source
      - uses: actions/download-artifact@v4
        with:
          pattern: nbo-r16-replication-trial-*-${{ github.run_id }}
          path: ${{ runner.temp }}/replication-trials
      - name: Reconstruct all 238 endpoints with the prospectively fixed paired account
        run: |
          python revisions/2026-10-04-r16/code/replication_pipeline.py collect --repo . \
            --bundle "$RUNNER_TEMP/replication-source" --input-dir "$RUNNER_TEMP/replication-trials"
      - name: Retain the bounded aggregate, manifests and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nbo-r16-replication-summary-${{ github.run_id }}
          path: revisions/2026-10-04-r16/results/replication_summary/
          if-no-files-found: warn
          retention-days: 90
      - name: Create the complete evidence branch without changing its numerical source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$NBO_R16_REPLICATION_SOURCE_COMMIT"
          source_branch=revision/econometrica-nbo-r16-replication-source-2026-10-04
          evidence_branch=revision/econometrica-nbo-r16-replication-evidence-2026-10-04
          remote_source=$(git ls-remote --heads origin "refs/heads/$source_branch" | cut -f1)
          test "$remote_source" = "$NBO_R16_REPLICATION_SOURCE_COMMIT"
          existing=$(git ls-remote --heads origin "refs/heads/$evidence_branch")
          test -z "$existing"
          git diff --exit-code "$NBO_R16_REPLICATION_SOURCE_COMMIT" --
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- revisions/2026-10-04-r16/results/replication revisions/2026-10-04-r16/results/replication_summary
          git commit --quiet -m 'revision(r16): preserve independent prospective paired replication of all 128 original policies'
          git push --atomic --force-with-lease="refs/heads/$evidence_branch:" origin "HEAD:refs/heads/$evidence_branch"
          evidence_commit=$(git rev-parse HEAD)
          echo "R16 prospective replication source: $NBO_R16_REPLICATION_SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "R16 complete independent replication evidence: $evidence_commit" >> "$GITHUB_STEP_SUMMARY"
          echo 'All original policies, fresh banks and outcomes are retained. No original fitting or stopping record is rewritten.' >> "$GITHUB_STEP_SUMMARY"
