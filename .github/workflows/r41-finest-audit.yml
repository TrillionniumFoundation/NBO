name: R41 finest nonlinear arithmetic audit
on:
  push:
    branches: [revision/econometrica-r41-structural-certification-2026-09-25]
    paths: [.github/workflows/r41-finest-audit.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy==2.3.5 sympy==1.14.0
      - name: Replay every inequality and the feasible upper policy at T32 N256
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          mkdir -p /tmp/r41-audit
          python -u - <<'PY' | tee /tmp/r41-audit/replay.log
          from pathlib import Path
          import importlib.util,sys,json,hashlib,time,subprocess
          old=Path('revisions/2026-09-25-r39')
          p=old/'replication/verify_nonlinear.py'
          spec=importlib.util.spec_from_file_location('r41_independent_inherited',p)
          v=importlib.util.module_from_spec(spec);sys.modules[spec.name]=v;spec.loader.exec_module(v)
          data=json.loads((old/'results/nonlinear_support.json').read_text())['outcomes']
          r=next(r for r in data if r['mesh']==256 and r['T']==32)
          start=time.perf_counter();out=v.verify(r)
          assert out['passed']
          report={'schema':'NBO-R41-finest-replay-v1','source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'verifier_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'proof_file':r['proof_file'],'proof_sha256':r['proof_sha256'],'outcome':out,'passed':True,'seconds':time.perf_counter()-start,'coverage':'Complete retained T=32,N=256,epsilon=1/2 lower and feasible upper object; not a new optimum or a tighter-tolerance policy.','python':sys.version}
          Path('/tmp/r41-audit/finest_nonlinear.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r41-finest-audit
          path: /tmp/r41-audit
          retention-days: 30
          if-no-files-found: error
