name: NBO R84 complete original-paper revision
on:
  push:
    branches: [revision/econometrica-nbo-r84-referee-revision-2026-10-12]
    paths: [.github/workflows/nbo-r84-publication.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nbo-r84-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 110
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_DATE_EPOCH: '1791763200'
      FORCE_SOURCE_DATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /revisions/2026-10-10-r62/
            /revisions/2026-10-10-r63/
            /revisions/2026-10-10-r64/
            /revisions/2026-10-10-r65/
            /revisions/2026-10-10-r66/
            /revisions/2026-10-10-r67/
            /revisions/2026-10-11-r69/
            /revisions/2026-10-11-r70/
            /revisions/2026-10-11-r72/
            /revisions/2026-10-11-r73/
            /revisions/2026-10-11-r77/
            /revisions/2026-10-11-r78/
            /revisions/2026-10-12-r80/
            /revisions/2026-10-12-r81/
            /revisions/2026-10-12-r82/
            /revisions/2026-10-12-r83/
            /revisions/2026-10-12-r84/
            /README.md
      - name: Install full numerical and Econometrica publication dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-numpy python3-scipy python3-sklearn pandoc poppler-utils texlive-latex-extra texlive-fonts-recommended texlive-science
      - name: Integrate pinned verified science and commit complete ordinary manuscript
        run: |
          git config user.name 'NBO revision verification'
          git config user.email 'nbo-revision@users.noreply.github.com'
          git fetch --depth=100 origin 9e92417a50129e3abff51f9167ed83466866cb1e
          git merge --no-edit 9e92417a50129e3abff51f9167ed83466866cb1e
          /usr/bin/python3 revisions/2026-10-12-r84/code/prepare84.py science
          /usr/bin/python3 revisions/2026-10-12-r84/code/prepare84.py editorial
          git add -A -f revisions/2026-10-12-r84
          if ! git diff --cached --quiet; then
            git commit -m 'R84: retain complete ordinary original-paper manuscript, full new proof and point-by-point response'
          fi
          git push --atomic origin HEAD:refs/heads/revision/econometrica-nbo-r84-referee-revision-2026-10-12 HEAD:refs/heads/revision/econometrica-nbo-r84-source-2026-10-12
      - name: Render current documents for separately qualified inspection
        run: |
          /usr/bin/python3 revisions/2026-10-12-r84/code/build84.py --render
          git add -A -f revisions/2026-10-12-r84
          git commit -m 'R84: retain rendered current manuscript; full verification and visual status remain explicit'
          git push --atomic origin HEAD:refs/heads/revision/econometrica-nbo-r84-referee-revision-2026-10-12 HEAD:refs/heads/revision/econometrica-nbo-r84-source-2026-10-12 HEAD:refs/heads/revision/econometrica-nbo-r84-rendered-2026-10-12
      - name: Full inherited and new unskipped tests and independent verification
        run: /usr/bin/python3 revisions/2026-10-12-r84/code/build84.py
      - name: Full clean archive reproduction and verified remote candidate publication
        run: /usr/bin/python3 revisions/2026-10-12-r84/code/publish84.py
      - name: Preserve current PDFs and all diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nbo-r84-paper-and-audits
          path: |
            revisions/2026-10-12-r84/build/*.pdf
            revisions/2026-10-12-r84/build/*.txt
            revisions/2026-10-12-r84/audit/*84*
            revisions/2026-10-12-r84/audit/build-logs/
            revisions/2026-10-12-r84/ECTA.tex
            revisions/2026-10-12-r84/supp.tex
            revisions/2026-10-12-r84/appendix.tex
            revisions/2026-10-12-r84/response.md
            revisions/2026-10-12-r84/sections/*84.tex
            revisions/2026-10-12-r84/tables/*84.tex
          compression-level: 1
          retention-days: 30
