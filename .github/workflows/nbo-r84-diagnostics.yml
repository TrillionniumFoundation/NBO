name: NBO R84 source-bound failure diagnostics
on:
  push:
    branches: [revision/econometrica-nbo-r84-referee-revision-2026-10-12]
    paths: [.github/workflows/nbo-r84-diagnostics.yml]
permissions:
  contents: write
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /revisions/2026-10-12-r84/audit/
      - name: Read retained appendix typography diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,pathlib,re,urllib.request,urllib.parse,zipfile
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  result=super().redirect_request(req,fp,code,msg,headers,newurl)
                  if urllib.parse.urlparse(req.full_url).netloc!=urllib.parse.urlparse(newurl).netloc:result.remove_header('Authorization')
                  return result
          opener=urllib.request.build_opener(SafeRedirect())
          req=urllib.request.Request('https://api.github.com/repos/TrillionniumFoundation/NBO/actions/artifacts/11734366500/zip',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with opener.open(req,timeout=45) as r:raw=r.read()
          z=zipfile.ZipFile(io.BytesIO(raw))
          names=[n for n in z.namelist() if n.endswith('appendix-R84-pass4.log')]
          if len(names)!=1:raise AssertionError(names)
          text=z.read(names[0]).decode('utf-8',errors='replace')
          excerpts=[text[max(0,m.start()-220):m.start()+900] for m in re.finditer('Overfull',text)]
          folder=pathlib.Path('revisions/2026-10-12-r84/audit');folder.mkdir(parents=True,exist_ok=True)
          (folder/'TYPOGRAPHY_FAILURE84.txt').write_text('\n\n====\n\n'.join(excerpts))
          (folder/'TYPOGRAPHY_FAILURE84.json').write_text(json.dumps({'artifact_id':11734366500,'archive_sha256':hashlib.sha256(raw).hexdigest(),'log':names[0],'overfull_count':len(excerpts),'scope':'Actual final-pass appendix diagnostics; scientific records unchanged.'},indent=2)+'\n')
          print((folder/'TYPOGRAPHY_FAILURE84.txt').read_text(),flush=True)
          PY
      - name: Preserve diagnostics on a dedicated new revision branch
        run: |
          git config user.name 'NBO revision verification'
          git config user.email 'nbo-revision@users.noreply.github.com'
          git add -f revisions/2026-10-12-r84/audit/TYPOGRAPHY_FAILURE84.*
          git commit -m 'R84: retain actual appendix overflow contexts and artifact identity'
          git push origin HEAD:refs/heads/revision/econometrica-nbo-r84-typography-diagnostics-2026-10-12
