name: NBO R84 source-bound failure diagnostics
on:
  push:
    branches: [revision/econometrica-nbo-r84-referee-revision-2026-10-12]
    paths: [.github/workflows/nbo-r84-diagnostics.yml]
permissions:
  contents: write
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /revisions/2026-10-12-r84/audit/
      - name: Extract actual failure block from retained workflow logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,urllib.request,urllib.parse
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  result=super().redirect_request(req,fp,code,msg,headers,newurl)
                  if urllib.parse.urlparse(req.full_url).netloc!=urllib.parse.urlparse(newurl).netloc:
                      result.remove_header('Authorization')
                  return result
          opener=urllib.request.build_opener(SafeRedirect())
          req=urllib.request.Request('https://api.github.com/repos/TrillionniumFoundation/NBO/actions/jobs/114722283049/logs',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with opener.open(req,timeout=45) as r:raw=r.read()
          text=raw.decode('utf-8-sig',errors='replace')
          last=text.rfind('Traceback (most recent call last)')
          if last<0:last=max(0,len(text)-16000)
          end=text.find('##[error]Process completed',last)
          selected=text[last:end+200 if end>=0 else None]
          folder=pathlib.Path('revisions/2026-10-12-r84/audit');folder.mkdir(parents=True,exist_ok=True)
          (folder/'PUBLICATION_FAILURE84.txt').write_text(selected)
          (folder/'PUBLICATION_FAILURE84.json').write_text(json.dumps({'job_id':114722283049,'run_id':38222616572,'full_log_sha256':hashlib.sha256(raw).hexdigest(),'scope':'Actual retained traceback through process error; not an inferred diagnosis.'},indent=2)+'\n')
          print(selected,flush=True)
          PY
      - name: Preserve concise diagnostics on the new revision only
        run: |
          git config user.name 'NBO revision verification'
          git config user.email 'nbo-revision@users.noreply.github.com'
          git add -f revisions/2026-10-12-r84/audit/PUBLICATION_FAILURE84.*
          git commit -m 'R84: retain actual failed publication traceback and source-job identity'
          git push origin HEAD:refs/heads/revision/econometrica-nbo-r84-referee-revision-2026-10-12
