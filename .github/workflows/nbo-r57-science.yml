name: NBO R57 prospective action-search study
on:
  push:
    branches: [revision/econometrica-nbo-r57-referee-revision-2026-10-09]
    paths: [.github/workflows/nbo-r57-science.yml]
permissions:
  contents: write
concurrency:
  group: nbo-r57-science
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  freeze:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.freeze.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: /revisions/2026-10-09-r57/
          sparse-checkout-cone-mode: false
      - name: Install scientific dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-numpy python3-scipy python3-sympy python3-sklearn
      - name: Test and freeze before production
        id: freeze
        run: |
          /usr/bin/python3 revisions/2026-10-09-r57/code/tests57.py
          /usr/bin/python3 revisions/2026-10-09-r57/code/study57.py --freeze
          git config user.name 'NBO scientific revision'
          git config user.email 'nbo-revision@users.noreply.github.com'
          git add -f revisions/2026-10-09-r57/audit/SOURCE_FREEZE57.json
          git commit -m 'R57: freeze prospective action-search source before every production service'
          git push origin HEAD:refs/heads/revision/econometrica-nbo-r57-science-2026-10-09
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  services:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        task: [{d: 2, T: 2}, {d: 4, T: 4}, {d: 8, T: 6}]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.freeze.outputs.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: /revisions/2026-10-09-r57/
          sparse-checkout-cone-mode: false
      - name: Install scientific dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-numpy python3-scipy python3-sympy python3-sklearn
      - name: Execute frozen task cohort
        run: /usr/bin/python3 revisions/2026-10-09-r57/code/study57.py --d ${{ matrix.task.d }} --T ${{ matrix.task.T }}
      - name: Preserve all results including failed attempts
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('revisions/2026-10-09-r57')
          with zipfile.ZipFile('r57-d${{ matrix.task.d }}.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in (root/'results57').rglob('*'):
                  if p.is_file(): z.write(p,str(p.relative_to(root)))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r57-science-d${{ matrix.task.d }}
          path: r57-d${{ matrix.task.d }}.zip
          retention-days: 30
          compression-level: 0
  retain:
    if: always() && needs.freeze.result == 'success'
    needs: [freeze, services]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.freeze.outputs.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: /revisions/2026-10-09-r57/
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: nbo-r57-science-d*
          path: downloaded
          merge-multiple: true
      - name: Preserve cohort and process identities in a new execution branch
        run: |
          python3 - <<'PY'
          import json,os,zipfile
          from pathlib import Path
          root=Path('revisions/2026-10-09-r57')
          for p in Path('downloaded').glob('*.zip'):
              with zipfile.ZipFile(p) as z:z.extractall(root)
          status='${{ needs.services.result }}'
          out=dict(status=status,source_commit='${{ needs.freeze.outputs.sha }}',workflow_run=os.environ['GITHUB_RUN_ID'],expected_services=90,service_records=len(list((root/'results57/services').glob('*/service.json'))),paired_sets=len(list((root/'results57/paired').glob('*/paired.json'))))
          (root/'audit/EXECUTION57.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out))
          PY
          git config user.name 'NBO scientific revision'
          git config user.email 'nbo-revision@users.noreply.github.com'
          git add -f revisions/2026-10-09-r57/results57 revisions/2026-10-09-r57/audit/EXECUTION57.json
          git commit -m 'R57: retain complete prospective action-search cohort and independent cost contrasts'
          git push origin HEAD:refs/heads/revision/econometrica-nbo-r57-science-executed-2026-10-09
