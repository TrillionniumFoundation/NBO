name: NBO R25 native Econometrica publication
on:
  push:
    branches: [revision/econometrica-nbo-r25-2026-10-05]
    paths: [.github/workflows/nbo-r25-publication.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific and native publication dependencies
        run: |
          python -m pip install numpy==2.3.5 mpmath==1.3.0
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-science latexmk poppler-utils
      - name: Pin and restore the complete frozen execution
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 00f834b2d0ad259a0ffc70868dce416d183002ba
          ok=0
          for attempt in $(seq 1 30); do
            if git fetch --no-tags --depth=1 origin refs/heads/revision/econometrica-nbo-r25-execution-2026-10-05; then
              ok=1
              break
            fi
            sleep 20
          done
          test "$ok" = 1
          evidence=$(git rev-parse FETCH_HEAD)
          git restore --source="$evidence" --worktree -- revisions/2026-10-05-r25/results
          EVIDENCE_SHA="$evidence" python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          r=Path('revisions/2026-10-05-r25')
          identity=json.loads((r/'results/EXECUTION_IDENTITY.json').read_text())
          assert identity['frozen_source_commit']=='9bf608d5154dfb61ff0ab209c2b66d1f8dbcc148'
          assert str(identity['run_id'])=='37339128420'
          freeze=json.loads((r/'protocols/FREEZE.json').read_text())
          for p,h in freeze['files'].items():assert hashlib.sha256((r/p).read_bytes()).hexdigest()==h,p
          (r/'results/PUBLICATION_INPUTS.json').write_text(json.dumps({'publication_source_commit':os.environ['GITHUB_SHA'],'execution_commit':os.environ['EVIDENCE_SHA'],'execution_run':37339128420,'review_commit':'281e57b18a2d88de68d2219da1a7194e90570d13','inherited_commit':'00f834b2d0ad259a0ffc70868dce416d183002ba','selection':'Complete source-bound remote execution selected before its outcomes; local clocks retained separately, never mixed.'},indent=2)+'\n')
          PY
      - name: Independently verify frozen candidates and assemble full manuscripts
        run: |
          set -o pipefail
          python revisions/2026-10-05-r25/code/audit.py 2>&1 | tee revisions/2026-10-05-r25/results/AUDIT_RUN.log
          python revisions/2026-10-05-r25/code/assemble.py 2>&1 | tee revisions/2026-10-05-r25/results/ASSEMBLY_RUN.log
      - name: Run every test and build all five native manuscripts
        run: |
          set -o pipefail
          python revisions/2026-10-05-r25/code/build.py 2>&1 | tee revisions/2026-10-05-r25/results/BUILD_RUN.log
      - name: Commit only R25 publication and create the reviewer branch
        run: |
          set -euo pipefail
          git config user.name 'NBO revision validation'
          git config user.email 'actions@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          r=Path('revisions/2026-10-05-r25')
          manifest=json.loads((r/'PUBLICATION_FILES_SHA256.json').read_text())
          for p,h in manifest.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          assert all(x['returncode']==0 and x['skipped']==0 for x in json.loads((r/'results/TESTS_ALL.json').read_text()))
          files=[]
          for p in r.rglob('*'):
              if not p.is_file() or '__pycache__' in str(p) or '/previews/' in str(p):continue
              if '/build/' in str(p) and p.suffix not in ('.pdf','.log'):continue
              if p.suffix not in ('.tex','.bib','.py','.json','.jsonl','.md','.txt','.log','.npz','.pdf'):continue
              files.append(str(p))
          subprocess.run(['git','add','-f','--',*files],check=True)
          changes=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert changes and all(p.startswith(str(r)+'/') for p in changes),changes
          PY
          git commit -m 'R25: complete native paper, supplement, applications, prior evidence and referee response with full validation'
          git push --atomic origin HEAD:refs/heads/revision/econometrica-nbo-r25-2026-10-05 HEAD:refs/heads/revision/econometrica-nbo-r25-referee-2026-10-05
          git rev-parse HEAD > R25_PUBLICATION_COMMIT.txt
          cp /tmp/NBO_R25_publication.zip NBO_R25_publication.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r25-native-publication
          path: |
            NBO_R25_publication.zip
            R25_PUBLICATION_COMMIT.txt
            revisions/2026-10-05-r25/build/*.pdf
            revisions/2026-10-05-r25/build/*.log
            revisions/2026-10-05-r25/results/*.json
            revisions/2026-10-05-r25/results/*.log
            revisions/2026-10-05-r25/results/previews
            revisions/2026-10-05-r25/RELEASE_AUDIT.json
            revisions/2026-10-05-r25/PRESERVATION.json
            revisions/2026-10-05-r25/PUBLICATION_FILES_SHA256.json
          retention-days: 90
