name: NBO R57 pinned source snapshot
on:
  push:
    branches: [revision/econometrica-nbo-r57-referee-revision-2026-10-09]
    paths: [.github/workflows/nbo-r57-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /revisions/2026-10-09-r56/
            /reviews/2026-10-09-econometrica-numerical-methods-r54/
          sparse-checkout-cone-mode: false
      - name: Archive sources, fitted models and records without duplicated historical ZIPs
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          root=pathlib.Path('revisions/2026-10-09-r56')
          with zipfile.ZipFile('r56-working-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if not p.is_file() or '__pycache__' in p.parts: continue
                  rel=p.relative_to(root)
                  if rel.parts[0] in ('build','evidence'): continue
                  if p.suffix.lower() in ('.ttf','.otf','.woff','.woff2','.pfb','.pfa','.afm','.tfm'): continue
                  z.write(p,str(rel))
          print(pathlib.Path('r56-working-source.zip').stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r57-pinned-r56-working-source
          path: r56-working-source.zip
          retention-days: 7
          compression-level: 0
