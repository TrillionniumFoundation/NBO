name: R8 pinned external source
on:
  push:
    branches: [revision/econometrica-r8-verified-manuscript-2026-09-22]
    paths: [.github/workflows/r8-external-source.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sx-fang/MartNet
          ref: 991ea8dde5bad6ba912eb8cc48b0cb48dbdd6c2a
          persist-credentials: false
      - name: Source identity
        run: git rev-parse HEAD > AUTHOR_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: martnet-author-source-991ea8d
          path: |
            code/SOCMartNet-v3-refactored
            LICENSE
            README.md
            AUTHOR_COMMIT.txt
          retention-days: 7
