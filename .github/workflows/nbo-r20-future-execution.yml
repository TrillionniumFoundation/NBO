name: NBO R20 frozen future-change execution
on:
  push:
    branches: [revision/econometrica-nbo-r20-2026-10-05]
    paths: [.github/workflows/nbo-r20-future-execution.yml]
permissions:
  contents: write
concurrency:
  group: nbo-r20-future-execution
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      R: revisions/2026-10-05-r20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            *.tex
            *.bib
            *.cls
            *.cfg
            *.bst
            *.sty
            *.aux
            *.bbl
            /revisions/2026-10-05-r19-integrated/code/
            /revisions/2026-10-05-r19-integrated/protocols/
            /revisions/2026-10-05-r20/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numerical dependencies matching the inherited study
        run: |
          python -m pip install numpy==2.3.5 mpmath==1.3.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Execute the frozen complete future-change family
        run: |
          set -o pipefail
          mkdir -p "$R/results"
          python -u "$R/code/future_study.py" 2>&1 | tee "$R/results/EXECUTION.log"
      - name: Bind and commit complete evidence on the new revision only
        run: |
          set -euo pipefail
          BRANCH=revision/econometrica-nbo-r20-2026-10-05
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'NBO revision verification'
          git config user.email 'nbo-revision@users.noreply.github.com'
          git add -- "$R/results"
          git commit -m 'evidence(r20): retain every changed-future service, check, risk and economic certificate'
          git push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD > "$R/results/PUBLISHED_EVIDENCE_COMMIT.txt"
      - name: Package checked-out manuscript dependencies and complete evidence
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          out=Path('/tmp/nbo-r20-execution');out.mkdir(exist_ok=True)
          allowed={'.tex','.bib','.cls','.cfg','.bst','.sty','.aux','.bbl','.py','.json','.log','.txt','.md'}
          with zipfile.ZipFile(out/'SOURCE_AND_EVIDENCE.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              for p in Path('.').rglob('*'):
                  if p.is_file() and p.suffix in allowed and '.git' not in p.parts and '__pycache__' not in p.parts:
                      z.write(p,p.as_posix())
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r20-future-execution
          path: /tmp/nbo-r20-execution/
          if-no-files-found: error
          retention-days: 30
