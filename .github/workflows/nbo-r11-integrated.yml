name: NBO R11 policy-specific revision and independent evidence
on:
  push:
    branches: [revision/econometrica-nbo-r11-source-2026-10-04]
    paths: [revisions/2026-10-04-r11/RUN.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nbo-r11-integrated
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
jobs:
  source:
    if: github.ref == 'refs/heads/revision/econometrica-nbo-r11-source-2026-10-04'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.materialize.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Verify and materialize the complete source
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          python revisions/2026-10-04-r11/unpack.py
          python revisions/2026-10-04-r11/code/integrate.py
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          r=Path('revisions/2026-10-04-r11')
          paths=[p for p in r.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.name!='SOURCE_MANIFEST.json']
          paths += [Path('ECTA.tex'),Path('supp.tex'),Path('revision_reference.bib'),Path('.github/workflows/nbo-r11-integrated.yml')]
          record={'transport_commit':os.environ['GITHUB_SHA'],'review_commit':'3ad498fa0647533da210f248fb6b1ebd27cffca5','files':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(paths)}}
          (r/'SOURCE_MANIFEST.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ECTA.tex supp.tex revision_reference.bib revisions/2026-10-04-r11
          git commit -m 'revision(r11): materialized policy-specific NBO source and complete editorial integration [skip ci]'
          git push origin HEAD:revision/econometrica-nbo-r11-source-2026-10-04
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Materialized source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
  study:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ['11','29','47','71','89','107','131','149','167','191','greedy']
    env:
      NBO_SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Install pinned numerical environment
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 scipy==1.17.0 numba==0.65.1 mpmath==1.3.0
      - name: Execute the fixed independent shard
        shell: bash
        run: |
          set -euo pipefail
          shard='${{ matrix.shard }}'
          if [ "$shard" = greedy ]; then folder=greedy; else folder="seed_$shard"; fi
          out="revisions/2026-10-04-r11/results/$folder"
          mkdir -p "$out"
          python -m pip freeze > "$out/environment.txt"
          lscpu > "$out/cpu.txt"
          if [ "$shard" = greedy ]; then
            python -u revisions/2026-10-04-r11/code/run_greedy.py 2>&1 | tee "$out/driver.log"
          else
            python -u revisions/2026-10-04-r11/code/run_study.py --seed "$shard" 2>&1 | tee "$out/driver.log"
          fi
      - name: Retain all candidate records and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r11-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: revisions/2026-10-04-r11/results/
  evidence:
    needs: [source, study]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NBO_SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - uses: actions/download-artifact@v4
        with:
          pattern: r11-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          merge-multiple: true
          path: revisions/2026-10-04-r11/results/
      - name: Install verification and journal dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 scipy==1.17.0 numba==0.65.1 mpmath==1.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-latex-extra texlive-fonts-recommended texlive-science cm-super poppler-utils
          git fetch --depth=1 origin 3ad498fa0647533da210f248fb6b1ebd27cffca5
      - name: Recompute evidence, replay regressions, and compile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p revisions/2026-10-04-r11/logs /tmp/nbo-r11-candidate
          python -m pip freeze > revisions/2026-10-04-r11/logs/environment.txt
          python -u revisions/2026-10-04-r11/code/test_r11.py 2>&1 | tee revisions/2026-10-04-r11/logs/new_tests.log
          python -u revisions/2026-10-04-r11/code/replay_inherited.py 2>&1 | tee revisions/2026-10-04-r11/logs/inherited_tests.log
          python -u revisions/2026-10-04-r11/code/report.py 2>&1 | tee revisions/2026-10-04-r11/logs/report.log
          python -u revisions/2026-10-04-r11/code/build.py 2>&1 | tee revisions/2026-10-04-r11/logs/build.log
          python -u revisions/2026-10-04-r11/code/finalize.py
      - name: Commit and publish evidence and referee copies atomically
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NBO_SOURCE_COMMIT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find revisions/2026-10-04-r11 -type d -name __pycache__ -prune -exec rm -rf '{}' +
          git add revisions/2026-10-04-r11
          git commit -m 'revision(r11): policy-specific guarantees, ten-seed comparisons and complete referee evidence [skip ci]'
          evidence=revision/econometrica-nbo-r11-evidence-2026-10-04
          referee=revision/econometrica-nbo-r11-referee-2026-10-04
          test -z "$(git ls-remote --heads origin "$evidence")"
          test -z "$(git ls-remote --heads origin "$referee")"
          git push --atomic origin HEAD:"$evidence" HEAD:"$referee"
          git rev-parse HEAD > /tmp/nbo-r11-candidate/EVIDENCE_COMMIT.txt
          printf '%s\n' "$NBO_SOURCE_COMMIT" > /tmp/nbo-r11-candidate/SOURCE_COMMIT.txt
          git archive --format=tar.gz --output=/tmp/nbo-r11-candidate/source.tar.gz HEAD
          cp revisions/2026-10-04-r11/build/{ECTA,supp,response}.pdf /tmp/nbo-r11-candidate/
          cp revisions/2026-10-04-r11/{REMOTE_EXECUTION.json,EVIDENCE_MANIFEST.json,SOURCE_MANIFEST.json,TABLE_MANIFEST.json,EDITORIAL_MAP.json,PROTOCOL.json,README.md} /tmp/nbo-r11-candidate/
          cp revisions/2026-10-04-r11/results/{AUDIT.json,PRIMARY.csv} /tmp/nbo-r11-candidate/
          (cd /tmp/nbo-r11-candidate && sha256sum source.tar.gz ECTA.pdf supp.pdf response.pdf > SHA256SUMS)
          echo "Source: $NBO_SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "Evidence and referee: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain compiled files and verification failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nbo-r11-complete-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            /tmp/nbo-r11-candidate/
            revisions/2026-10-04-r11/logs/
            revisions/2026-10-04-r11/build/
            revisions/2026-10-04-r11/results/AUDIT.json
            revisions/2026-10-04-r11/REMOTE_EXECUTION.json
