name: R14 exact patch materialization

on:
  push:
    branches:
      - revision/econometrica-r14-independent-state-audit-2026-09-22

permissions:
  contents: write

concurrency:
  group: r14-exact-materialization
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[r14-materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruct, validate, and stage R14
        shell: bash
        run: |
          set -euo pipefail
          cat .r14-bootstrap/patch.part-* > /tmp/NBO_R14.corrupt.patch
          test "$(wc -l < /tmp/NBO_R14.corrupt.patch)" -eq 76938

          python - <<'PY'
          from pathlib import Path
          src=Path('/tmp/NBO_R14.corrupt.patch').read_bytes()
          parts=src.split(b'diff --git ')
          drop={
            b'revisions/2026-09-22-r14/build_logs/ECTA_R14_text.txt',
            b'revisions/2026-09-22-r14/build_logs/SUPP_R14_text.txt',
          }
          out=[parts[0]]; removed=[]
          for sec in parts[1:]:
              head=sec.split(b'\n',1)[0]
              if any(p in head for p in drop):
                  removed.append(head.decode('utf-8','replace')); continue
              out.append(b'diff --git '+sec)
          if len(removed)!=2:
              raise SystemExit(f'expected 2 derived-text sections, removed {len(removed)}: {removed}')
          Path('/tmp/NBO_R14.filtered.patch').write_bytes(b''.join(out))
          print('removed derived log sections:', *removed, sep='\n')
          PY

          git apply --check --binary /tmp/NBO_R14.filtered.patch
          git apply --binary --index /tmp/NBO_R14.filtered.patch

          command -v pdftotext >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; }
          mkdir -p revisions/2026-09-22-r14/build_logs
          pdftotext -raw ECTA_R14.pdf revisions/2026-09-22-r14/build_logs/ECTA_R14_text.txt
          pdftotext -raw SUPP_R14.pdf revisions/2026-09-22-r14/build_logs/SUPP_R14_text.txt

          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          manifest=Path('revisions/2026-09-22-r14/canonical_manifest.json')
          data=json.loads(manifest.read_text())
          for rel in [
              'revisions/2026-09-22-r14/build_logs/ECTA_R14_text.txt',
              'revisions/2026-09-22-r14/build_logs/SUPP_R14_text.txt',
          ]:
              data['build_files_sha256'][rel]=hashlib.sha256(Path(rel).read_bytes()).hexdigest()
              print(rel, data['build_files_sha256'][rel])
          manifest.write_text(json.dumps(data,indent=2)+'\n')
          PY

          python -m pip install --quiet numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0
          python revisions/2026-09-22-r14/replication/validate_revision.py

          test -f ECTA_R14.tex
          test -f ECTA_R14.pdf
          test -f SUPP_R14.tex
          test -f SUPP_R14.pdf
          test -f revisions/2026-09-22-r14/response_to_referee.md

          rm -rf .r14-bootstrap
          rm -f .github/workflows/r14-materialize.yml
          git add -A
          git diff --cached --check

      - name: Commit referee-response tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "revision(r14): materialize Econometrica referee-response revision [r14-materialized]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
