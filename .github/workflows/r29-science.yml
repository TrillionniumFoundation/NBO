name: R29 scientific execution
on:
  push:
    branches: [revision/econometrica-r29-referee-integration-2026-09-24]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nbo-r29-science
  cancel-in-progress: false
jobs:
  science:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-r29-science]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install scientific dependencies
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 sympy==1.14.0 mpmath==1.3.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Execute fixed cohorts with reference isolation
        shell: bash
        run: |
          set -euo pipefail
          R=revisions/2026-09-24-r29
          mkdir -p "$R/results"
          git rev-parse HEAD > "$R/results/SCIENCE_SOURCE_COMMIT.txt"
          python -m pip freeze > "$R/results/python_environment.txt"
          /usr/bin/time -v -o "$R/results/controls_cli_resource.txt" python -u "$R/replication/controls.py" 2>&1 | tee "$R/results/controls_execution.log"
          python - <<'PY'
          import json,pathlib
          from fractions import Fraction as F
          r=pathlib.Path('revisions/2026-09-24-r29/results')
          rows=json.loads((r/'controls/summary.json').read_text())
          assert len(rows)==115
          variants=[v for x in rows for v in x['variants']]
          assert len(variants)==286
          assert all(F(v['bound_rational'])<=F(v['epsilon']) for v in variants)
          assert all(F(v['evaluation']['worst_regret_rational'])<=F(v['bound_rational']) for v in variants)
          (r/'SCIENCE_VALIDATION.json').write_text(json.dumps({'status':'passed','candidate_count':len(rows),'completed_variants':len(variants),'all_exact_bounds_pass':True,'original_full_domain_target_closed':False},indent=2)+'\n')
          PY
      - name: Commit frozen evidence on the isolated revision branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add revisions/2026-09-24-r29/results
          git commit -m 'results(r29): freeze 115 raw candidates and 286 independently checked completions'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          git rev-parse HEAD > /tmp/R29_EVIDENCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r29-science-${{ github.run_id }}
          path: |
            /tmp/R29_EVIDENCE_COMMIT.txt
            revisions/2026-09-24-r29/results/
          retention-days: 30
