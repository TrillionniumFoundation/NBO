name: NBO R55 signed sensitivity execution
on:
  push:
    branches: [revision/econometrica-nbo-r55-referee-revision-2026-10-09]
    paths: [.github/workflows/nbo-r55-tube.yml]
permissions:
  contents: write
concurrency:
  group: nbo-r55-tube
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  freeze:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.pin.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          filter: blob:none
          sparse-checkout: revisions/2026-10-09-r55
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-numpy python3-scipy python3-sklearn
      - id: pin
        name: Test and commit the extension freeze before production
        run: |
          /usr/bin/python3 revisions/2026-10-09-r55/code/tests_tube55.py 2>&1 | tee revisions/2026-10-09-r55/audit/DEVELOPMENT_TUBE55.log
          /usr/bin/python3 revisions/2026-10-09-r55/code/execute_tube55.py --freeze
          git config user.name 'NBO sensitivity verification'
          git config user.email 'nbo-revision@users.noreply.github.com'
          git add -f revisions/2026-10-09-r55/audit/DEVELOPMENT_TUBE55.log revisions/2026-10-09-r55/audit/SOURCE_FREEZE55_TUBE.json
          git commit -m 'R55: freeze signed sensitivity science and fresh prospective inference before extension execution'
          git push --atomic origin HEAD:refs/heads/revision/econometrica-nbo-r55-referee-revision-2026-10-09 HEAD:refs/heads/revision/econometrica-nbo-r55-source-2026-10-09
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  study:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - d: 2
            T: 2
          - d: 4
            T: 4
          - d: 8
            T: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.freeze.outputs.source_sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: revisions/2026-10-09-r55
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-numpy python3-scipy python3-sklearn
      - run: /usr/bin/python3 revisions/2026-10-09-r55/code/execute_tube55.py --cohort --d ${{ matrix.d }} --T ${{ matrix.T }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r55-tube-d${{ matrix.d }}-T${{ matrix.T }}
          path: revisions/2026-10-09-r55/results55-tube/
          compression-level: 1
          retention-days: 30
  deposit:
    needs: [freeze, study]
    if: always() && needs.freeze.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revision/econometrica-nbo-r55-referee-revision-2026-10-09
          fetch-depth: 50
          filter: blob:none
          sparse-checkout: revisions/2026-10-09-r55
      - uses: actions/download-artifact@v4
        with:
          pattern: nbo-r55-tube-d*
          merge-multiple: true
          path: revisions/2026-10-09-r55/results55-tube
      - name: Deposit every complete or partial extension service
        env:
          STUDY_STATUS: ${{ needs.study.result }}
          FROZEN_SHA: ${{ needs.freeze.outputs.source_sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          r=Path('revisions/2026-10-09-r55')
          freeze=json.loads((r/'audit/SOURCE_FREEZE55_TUBE.json').read_text())
          for name,h in freeze['files_sha256'].items():
              if hashlib.sha256((r/name).read_bytes()).hexdigest()!=h:raise AssertionError(name)
          files={str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for p in (r/'results55-tube').rglob('*') if p.is_file()}
          result=dict(status='executed' if os.environ['STUDY_STATUS']=='success' else 'partial_execution',frozen_source_commit=os.environ['FROZEN_SHA'],workflow_run=os.environ['GITHUB_RUN_ID'],files_sha256=files)
          (r/'audit/EXECUTION55_TUBE.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:v for k,v in result.items() if k!='files_sha256'}))
          PY
          git config user.name 'NBO sensitivity verification'
          git config user.email 'nbo-revision@users.noreply.github.com'
          git add -f revisions/2026-10-09-r55/results55-tube revisions/2026-10-09-r55/audit/EXECUTION55_TUBE.json
          git commit -m 'R55: retain signed sensitivity prospective results with all actual-cost endpoints and complete work'
          git push origin HEAD:refs/heads/revision/econometrica-nbo-r55-referee-revision-2026-10-09
      - uses: actions/upload-artifact@v4
        with:
          name: nbo-r55-tube-for-publication
          path: |
            revisions/2026-10-09-r55/results55-tube/
            revisions/2026-10-09-r55/audit/*TUBE*
            revisions/2026-10-09-r55/code/*tube55*
            revisions/2026-10-09-r55/STUDY_PROTOCOL55_TUBE.md
          compression-level: 1
          retention-days: 30
