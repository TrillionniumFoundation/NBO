name: NBO R34 publication inputs
on:
  push:
    branches: [revision/econometrica-nbo-r34-integrated-2026-10-06]
    paths: [.github/workflows/nbo-r34-publication-inputs.yml]
permissions:
  contents: read
  actions: write
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Export pinned post-review derivations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import concurrent.futures, hashlib, json, os, pathlib, re, time, urllib.request, urllib.parse, urllib.error, zipfile
          repo='TrillionniumFoundation/NBO'; ref='5e28283a99f00b3b28f8890abc464b3cd256fa6f'
          headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'User-Agent':'NBO-R34-source-export','Accept':'application/vnd.github+json'}
          try:
              urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/'+repo+'/actions/runs/37465509453/cancel',headers=headers,method='POST'),timeout=30).read()
          except Exception: pass
          def request(url):
              for k in range(5):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=90) as h: return h.read()
                  except (OSError, urllib.error.HTTPError):
                      if k==4: raise
                      time.sleep(k+1)
          trees={}
          def tree(sha):
              if sha not in trees:
                  obj=json.loads(request('https://api.github.com/repos/'+repo+'/git/trees/'+sha))
                  if obj.get('truncated'): raise RuntimeError('Truncated nonrecursive tree '+sha)
                  trees[sha]=obj
              return trees[sha]
          chosen=[]
          extensions={'.tex','.py','.bib','.bst','.cls','.cfg','.md','.sh','.yml','.yaml'}
          skip={'services','candidates','primary','replay','node_modules','.git','__pycache__','transport','checkpoints','runs','raw','pdf','build'}
          def walk(sha,prefix=''):
              for item in tree(sha)['tree']:
                  name=prefix+item['path']; p=pathlib.PurePosixPath(name)
                  if item['type']=='tree':
                      if item['path'] not in skip: walk(item['sha'],name+'/')
                  elif item['type']=='blob' and (p.suffix in extensions or (p.suffix=='.json' and item.get('size',0)<=200000)):
                      chosen.append(dict(item,path=name))
          root=tree(ref)
          revisions=next(x['sha'] for x in root['tree'] if x['path']=='revisions')
          for item in root['tree']:
              if item['type']=='blob' and pathlib.PurePosixPath(item['path']).suffix in extensions: chosen.append(item)
          for item in tree(revisions)['tree']:
              if item['type']=='tree' and re.search(r'-r(?:2[2-9]|3[0-3])(?:-|$)',item['path']):
                  print('Source subtree',item['path'],flush=True)
                  walk(item['sha'],'revisions/'+item['path']+'/')
          print('Selected',len(chosen),'inputs across',len(trees),'trees',flush=True)
          out=pathlib.Path('/tmp/source'); out.mkdir()
          def save(item):
              path=item['path']; data=request('https://raw.githubusercontent.com/'+repo+'/'+ref+'/'+urllib.parse.quote(path,safe='/'))
              actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if actual!=item['sha']: raise RuntimeError('Blob mismatch: '+path)
              dest=out/path; dest.parent.mkdir(parents=True,exist_ok=True); dest.write_bytes(data)
              return {'path':path,'git_blob_sha':actual,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool: records=list(pool.map(save,chosen))
          manifest={'source_commit':ref,'tree_sha':root['sha'],'files':records,'excluded_directory_names':sorted(skip),'scope':'R22-R33 scientific sources and bounded metadata. Historical publication is separately pinned to R21 artifact 11334475728; raw records remain in the repository.'}
          (out/'R34_SOURCE_INPUTS.json').write_text(json.dumps(manifest,indent=2))
          with zipfile.ZipFile('/tmp/NBO_R34_source_inputs.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(out.rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(out))
          print(json.dumps({'files':len(records),'bytes':sum(r['bytes'] for r in records),'source_commit':ref}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nbo-r34-source-inputs
          path: /tmp/NBO_R34_source_inputs.zip
          retention-days: 14
